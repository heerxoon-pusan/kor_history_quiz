<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>한국사 심화 복습 (신중 풀이)</title>
<meta name="description" content="한국사능력검정시험 심화 복습 문제풀이 - 새 문제 첫 시도 정답 + 재도전 방식">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0F766E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📜%3C/text%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2F5; --surface:#FFFFFF; --ink:#101828; --muted:#5B6676; --line:#D5DCE4;
  --ok:#12805C; --okbg:#E4F5EE; --bad:#B42318; --badbg:#FDECEA;
  --s1:#0F766E; --s2:#4338CA; --s3:#B45309; --btn:#101828; --btnink:#FFFFFF;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E141B; --surface:#16202B; --ink:#E7ECF2; --muted:#93A0B0; --line:#2A3644;
    --ok:#4CC38A; --okbg:#12291F; --bad:#FF8A80; --badbg:#34181A;
    --s1:#2DD4BF; --s2:#A5B4FC; --s3:#FBBF24; --btn:#E7ECF2; --btnink:#0E141B;
  }
}
:root[data-theme="dark"]{
  --bg:#0E141B; --surface:#16202B; --ink:#E7ECF2; --muted:#93A0B0; --line:#2A3644;
  --ok:#4CC38A; --okbg:#12291F; --bad:#FF8A80; --badbg:#34181A;
  --s1:#2DD4BF; --s2:#A5B4FC; --s3:#FBBF24; --btn:#E7ECF2; --btnink:#0E141B;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;line-height:1.55;-webkit-text-size-adjust:100%}
#app{max-width:560px;margin:0 auto;padding:20px 16px 48px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc,var(--ink));outline-offset:2px}
.s1{--acc:var(--s1)}.s2{--acc:var(--s2)}.s3{--acc:var(--s3)}

h1{font-size:1.5rem;font-weight:900;margin:8px 0 4px;letter-spacing:-.02em}
.sub{color:var(--muted);margin:0 0 20px;font-size:.95rem}
.who{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:16px}
.who b{font-weight:700}
.link{background:none;border:0;padding:6px 4px;color:var(--muted);text-decoration:underline;font-size:.85rem}

.field{display:flex;gap:8px;margin:12px 0 4px}
.field input{flex:1;min-width:0;font:inherit;padding:14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
.btn{background:var(--btn);color:var(--btnink);border:0;border-radius:12px;padding:14px 20px;font-weight:700;min-height:48px}
.btn.wide{width:100%;margin-top:16px}
.btn.line{background:transparent;color:var(--ink);border:1.5px solid var(--line)}

.subjects{display:grid;gap:12px}
.card{display:block;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-left:8px solid var(--acc);border-radius:14px;padding:16px 16px 14px}
.card .n{font-weight:900;font-size:1.15rem;color:var(--acc)}
.card .t{font-weight:700;margin:2px 0 6px}
.card .m{font-size:.85rem;color:var(--muted)}
.card.done{background:var(--okbg)}
.badge{display:inline-block;font-size:.8rem;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--acc);color:var(--surface);margin-top:8px}
.redo{margin-top:4px}

.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.chip{font-weight:700;font-size:.85rem;padding:3px 12px;border-radius:999px;border:1.5px solid var(--acc);color:var(--acc)}
.count{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;display:inline-block}
.bar{height:8px;background:var(--line);border-radius:999px;overflow:hidden;margin-bottom:22px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:999px;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.topic{font-size:.85rem;color:var(--muted);margin-bottom:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hot{font-size:.75rem;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--acc);color:var(--surface)}
.q{font-size:1.2rem;font-weight:700;line-height:1.5;margin:0 0 18px;letter-spacing:-.01em;word-break:keep-all}
.choices{display:grid;gap:10px}
.choice{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:14px 14px;min-height:54px;word-break:keep-all;position:relative;transition:background-color .25s,border-color .25s,opacity .3s,transform .15s;animation:rise .45s cubic-bezier(.2,.7,.2,1) backwards;animation-delay:calc(var(--i,0)*65ms + 140ms)}
.choice .k{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:.85rem;font-weight:700;color:var(--muted)}
.choice.ox{justify-content:center;align-items:center;font-weight:700;font-size:1.05rem}
.choice.ok{border-color:var(--ok);background:var(--okbg)}
.choice.ok .k{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.choice.bad{border-color:var(--bad);background:var(--badbg)}
.choice.bad .k{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.choice.dim{opacity:.55}
.fb{margin-top:16px;border-radius:12px;padding:14px 16px;border:1.5px solid}
.fb.ok{border-color:var(--ok);background:var(--okbg)}
.fb.bad{border-color:var(--bad);background:var(--badbg)}
.fb b{display:block;margin-bottom:4px}
.fb.ok b{color:var(--ok)}.fb.bad b{color:var(--bad)}
.fb p{margin:0;font-size:.95rem}
.fb .src{margin-top:6px;font-size:.8rem;color:var(--muted)}

.cert{background:var(--surface);border:2px solid var(--acc);border-radius:18px;padding:22px 18px;text-align:center}
.cert .h{font-weight:700;color:var(--acc);font-size:1rem}
.cert .name{font-size:2.1rem;font-weight:900;margin:8px 0 2px;letter-spacing:-.02em}
.cert .subj{color:var(--muted);margin-bottom:14px}
.cert .score{font-size:3.4rem;font-weight:900;color:var(--acc);line-height:1;font-variant-numeric:tabular-nums}
.cert .score small{font-size:1.2rem;font-weight:700;color:var(--muted)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0}
.stats div{border:1.5px solid var(--line);border-radius:12px;padding:8px}
.stats span{display:block;font-size:.78rem;color:var(--muted)}
.stats b{font-variant-numeric:tabular-nums}
.clock{border:1.5px dashed var(--acc);border-radius:14px;padding:12px 8px;margin-top:6px}
.clock span{display:block;font-size:.78rem;color:var(--muted)}
.clock b{font-size:1.9rem;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.clock .d{font-size:.9rem;font-weight:500;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--ok);margin-right:6px;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
.code{margin-top:12px;font-size:.85rem;color:var(--muted)}
.code b{color:var(--ink);letter-spacing:.12em}
.actions{display:grid;gap:8px;margin-top:16px}

/* ---------- 애니메이션 ---------- */
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes enterR{from{opacity:0;transform:translateX(34px)}to{opacity:1;transform:none}}
@keyframes leaveL{to{opacity:0;transform:translateX(-34px)}}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.045)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}18%{transform:translateX(-9px)}38%{transform:translateX(8px)}58%{transform:translateX(-5px)}78%{transform:translateX(3px)}}
@keyframes ring{0%{box-shadow:0 0 0 0 var(--ok)}100%{box-shadow:0 0 0 14px transparent}}
@keyframes kpop{from{transform:scale(.2) rotate(-40deg)}to{transform:scale(1) rotate(0)}}
@keyframes bump{40%{transform:scale(1.4);color:var(--acc)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes certIn{from{opacity:0;transform:scale(.86) translateY(24px)}to{opacity:1;transform:none}}
.rise{animation:rise .5s cubic-bezier(.2,.7,.2,1) backwards;animation-delay:calc(var(--i,0)*70ms)}
.qwrap{animation:enterR .38s cubic-bezier(.2,.7,.2,1) backwards}
.qwrap.leave{animation:leaveL .22s ease-in forwards;pointer-events:none}
.q{animation:rise .5s .05s cubic-bezier(.2,.7,.2,1) backwards}
.choice:active:not(:disabled){transform:scale(.985)}
@media (hover:hover){.choice:not(:disabled):hover{border-color:var(--acc)}.card:hover{transform:translateY(-2px)}}
.card{transition:transform .2s,border-color .2s}
.card:active{transform:scale(.99)}
.choice.ok.picked{animation:pop .5s cubic-bezier(.3,1.5,.5,1),ring .8s ease-out}
.choice.bad.picked{animation:shake .5s}
.choice.ok.late{transition-delay:.3s;animation:ring .9s .3s ease-out}
.choice.ok .k,.choice.bad .k{animation:kpop .4s .05s cubic-bezier(.3,1.6,.5,1) backwards}
.choice.ok.late .k{animation-delay:.35s}
.count.bump{animation:bump .5s}
.fb{animation:rise .42s .05s cubic-bezier(.2,.7,.2,1) backwards}
.nx{animation:rise .42s .2s cubic-bezier(.2,.7,.2,1) backwards}
.fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.fp{position:absolute;display:block;will-change:transform,opacity}
.cert{animation:certIn .7s cubic-bezier(.2,1.15,.3,1) backwards}
.chk{width:68px;height:68px;display:block;margin:0 auto 6px;fill:none;stroke:var(--acc);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.chk circle{stroke-dasharray:145;stroke-dashoffset:145;animation:draw .7s .15s ease-out forwards}
.chk path{stroke-dasharray:40;stroke-dashoffset:40;animation:draw .45s .75s ease-out forwards}
.stats div{animation:rise .5s cubic-bezier(.2,.7,.2,1) backwards;animation-delay:calc(var(--j,0)*80ms + 650ms)}
.clock{animation:rise .5s 1.05s cubic-bezier(.2,.7,.2,1) backwards}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .chk circle,.chk path{stroke-dashoffset:0}
}

/* ---------- 신중 풀이 버전 추가 스타일 ---------- */
.stat{margin:0 0 10px;font-weight:700;font-size:.95rem;font-variant-numeric:tabular-nums}
.stat b{display:inline-block}
.stat .dim2{color:var(--muted);font-weight:500;margin:0 2px}
.stat b.bump{animation:bump .5s}
.retry{font-size:.75rem;font-weight:700;padding:1px 8px;border-radius:999px;border:1.5px solid var(--bad);color:var(--bad)}
.notice{margin-top:16px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--bad);background:var(--badbg);font-size:.92rem;animation:rise .42s .02s cubic-bezier(.2,.7,.2,1) backwards}
.notice b{color:var(--bad)}
.fb .part{margin-top:12px}
.fb .part i{display:block;font-style:normal;font-size:.75rem;font-weight:700;color:var(--muted);margin-bottom:2px}
.fb .part p{word-break:keep-all}
.fb b.ans{display:block;margin-bottom:2px;color:var(--ok)}
.fb .tip{margin-top:10px;font-size:.9rem;padding:8px 10px;border-radius:10px;background:var(--surface);border:1px dashed var(--line)}
.intro .msg{font-size:1.15rem;font-weight:700;margin:10px 0 4px;word-break:keep-all;line-height:1.6}
.intro .stats{margin-bottom:4px}
.passage{margin:-4px 0 18px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);border-left:5px solid var(--acc);background:var(--surface);font-size:.95rem;line-height:1.75;word-break:keep-all;animation:rise .5s .1s cubic-bezier(.2,.7,.2,1) backwards}
.passage i{display:block;font-style:normal;font-size:.72rem;font-weight:700;color:var(--muted);margin-bottom:4px;letter-spacing:.04em}
</style>
</head>
<body>
<div id="app"></div>
<script>

const BANK = {"1":[{"id":"K1-001","t":"01강 역사는 왜 배우는가","q":"‘기록으로서의 역사’에 해당하는 설명으로 옳은 것은?","c":["랑케가 강조한 ‘본래 있었던 그대로’의 역사를 말한다","역사가가 과거 사실을 선택하고 해석하여 기록한 것이다","역사가의 주관을 철저히 배제한 객관적 사실만을 뜻한다","과거에 실제로 있었던 사건 그 자체를 뜻한다"],"a":1,"e":"기록으로서의 역사는 역사가의 관점과 해석이 담긴 주관적 의미의 역사입니다.","tip":"사실 = 객관(랑케), 기록 = 주관(카).","w":["랑케는 사실로서의 역사를 강조했습니다.","","객관성을 강조하는 사실로서의 역사 관점입니다.","사실로서의 역사(객관적 의미)입니다."],"p":"01강 역사는 왜 배우는가 › 역사의 의미","h":0},
{"id":"K1-002","t":"01강 역사는 왜 배우는가","q":"E. H. 카는 ‘역사는 현재와 과거 사이의 끊임없는 대화’라고 하여 역사가의 해석을 중시하였다.","c":["맞다","틀리다"],"a":0,"e":"카는 역사가와 사실의 상호 작용을 강조해 기록으로서의 역사를 중시했습니다.","tip":"카 = 대화 = 해석.","w":["","이 설명은 옳은 내용입니다. 해설을 확인하세요."],"p":"01강 역사는 왜 배우는가 › 역사의 의미","h":0},
{"id":"K1-003","t":"01강 역사는 왜 배우는가","q":"사료의 작성 시기와 저자, 진위 여부를 확인하는 작업은?","c":["외적 비판","역사 서술","내적 비판","사료 해석"],"a":0,"e":"외적 비판은 사료 자체(진위·저자·연대)를, 내적 비판은 사료 내용의 사실 여부를 검토합니다.","tip":"겉(외) = 진짜 문서인가, 속(내) = 내용이 맞는가.","w":["","사료 분석 이후의 기록 단계입니다.","사료 내용의 신빙성을 따지는 작업입니다.","비판을 거친 뒤 의미를 읽어내는 단계입니다."],"p":"01강 역사는 왜 배우는가 › 사료 비판","h":0},
{"id":"K1-004","t":"01강 역사는 왜 배우는가","q":"역사를 배우면 과거를 통해 현재를 이해하고 미래를 전망하는 능력을 기를 수 있다.","c":["맞다","틀리다"],"a":0,"e":"역사 학습은 현재 이해, 교훈 획득, 비판적 사고와 정체성 형성에 도움을 줍니다.","tip":"과거 → 현재 이해 → 미래 전망.","w":["","이 설명은 옳은 내용입니다. 해설을 확인하세요."],"p":"01강 역사는 왜 배우는가 › 역사 학습의 목적","h":0},
{"id":"K1-005","t":"02강 선사 시대","q":"다음 유물이 처음 사용된 시대의 생활 모습으로 옳은 것은?","c":["철제 농기구를 사용하여 농업 생산력이 높아졌다","빗살무늬 토기에 곡식을 저장하였다","반달 돌칼로 벼 이삭을 수확하였다","동굴이나 강가의 막집에 살며 무리 지어 이동 생활을 하였다"],"a":3,"e":"구석기 시대에는 뗀석기를 사용하며 사냥·채집으로 생활하고 이동 생활을 했습니다. 전곡리 주먹도끼는 아슐리안형 주먹도끼입니다.","tip":"뗀석기·막집·이동 = 구석기.","w":["철기 시대의 모습입니다.","신석기 시대의 모습입니다.","청동기 시대의 모습입니다.",""],"p":"02강 선사 시대 › 구석기 시대","h":1,"d":"연천 전곡리에서 출토된 주먹도끼, 찍개, 긁개 등의 뗀석기"},
{"id":"K1-006","t":"02강 선사 시대","q":"서울 암사동 유적이 만들어진 시대의 생활 모습으로 옳은 것은?","c":["가락바퀴와 뼈바늘로 옷이나 그물을 만들었다","명도전, 반량전 등 중국 화폐를 사용하였다","비파형 동검을 제작하였다","지배층의 무덤으로 고인돌을 만들었다"],"a":0,"e":"신석기 시대에는 간석기와 빗살무늬 토기를 쓰고, 농경(조·피)과 원시 수공업(가락바퀴·뼈바늘)이 시작되었습니다.","tip":"빗살무늬·움집·가락바퀴 = 신석기.","w":["","철기 시대의 교류 모습입니다.","청동기 시대의 유물입니다.","청동기 시대의 무덤입니다."],"p":"02강 선사 시대 › 신석기 시대","h":1,"d":"움집 터와 함께 빗살무늬 토기가 다량 출토되었다."},
{"id":"K1-007","t":"02강 선사 시대","q":"다음 유적이 만들어진 시대의 사회 모습으로 옳은 것은?","c":["창원 다호리에서 붓을 사용해 문자를 기록하였다","주먹도끼로 사냥과 채집을 하며 이동하였다","계급이 발생하여 지배자의 무덤으로 고인돌을 만들었다","빗살무늬 토기를 처음 만들어 사용하였다"],"a":2,"e":"청동기 시대에는 벼농사가 시작되고 사유 재산·계급이 생겨 군장이 등장했으며 고인돌을 만들었습니다.","tip":"고인돌·반달 돌칼·민무늬 = 청동기.","w":["철기 시대의 모습입니다.","구석기 시대의 모습입니다.","","신석기 시대의 모습입니다."],"p":"02강 선사 시대 › 청동기 시대","h":1,"d":"부여 송국리 유적: 탄화미, 민무늬 토기, 마을 둘레의 목책과 환호"},
{"id":"K1-008","t":"02강 선사 시대","q":"창원 다호리 유적에서 붓이 출토된 시대의 모습으로 옳은 것은?","c":["세형동검을 만들고 명도전 등을 통해 중국과 교류하였다","애니미즘, 토테미즘 등 원시 신앙이 처음 나타났다","비파형 동검과 미송리식 토기를 처음 사용하였다","뗀석기를 사용하여 사냥을 하였다"],"a":0,"e":"철기 시대에는 세형동검·잔무늬 거울을 만들고, 명도전·반량전·오수전으로 중국과 교류했으며 붓은 한자 사용을 보여 줍니다.","tip":"붓·세형동검·중국 화폐 = 철기.","w":["","신석기 시대입니다.","청동기 시대입니다.","구석기 시대입니다."],"p":"02강 선사 시대 › 철기 시대","h":0},
{"id":"K1-009","t":"02강 선사 시대","q":"신석기 시대에 농경이 시작되어 조, 피 등의 잡곡을 재배하였다.","c":["맞다","틀리다"],"a":0,"e":"신석기 시대에 조·피 등을 재배하는 농경이 시작되었고, 벼농사는 청동기 시대에 시작되었습니다.","tip":"농경 시작 = 신석기, 벼농사 = 청동기.","w":["","이 설명은 옳은 내용입니다. 해설을 확인하세요."],"p":"02강 선사 시대 › 신석기 시대","h":0},
{"id":"K1-010","t":"02강 선사 시대","q":"고인돌은 신석기 시대의 대표적인 무덤이다.","c":["맞다","틀리다"],"a":1,"e":"고인돌은 청동기 시대 지배층의 무덤으로, 계급 사회를 보여 줍니다.","tip":"고인돌 = 청동기 계급.","w":["이 설명은 틀린 내용입니다. 해설에서 바른 내용을 확인하세요.",""],"p":"02강 선사 시대 › 청동기 시대","h":0},
{"id":"K1-011","t":"03강 여러 나라의 성장","q":"다음 사건 이후 고조선의 모습으로 옳은 것은?","c":["연의 장수 진개의 공격을 받아 서쪽 땅을 빼앗겼다","대가들이 사자, 조의, 선인 등의 관리를 거느렸다","부왕, 준왕 등이 왕위를 세습하였다","한과 남방의 진 사이에서 중계 무역으로 이익을 얻었다"],"a":3,"e":"위만 조선은 철기 문화를 본격 수용하고 한과 진 사이의 중계 무역으로 성장했으나 한 무제의 침입으로 멸망(기원전 108)했습니다.","tip":"위만 이후 = 철기 본격·중계 무역.","w":["위만 집권 이전(기원전 3세기)의 일입니다.","고구려의 모습입니다.","위만 집권 이전의 모습입니다.",""],"p":"03강 여러 나라의 성장 › 고조선","h":1,"d":"연에서 망명한 위만이 무리 천여 명을 이끌고 와서 서쪽 변경을 지키다가, 세력을 키워 준왕을 몰아내고 왕이 되었다."},
{"id":"K1-012","t":"03강 여러 나라의 성장","q":"다음 자료의 나라에 대한 설명으로 옳은 것은?","c":["혼인 후 신부 집 뒤에 서옥을 짓고 살았다","다른 읍락을 침범하면 노비와 소, 말로 변상하였다","천군이 소도라는 신성 지역을 다스렸다","12월에 영고라는 제천 행사를 열었다"],"a":3,"e":"부여는 5부족 연맹 왕국으로 사출도, 영고(12월), 1책 12법, 순장, 우제점법이 특징입니다.","tip":"부여 = 사출도·영고·12월.","w":["고구려의 서옥제입니다.","동예의 책화입니다.","삼한의 모습입니다.",""],"p":"03강 여러 나라의 성장 › 부여","h":1,"d":"가축 이름으로 관직명을 정하여 마가, 우가, 저가, 구가가 있다. 이들은 사출도를 다스린다."},
{"id":"K1-013","t":"03강 여러 나라의 성장","q":"다음 자료의 나라에 대한 설명으로 옳은 것은?","c":["10월에 무천이라는 제천 행사를 열었다","10월에 동맹이라는 제천 행사를 열었다","여자가 어릴 때 남자 집에 가서 살다가 성인이 되면 혼인하였다","12월에 영고를 열고 죄수를 풀어 주었다"],"a":1,"e":"고구려는 서옥제, 제가 회의, 동맹(10월), 부경(창고)이 특징입니다.","tip":"고구려 = 서옥제·동맹.","w":["동예의 제천 행사입니다.","","옥저의 민며느리제입니다.","부여의 제천 행사입니다."],"p":"03강 여러 나라의 성장 › 고구려(초기)","h":1,"d":"혼인을 정하면 신부 집 뒤에 작은 별채를 짓고 사위가 머물다가 자식을 낳아 장성하면 아내를 데리고 돌아간다."},
{"id":"K1-014","t":"03강 여러 나라의 성장","q":"다음 자료의 나라에 대한 설명으로 옳은 것은?","c":["단궁, 과하마, 반어피가 특산물로 유명하였다","다른 부족의 영역을 침범하면 노비나 소, 말로 변상하였다","마가, 우가 등이 사출도를 다스렸다","가족이 죽으면 뼈를 추려 가족 공동 무덤인 커다란 목곽에 안치하였다"],"a":3,"e":"옥저는 민며느리제와 가족 공동 무덤(골장제)이 특징이며, 읍군·삼로가 통치하고 고구려에 공물을 바쳤습니다.","tip":"옥저 = 민며느리·가족 공동 무덤.","w":["동예의 특산물입니다.","동예의 책화입니다.","부여의 모습입니다.",""],"p":"03강 여러 나라의 성장 › 옥저","h":0,"d":"여자 나이 10살이 되기 전에 혼인을 약속하고 신랑 집에서 길러 성인이 되면 친정으로 돌려보냈다가 신랑 집에서 돈을 치르고 다시 데려간다."},
{"id":"K1-015","t":"03강 여러 나라의 성장","q":"다음 자료의 나라에 대한 설명으로 옳은 것은?","c":["단궁, 과하마, 반어피 등의 특산물이 유명하였다","천군이 다스리는 소도가 있었다","가족 공동 무덤인 목곽에 뼈를 추려 안치하였다","도둑질한 자에게 12배를 배상하게 하였다"],"a":0,"e":"동예는 책화, 족외혼, 무천(10월), 단궁·과하마·반어피가 특징입니다.","tip":"동예 = 책화·무천·단궁.","w":["","삼한의 모습입니다.","옥저의 풍습입니다.","부여·고구려의 1책 12법입니다."],"p":"03강 여러 나라의 성장 › 동예","h":1,"d":"읍락을 함부로 침범하면 벌로 노비와 소, 말을 물어내게 하였는데 이를 책화라 한다."},
{"id":"K1-016","t":"03강 여러 나라의 성장","q":"다음 자료의 나라에 대한 설명으로 옳은 것은?","c":["왕 아래 제가들이 모여 제가 회의를 열었다","변한은 철을 많이 생산하여 낙랑과 왜에 수출하였다","읍락 간의 경계를 침범하면 책화가 있었다","사출도를 두어 지방을 다스렸다"],"a":1,"e":"삼한은 신지·읍차(군장)와 천군(제사장)이 분리된 제정 분리 사회였고, 변한의 철은 화폐처럼 쓰였습니다.","tip":"소도·천군 = 삼한(제정 분리).","w":["고구려의 모습입니다.","","동예의 풍습입니다.","부여의 모습입니다."],"p":"03강 여러 나라의 성장 › 삼한","h":1,"d":"천군이라는 제사장이 있었고, 별읍인 소도에 큰 나무를 세우고 방울과 북을 달아 귀신을 섬겼다. 죄인이 이곳으로 도망하면 잡아가지 못하였다."},
{"id":"K1-017","t":"03강 여러 나라의 성장","q":"부여와 고구려에는 도둑질한 자에게 12배를 배상하게 하는 1책 12법이 있었다.","c":["맞다","틀리다"],"a":0,"e":"1책 12법은 부여와 고구려에 공통으로 나타나는 엄격한 법입니다.","tip":"12배 배상 = 부여·고구려.","w":["","이 설명은 옳은 내용입니다. 해설을 확인하세요."],"p":"03강 여러 나라의 성장 › 부여·고구려","h":0},
{"id":"K1-018","t":"04강 고대(고구려, 가야)","q":"다음 상황 직후 즉위한 왕의 업적으로 옳은 것은?","c":["태학을 설립하고 율령을 반포하였다","을파소를 등용하여 진대법을 실시하였다","서안평을 점령하고 낙랑군을 축출하였다","평양으로 도읍을 옮겼다"],"a":0,"e":"고국원왕 전사 후 즉위한 소수림왕은 불교 수용(372), 태학 설립, 율령 반포(373)로 체제를 정비했습니다.","tip":"소수림 = 불교·태학·율령.","w":["","고국천왕의 업적입니다.","미천왕의 업적입니다.","장수왕의 업적입니다."],"p":"04강 고대(고구려, 가야) › 고구려 소수림왕","h":1,"d":"백제 왕이 군사 3만을 거느리고 평양성을 공격하자 왕이 군사를 이끌고 막다가 날아온 화살에 맞아 세상을 떠났다."},
{"id":"K1-019","t":"04강 고대(고구려, 가야)","q":"다음 자료에 나타난 왕의 업적으로 옳은 것은?","c":["천리장성 축조를 시작하였다","백제의 수도 한성을 함락하였다","후연을 공격하여 요동 지역을 확보하였다","태학을 설립하였다"],"a":2,"e":"광개토 대왕은 ‘영락’ 연호를 쓰고 후연·거란·숙신을 정벌했으며, 신라에 침입한 왜를 격퇴했습니다(400).","tip":"영락·신라 구원 = 광개토 대왕.","w":["영류왕 때의 일입니다.","장수왕의 업적입니다.","","소수림왕의 업적입니다."],"p":"04강 고대(고구려, 가야) › 고구려 광개토 대왕","h":1,"d":"영락 10년, 왕이 보병과 기병 5만 명을 보내 신라를 구원하게 하였다. 관군이 이르자 왜적이 물러갔다."},
{"id":"K1-020","t":"04강 고대(고구려, 가야)","q":"다음 사건을 일으킨 왕의 업적으로 옳은 것은?","c":["동해안의 옥저를 정복하였다","살수에서 수의 군대를 크게 물리쳤다","평양으로 도읍을 옮기고 남진 정책을 추진하였다","신라에 군사를 보내 왜를 격퇴하였다"],"a":2,"e":"장수왕은 평양 천도(427), 한성 함락(475), 충주 고구려비 건립, 남북조 등거리 외교를 펼쳤습니다.","tip":"장수왕 = 평양 천도·한성 함락.","w":["태조왕의 업적입니다.","영양왕 때 을지문덕의 승리입니다.","","광개토 대왕의 업적입니다."],"p":"04강 고대(고구려, 가야) › 고구려 장수왕","h":1,"d":"왕이 군사 3만을 거느리고 백제 수도 한성을 함락하고 개로왕을 죽였다."},
{"id":"K1-021","t":"04강 고대(고구려, 가야)","q":"을파소를 등용하여 진대법을 실시한 왕의 재위 시기 사실로 옳은 것은?","c":["전진의 순도를 통해 불교를 수용하였다","왕위 계승이 형제 상속에서 부자 상속으로 바뀌었다","서안평을 점령하였다","부여를 완전히 복속하였다"],"a":1,"e":"고국천왕은 진대법 실시, 왕위 부자 상속 확립, 5부의 행정적 개편을 추진했습니다.","tip":"진대법(춘대추납) = 고국천왕.","w":["소수림왕 때입니다.","","미천왕 때입니다.","문자명왕 때입니다."],"p":"04강 고대(고구려, 가야) › 고구려 고국천왕","h":0},
{"id":"K1-022","t":"04강 고대(고구려, 가야)","q":"다음 사건을 일어난 순서대로 바르게 나열한 것은?","c":["(나) - (다) - (가)","(가) - (나) - (다)","(가) - (다) - (나)","(다) - (가) - (나)"],"a":2,"e":"살수 대첩(612, 수) → 천리장성 축조 시작(631) → 연개소문 정변(642) → 안시성 전투(645, 당) 순입니다.","tip":"수(살수) → 장성 → 당(안시성).","w":["살수 대첩(612) → 천리장성(631) → 안시성(645) 순입니다.","천리장성 축조 시작(631)이 안시성 전투(645)보다 먼저입니다.","","살수 대첩(612)이 가장 먼저입니다."],"p":"04강 고대(고구려, 가야) › 고구려와 수·당 전쟁","h":0,"d":"(가) 살수 대첩 (나) 안시성 전투 (다) 천리장성 축조 시작"},
{"id":"K1-023","t":"04강 고대(고구려, 가야)","q":"다음 자료의 나라에 대한 설명으로 옳은 것은?","c":["진흥왕이 보낸 이사부의 군대에 의해 멸망하였다","지방에 22담로를 두어 왕족을 파견하였다","우륵이 가야금을 만들어 연주하였다","전기 가야 연맹을 주도하였다"],"a":3,"e":"금관가야는 전기 가야 연맹을 주도했으나 광개토 대왕의 공격으로 쇠퇴했고, 법흥왕 때 신라에 병합(532)되었습니다.","tip":"김수로·전기 연맹 = 금관가야(김해).","w":["대가야의 멸망(562)입니다.","백제 무령왕의 정책입니다.","대가야의 이야기입니다.",""],"p":"04강 고대(고구려, 가야) › 금관가야","h":1,"d":"김수로가 구지봉에서 내려온 알에서 태어나 나라를 세웠다고 전한다."},
{"id":"K1-024","t":"04강 고대(고구려, 가야)","q":"다음 자료의 나라에 대한 설명으로 옳은 것은?","c":["광개토 대왕의 공격으로 크게 쇠퇴하였다","김수로가 건국하였다","읍군과 삼로가 읍락을 다스렸다","신라 법흥왕과 결혼 동맹을 맺었다"],"a":3,"e":"대가야(고령)는 후기 가야 연맹을 이끌었으며, 신라와 결혼 동맹을 맺었으나 진흥왕 때 멸망(562)했습니다.","tip":"우륵·고령·후기 연맹 = 대가야.","w":["금관가야의 사정입니다.","금관가야의 건국 설화입니다.","옥저·동예의 모습입니다.",""],"p":"04강 고대(고구려, 가야) › 대가야","h":0,"d":"가실왕이 12줄 현악기를 만들고 우륵에게 곡을 짓게 하였다."},
{"id":"K1-025","t":"04강 고대(고구려, 가야)","q":"미천왕은 서안평을 점령하고 낙랑군을 축출하였다.","c":["맞다","틀리다"],"a":0,"e":"미천왕은 서안평 점령(311), 낙랑군 축출(313)로 대동강 유역을 확보했습니다.","tip":"미천왕 = 낙랑 축출.","w":["","이 설명은 옳은 내용입니다. 해설을 확인하세요."],"p":"04강 고대(고구려, 가야) › 고구려 미천왕","h":0},
{"id":"K1-026","t":"05강 고대(백제, 신라)","q":"다음 사건이 일어난 왕의 재위 시기 사실로 옳은 것은?","c":["마한의 남은 세력을 정복하여 남해안까지 영역을 넓혔다","동진에서 온 마라난타를 통해 불교를 수용하였다","도읍을 사비로 옮겼다","지방의 22담로에 왕족을 파견하였다"],"a":0,"e":"근초고왕은 마한 정복, 평양성 공격, 왕위 부자 상속, 고흥의 『서기』 편찬, 칠지도 하사 등으로 전성기를 열었습니다.","tip":"평양성 공격(고국원왕 전사) = 근초고왕.","w":["","침류왕 때입니다.","성왕의 업적입니다.","무령왕의 업적입니다."],"p":"05강 고대(백제, 신라) › 백제 근초고왕","h":1,"d":"왕이 태자와 함께 정예군 3만을 이끌고 고구려 평양성을 공격하자 고구려 왕 사유가 힘써 싸우다 화살에 맞아 죽었다."},
{"id":"K1-027","t":"05강 고대(백제, 신라)","q":"다음 자료의 왕에 대한 설명으로 옳은 것은?","c":["익산에 미륵사를 창건하였다","신라와 연합하여 한강 하류 지역을 일시 회복하였다","고구려의 공격으로 웅진으로 도읍을 옮겼다","6좌평과 16관등제를 마련하였다"],"a":1,"e":"성왕은 사비 천도(538), 22부 정비, 5부 5방, 한강 하류 회복(551)을 이뤘으나 관산성 전투에서 전사(554)했습니다.","tip":"사비·남부여·관산성 = 성왕.","w":["무왕의 업적입니다.","","문주왕 때의 일입니다.","고이왕의 업적입니다."],"p":"05강 고대(백제, 신라) › 백제 성왕","h":1,"d":"왕이 도읍을 사비로 옮기고 나라 이름을 남부여라 하였다."},
{"id":"K1-028","t":"05강 고대(백제, 신라)","q":"다음 무덤의 주인공인 왕의 업적으로 옳은 것은?","c":["북위에 국서를 보내 고구려 견제를 요청하였다","지방의 22담로에 왕족을 파견하였다","관산성 전투에서 전사하였다","신라 소지 마립간과 결혼 동맹을 맺었다"],"a":1,"e":"무령왕은 22담로에 왕족을 보내 지방 통제를 강화하고 양과 교류했습니다. 무령왕릉은 남조 양식의 벽돌무덤입니다.","tip":"벽돌무덤·지석 = 무령왕(22담로).","w":["개로왕의 일입니다.","","성왕의 일입니다.","동성왕의 업적입니다."],"p":"05강 고대(백제, 신라) › 백제 무령왕","h":0,"d":"공주에서 발견된 벽돌무덤으로, 중국 남조 양의 영향을 받았으며 무덤의 주인을 알려 주는 지석이 출토되었다."},
{"id":"K1-029","t":"05강 고대(백제, 신라)","q":"다음 자료의 왕에 대한 설명으로 옳은 것은?","c":["집사부를 설치하였다","이사부를 보내 우산국을 복속하였다","화랑도를 국가 조직으로 개편하였다","병부를 설치하고 율령을 반포하였다"],"a":1,"e":"지증왕은 국호·왕호 정비, 우경 장려, 동시전 설치, 순장 금지, 우산국 복속(512)을 이뤘습니다.","tip":"국호 신라·왕 칭호·우산국 = 지증왕.","w":["진덕 여왕의 업적입니다.","","진흥왕의 업적입니다.","법흥왕의 업적입니다."],"p":"05강 고대(백제, 신라) › 신라 지증왕","h":1,"d":"나라 이름을 신라로 확정하고 ‘마립간’ 대신 ‘왕’이라는 칭호를 사용하였다."},
{"id":"K1-030","t":"05강 고대(백제, 신라)","q":"이차돈의 순교를 계기로 불교를 공인한 왕의 업적으로 옳은 것은?","c":["거칠부에게 『국사』를 편찬하게 하였다","첨성대를 건립하였다","우경을 장려하고 동시전을 설치하였다","병부를 설치하고 율령을 반포하였다"],"a":3,"e":"법흥왕은 병부 설치, 율령 반포, 공복 제정, 상대등 설치, 불교 공인, ‘건원’ 연호, 금관가야 병합을 이뤘습니다.","tip":"법흥왕 = 율령·불교·건원.","w":["진흥왕의 업적입니다.","선덕 여왕 때입니다.","지증왕의 업적입니다.",""],"p":"05강 고대(백제, 신라) › 신라 법흥왕","h":1},
{"id":"K1-031","t":"05강 고대(백제, 신라)","q":"북한산 순수비와 단양 적성비를 세운 왕의 업적으로 옳은 것은?","c":["금관가야를 병합하였다","우산국을 복속하였다","당과 군사 동맹을 체결하였다","대가야를 정복하였다"],"a":3,"e":"진흥왕은 화랑도 개편, 한강 유역 차지, 대가야 정복(562), 순수비 건립, 『국사』 편찬, ‘개국’ 연호를 사용했습니다.","tip":"순수비·대가야 = 진흥왕.","w":["법흥왕 때(532)입니다.","지증왕 때입니다.","진덕 여왕 때(648)입니다.",""],"p":"05강 고대(백제, 신라) › 신라 진흥왕","h":1},

{"id":"K1-034","t":"06강 고대(통일 신라, 발해)","q":"다음 부흥 운동에 대한 설명으로 옳은 것은?","c":["흑치상지가 임존성에서 군사를 일으켰다","복신과 도침이 주류성을 근거로 활동하였다","신라는 안승을 고구려왕(보덕국왕)으로 삼아 지원하였다","왜의 수군이 지원하여 백강에서 전투를 벌였다"],"a":2,"e":"고구려 부흥 운동은 검모잠·안승(한성), 고연무(오골성)가 주도했고 신라는 안승을 보덕국왕으로 삼았습니다.","tip":"안승·검모잠 = 고구려 부흥.","w":["백제 부흥 운동입니다.","백제 부흥 운동입니다.","","백제 부흥 운동(663)입니다."],"p":"06강 고대(통일 신라, 발해) › 고구려 부흥 운동","h":1,"d":"검모잠이 왕족 안승을 받들어 왕으로 삼고 한성(재령)을 근거지로 당에 맞섰다."},
{"id":"K1-035","t":"06강 고대(통일 신라, 발해)","q":"다음 사건 이후 즉위한 왕이 추진한 정책으로 옳은 것은?","c":["장보고를 청해진 대사로 임명하였다","백성에게 정전을 지급하였다","독서삼품과를 실시하였다","관료전을 지급하고 녹읍을 폐지하였다"],"a":3,"e":"신문왕은 김흠돌의 난 진압 후 국학 설립, 9주 5소경, 9서당 10정, 관료전 지급(687), 녹읍 폐지(689)를 추진했습니다.","tip":"김흠돌 → 신문왕(관료전·녹읍 폐지).","w":["흥덕왕 때입니다.","성덕왕의 정책입니다.","원성왕의 정책입니다.",""],"p":"06강 고대(통일 신라, 발해) › 신라 신문왕","h":1,"d":"김흠돌 등이 반역을 꾀하다 처형되었다. (왕이 즉위한 해의 일이다)"},
{"id":"K1-036","t":"06강 고대(통일 신라, 발해)","q":"다음 사건이 일어난 왕의 재위 시기 사실로 옳은 것은?","c":["국학을 설립하였다","최치원이 시무 10여 조를 건의하였다","김헌창이 웅천주에서 난을 일으켰다","녹읍이 부활하였다"],"a":1,"e":"진성 여왕 때 원종·애노의 난(889) 등 농민 봉기가 확산되었고, 최치원은 시무 10여 조(894)를 올렸습니다.","tip":"원종·애노 = 진성 여왕.","w":["신문왕 때입니다.","","헌덕왕 때(822)입니다.","경덕왕 때(757)입니다."],"p":"06강 고대(통일 신라, 발해) › 신라 진성 여왕","h":0,"d":"사벌주에서 원종과 애노가 반란을 일으켰다."},
{"id":"K1-037","t":"06강 고대(통일 신라, 발해)","q":"다음 사건이 일어난 발해 왕의 재위 시기 사실로 옳은 것은?","c":["상경으로 도읍을 옮겼다","‘인안’이라는 연호를 사용하였다","‘대흥’이라는 연호를 사용하였다","해동성국이라 불렸다"],"a":1,"e":"무왕은 인안 연호, 흑수말갈 정벌, 장문휴의 등주 공격(732), 일본과의 친교로 영토를 확장했습니다.","tip":"등주 공격 = 무왕(인안).","w":["문왕 때입니다.","","문왕의 연호입니다.","선왕 때입니다."],"p":"06강 고대(통일 신라, 발해) › 발해 무왕","h":1,"d":"장문휴가 수군을 이끌고 당의 등주를 공격하였다."},
{"id":"K1-038","t":"06강 고대(통일 신라, 발해)","q":"정효 공주 묘지에서 ‘황상’이라 불린 발해 왕의 업적으로 옳은 것은?","c":["주자감을 설치하여 인재를 양성하였다","5경 15부 62주의 지방 제도를 완비하였다","동모산에서 나라를 세웠다","장문휴를 보내 등주를 공격하였다"],"a":0,"e":"문왕은 대흥 연호, 3성 6부 정비, 주자감 설치, 상경 천도, 신라도 개설 등 체제를 정비했습니다.","tip":"대흥·황상·주자감 = 문왕.","w":["","선왕 때입니다.","고왕(대조영)입니다.","무왕 때입니다."],"p":"06강 고대(통일 신라, 발해) › 발해 문왕","h":1},
{"id":"K1-039","t":"06강 고대(통일 신라, 발해)","q":"발해의 중앙 정치 조직에 대한 설명으로 옳은 것은?","c":["정당성의 대내상이 국정을 총괄하였다","중대성이 정책을 집행하였다","6부의 명칭을 이·호·예·병·형·공으로 하였다","중정대가 교육을 담당하였다"],"a":0,"e":"발해는 당의 3성 6부를 받아들였으나 정당성 중심 운영, 유교 덕목의 6부 명칭 등 독자성을 보였습니다.","tip":"발해 = 정당성·충인의지예신.","w":["","정책 집행은 정당성(6부)이 맡았습니다.","발해 6부는 충·인·의·지·예·신입니다.","중정대는 감찰 기구, 교육은 주자감입니다."],"p":"06강 고대(통일 신라, 발해) › 발해 통치 체제","h":0},

{"id":"K1-043","t":"07강 고대(경제, 사회)","q":"신라 촌락 문서(민정 문서)에 대한 설명으로 옳은 것은?","c":["촌주가 3년마다 촌의 변동 사항을 조사하여 작성하였다","호(가호)를 사람 수에 따라 3등급으로 나누었다","노비는 조사 대상에서 제외되었다","중국 둔황에서 발견되었다"],"a":0,"e":"민정 문서는 서원경 부근 4개 촌의 인구(연령별 6등급), 호(9등급), 토지, 소·말, 뽕나무 등을 기록했습니다.","tip":"3년·촌주·9등급 호.","w":["","9등급으로 나누었습니다.","노비도 기록되었습니다.","일본 도다이사 쇼소인에서 발견되었습니다."],"p":"07강 고대(경제, 사회) › 민정 문서","h":1},

{"id":"K1-047","t":"07강 고대(경제, 사회)","q":"신라의 화백 회의에 대한 설명으로 옳은 것은?","c":["대가들이 모여 국가 중대사를 결정한 제가 회의였다","상대등이 주관하였으며 만장일치제로 운영되었다","재신과 추밀이 국방 문제를 논의하였다","호암사 정사암에서 재상을 선출하였다"],"a":1,"e":"화백 회의는 진골 귀족(대등)으로 구성되어 국가 중대사를 만장일치로 결정하며 왕권을 견제했습니다.","tip":"만장일치 = 화백.","w":["고구려의 귀족 회의입니다.","","고려의 도병마사입니다.","백제의 정사암 회의입니다."],"p":"07강 고대(경제, 사회) › 신라 사회","h":1},

{"id":"K1-049","t":"07강 고대(경제, 사회)","q":"신문왕 때 녹읍이 폐지되었다가 경덕왕 때 다시 부활하였다.","c":["맞다","틀리다"],"a":0,"e":"녹읍 폐지(689, 신문왕)는 왕권 강화, 녹읍 부활(757, 경덕왕)은 귀족 세력의 반발을 보여 줍니다.","tip":"폐지(신문) ↔ 부활(경덕).","w":["","이 설명은 옳은 내용입니다. 해설을 확인하세요."],"p":"07강 고대(경제, 사회) › 토지 제도","h":0},

{"id":"K1-051","t":"08강 고대(문화 1)","q":"다음 자료의 승려에 대한 설명으로 옳은 것은?","c":["화엄일승법계도를 지어 화엄 사상을 정리하였다","아미타 신앙을 전파하여 불교 대중화에 기여하였다","인도를 순례하고 『왕오천축국전』을 남겼다","세속 5계를 지어 화랑에게 가르쳤다"],"a":1,"e":"원효는 『대승기신론소』, 『금강삼매경론』, 『십문화쟁론』을 짓고 ‘나무아미타불’을 외우는 정토 신앙으로 불교를 대중화했습니다.","tip":"일심·화쟁·무애가 = 원효.","w":["의상의 업적입니다.","","혜초의 업적입니다.","원광의 업적입니다."],"p":"08강 고대(문화 1) › 원효","h":1,"d":"모든 것이 한마음에서 나온다는 일심 사상을 바탕으로 여러 종파의 대립을 조화시키고자 하였으며, 무애가를 부르며 민중 속으로 들어갔다."},
{"id":"K1-052","t":"08강 고대(문화 1)","q":"부석사를 창건한 승려에 대한 설명으로 옳은 것은?","c":["당의 서명사에서 유식 불교를 발전시켰다","『대승기신론소』를 저술하였다","화엄일승법계도를 지어 화엄 사상을 정리하고 관음 신앙을 전파하였다","황룡사 9층 목탑 건립을 건의하였다"],"a":2,"e":"의상은 당에서 화엄종을 공부하고 돌아와 부석사를 세웠으며, ‘일즉다 다즉일’의 화엄 사상과 관음 신앙을 펼쳤습니다.","tip":"부석사·화엄·관음 = 의상.","w":["원측의 활동입니다.","원효의 저술입니다.","","자장의 활동입니다."],"p":"08강 고대(문화 1) › 의상","h":1},
{"id":"K1-053","t":"08강 고대(문화 1)","q":"다음 자료의 인물에 대한 설명으로 옳은 것은?","c":["이두를 정리하여 유교 경전 이해에 기여하였다","진성 여왕에게 시무 10여 조를 건의하였다","『화랑세기』, 『고승전』을 저술하였다","「화왕계」를 지어 왕에게 도덕 정치를 권하였다"],"a":1,"e":"6두품 출신 최치원은 『계원필경』을 남겼고 개혁안(시무 10여 조)이 받아들여지지 않자 은둔했습니다.","tip":"토황소격문·시무 10여 조 = 최치원.","w":["설총의 업적입니다.","","김대문의 저술입니다.","설총의 활동입니다."],"p":"08강 고대(문화 1) › 최치원","h":1,"d":"당의 빈공과에 급제하였으며, 황소의 난이 일어나자 ‘토황소격문’을 지어 이름을 떨쳤다."},
{"id":"K1-054","t":"08강 고대(문화 1)","q":"신라 말 선종의 확산이 미친 영향으로 옳은 것은?","c":["중앙 진골 귀족의 지원으로 화엄종이 크게 발전하였다","지방 호족의 후원을 받아 9산 선문이 형성되고 승탑과 탑비가 유행하였다","경전 연구와 교리 이해를 중시하는 풍조가 강해졌다","국가가 승과를 실시하여 승려를 선발하였다"],"a":1,"e":"선종은 참선과 깨달음을 강조해 개인의 자각을 중시했고, 호족의 사상적 기반이 되어 고려 건국에도 영향을 주었습니다.","tip":"선종·호족·9산·승탑.","w":["신라 중대 교종의 모습입니다.","","교종의 특징입니다.","고려 광종 이후의 제도입니다."],"p":"08강 고대(문화 1) › 선종","h":0},
{"id":"K1-055","t":"08강 고대(문화 1)","q":"고대 국가의 역사서 편찬에 대한 설명으로 옳은 것은?","c":["신라 진흥왕 때 거칠부가 『국사』를 편찬하였다","신라 진흥왕 때 김부식이 『삼국사기』를 편찬하였다","백제 근초고왕 때 고흥이 『신집』을 편찬하였다","고구려 영양왕 때 이문진이 『서기』를 편찬하였다"],"a":0,"e":"고구려 『유기』 → 『신집』(이문진), 백제 『서기』(고흥), 신라 『국사』(거칠부)가 편찬되었습니다.","tip":"신집=고구려, 서기=백제, 국사=신라.","w":["","『삼국사기』는 고려 인종 때 편찬되었습니다.","고흥은 『서기』를 편찬했습니다.","이문진은 『신집』 5권을 편찬했습니다."],"p":"08강 고대(문화 1) › 고대 역사서","h":0},
{"id":"K1-056","t":"08강 고대(문화 1)","q":"임신서기석에는 신라 청년들이 유교 경전 학습을 맹세한 내용이 새겨져 있다.","c":["맞다","틀리다"],"a":0,"e":"임신서기석은 신라 청년들이 유교 경전을 공부하고 실천하기로 맹세한 내용을 담고 있습니다.","tip":"임신서기석 = 유교 학습 맹세.","w":["","이 설명은 옳은 내용입니다. 해설을 확인하세요."],"p":"08강 고대(문화 1) › 유학","h":0},
{"id":"K1-057","t":"08강 고대(문화 1)","q":"백제 금동 대향로와 산수무늬 벽돌에는 도교 사상이 반영되어 있다.","c":["맞다","틀리다"],"a":0,"e":"금동 대향로, 산수무늬 벽돌, 고구려 강서대묘 사신도에는 도교적 세계관이 나타납니다.","tip":"신선·사신도 = 도교.","w":["","이 설명은 옳은 내용입니다. 해설을 확인하세요."],"p":"08강 고대(문화 1) › 도교","h":0},
{"id":"K1-058","t":"08강 고대(문화 1)","q":"혜초는 인도와 중앙아시아를 순례하고 『왕오천축국전』을 남겼다.","c":["맞다","틀리다"],"a":0,"e":"『왕오천축국전』은 프랑스의 펠리오가 둔황에서 발견했습니다.","tip":"혜초 = 왕오천축국전.","w":["","이 설명은 옳은 내용입니다. 해설을 확인하세요."],"p":"08강 고대(문화 1) › 혜초","h":0},
{"id":"K1-059","t":"09강 고대(문화 2)","q":"우리나라 고대 고분에 대한 설명으로 옳은 것은?","c":["신라의 돌무지덧널무덤에는 사신도 벽화가 그려져 있다","신라의 돌무지덧널무덤은 도굴이 어려워 껴묻거리가 많이 남아 있다","서울 석촌동 고분은 신라 고분의 영향을 받았다","장군총은 굴식 돌방무덤이다"],"a":1,"e":"신라 돌무지덧널무덤(천마총, 황남대총)은 벽화가 없고 도굴이 어렵습니다. 굴식 돌방무덤은 벽화가 있으나 도굴이 쉽습니다.","tip":"돌무지덧널 = 벽화 없음·유물 많음.","w":["돌무지덧널무덤은 구조상 벽화가 없습니다.","","고구려 돌무지무덤의 영향을 받았습니다.","장군총은 고구려의 돌무지무덤입니다."],"p":"09강 고대(문화 2) › 고분","h":1},
{"id":"K1-060","t":"09강 고대(문화 2)","q":"다음 자료에서 설명하는 탑은?","c":["경주 분황사 모전 석탑","익산 미륵사지 석탑","부여 정림사지 5층 석탑","경주 감은사지 3층 석탑"],"a":1,"e":"익산 미륵사지 석탑은 현존하는 가장 오래된 석탑 중 하나로 목탑 양식을 반영했습니다.","tip":"목탑 양식·사리봉영기 = 미륵사지 석탑.","w":["돌을 벽돌 모양으로 다듬어 쌓은 신라 탑입니다.","","당 장수 소정방이 백제 정벌을 기념한 글귀를 새긴 탑입니다.","통일 신라의 쌍탑입니다."],"p":"09강 고대(문화 2) › 탑","h":1,"d":"목탑 양식을 반영한 백제의 석탑으로, 해체·수리 과정에서 무왕 때 왕후가 사찰을 세웠다는 내용의 사리봉영기가 발견되었다."},
{"id":"K1-061","t":"09강 고대(문화 2)","q":"세계에서 가장 오래된 목판 인쇄물인 무구정광대다라니경이 발견된 탑은?","c":["경주 불국사 3층 석탑","경주 불국사 다보탑","영광탑","양양 진전사지 3층 석탑"],"a":0,"e":"불국사 3층 석탑(석가탑)에서 무구정광대다라니경이 발견되었습니다.","tip":"석가탑 = 무구정광대다라니경.","w":["","독특한 형태의 통일 신라 탑이나 다라니경 발견지는 아닙니다.","발해의 벽돌탑입니다.","기단과 탑신에 부조가 새겨진 신라 하대 탑입니다."],"p":"09강 고대(문화 2) › 탑","h":0},
{"id":"K1-062","t":"09강 고대(문화 2)","q":"발해의 문화유산에 대한 설명으로 옳은 것은?","c":["정혜 공주 묘는 굴식 돌방무덤에 모줄임천장 구조로 고구려의 영향을 보여 준다","영광탑은 화강암으로 만든 석탑이다","정효 공주 묘는 고구려식 돌무지무덤이다","이불병좌상은 고구려와 무관한 당 양식만 보여 준다"],"a":0,"e":"발해 문화는 고구려 문화를 바탕으로 당 문화를 수용했습니다(정혜 공주 묘 = 고구려, 정효 공주 묘 = 당).","tip":"정혜 = 고구려식, 정효 = 당식 벽돌.","w":["","영광탑은 벽돌탑입니다.","정효 공주 묘는 당의 영향을 받은 벽돌무덤입니다.","고구려 양식을 계승한 불상입니다."],"p":"09강 고대(문화 2) › 발해 문화","h":1},
{"id":"K1-063","t":"09강 고대(문화 2)","q":"고대 문화의 일본 전파에 대한 설명으로 옳은 것은?","c":["백제의 혜자가 쇼토쿠 태자의 스승이 되었다","고구려의 담징이 종이와 먹의 제조 방법을 전하였다","신라의 아직기와 왕인이 한자와 유교 경전을 전하였다","가야의 노리사치계가 불교를 전하였다"],"a":1,"e":"고구려(담징·혜자), 백제(아직기·왕인·노리사치계), 신라(조선술·축제술), 가야(스에키 토기)가 일본 아스카 문화에 영향을 주었습니다.","tip":"담징 = 종이·먹.","w":["혜자는 고구려 승려입니다.","","아직기·왕인은 백제 사람입니다.","노리사치계는 백제 사람입니다."],"p":"09강 고대(문화 2) › 일본 전파","h":1},
{"id":"K1-064","t":"09강 고대(문화 2)","q":"성덕 대왕 신종은 혜공왕 때 완성되었고, 현존하는 가장 오래된 동종은 상원사 동종이다.","c":["맞다","틀리다"],"a":0,"e":"성덕 대왕 신종(771)은 비천상이 유명하며, 상원사 동종(725)이 현존 최고(最古) 동종입니다.","tip":"최고 동종 = 상원사.","w":["","이 설명은 옳은 내용입니다. 해설을 확인하세요."],"p":"09강 고대(문화 2) › 공예","h":0},
{"id":"K1-065","t":"09강 고대(문화 2)","q":"서산 용현리 마애여래삼존상은 ‘백제의 미소’라 불리는 백제의 불상이다.","c":["맞다","틀리다"],"a":0,"e":"온화한 미소가 특징인 백제의 대표 불상입니다.","tip":"백제의 미소 = 서산 마애.","w":["","이 설명은 옳은 내용입니다. 해설을 확인하세요."],"p":"09강 고대(문화 2) › 불상","h":0},
{"id":"K1-066","t":"09강 고대(문화 2)","q":"통일 신라 말에는 선종의 유행과 함께 팔각원당형 승탑이 많이 만들어졌다.","c":["맞다","틀리다"],"a":0,"e":"대표적으로 화순 쌍봉사 철감선사 승탑이 있습니다.","tip":"승탑 = 선종.","w":["","이 설명은 옳은 내용입니다. 해설을 확인하세요."],"p":"09강 고대(문화 2) › 승탑","h":0},
{"id":"K1-067","t":"10강 고려(초기 정치)","q":"다음 자료를 남긴 왕의 정책으로 옳은 것은?","c":["12목에 지방관을 파견하였다","노비안검법을 실시하였다","광군을 조직하여 거란에 대비하였다","사심관과 기인 제도를 실시하여 지방 세력을 통제하였다"],"a":3,"e":"태조는 호족 통합(혼인, 사성), 사심관·기인 제도, 북진 정책, 흑창 설치, 『정계』·『계백료서』, 훈요 10조를 남겼습니다.","tip":"훈요 10조·사심관 = 태조.","w":["성종의 정책입니다.","광종의 정책입니다.","정종의 정책입니다.",""],"p":"10강 고려(초기 정치) › 고려 태조","h":1,"d":"짐은 삼한 산천의 음덕을 입어 대업을 이루었다. … 후대 왕들은 이 가르침을 마음에 새겨 두라. (훈요 10조)"},
{"id":"K1-068","t":"10강 고려(초기 정치)","q":"쌍기의 건의로 과거제를 실시한 왕의 정책으로 옳은 것은?","c":["최승로의 시무 28조를 수용하였다","노비안검법을 실시하여 호족 세력을 약화시켰다","흑창을 설치하여 빈민을 구제하였다","관품과 인품을 기준으로 시정 전시과를 처음 실시하였다"],"a":1,"e":"광종은 노비안검법(956), 과거제(958), 백관 공복 제정, 칭제 건원(광덕·준풍)으로 왕권을 강화했습니다.","tip":"광종 = 노비안검법·과거·공복.","w":["성종 때입니다.","","태조 때입니다.","경종 때입니다."],"p":"10강 고려(초기 정치) › 고려 광종","h":1},
{"id":"K1-069","t":"10강 고려(초기 정치)","q":"최승로의 시무 28조를 받아들인 왕의 정책으로 옳은 것은?","c":["12목을 설치하고 지방관을 파견하였다","훈요 10조를 남겼다","전국을 5도 양계로 정비하였다","칭제 건원하고 개경을 황도라 하였다"],"a":0,"e":"성종은 2성 6부 정비, 12목 지방관 파견, 향리 제도 정비, 국자감 설치, 연등회·팔관회 축소로 유교 정치를 정비했습니다.","tip":"시무 28조 = 성종(12목).","w":["","태조입니다.","현종 때입니다.","광종 때입니다."],"p":"10강 고려(초기 정치) › 고려 성종","h":1},
{"id":"K1-070","t":"10강 고려(초기 정치)","q":"고려의 중앙 정치 기구에 대한 설명으로 옳은 것은?","c":["삼사는 언론 기능을 담당하였다","도병마사는 재신과 추밀이 모여 국방·군사 문제를 논의한 독자적 기구였다","중추원은 관리의 비리를 감찰하였다","상서성의 낭사는 간쟁과 봉박을 담당하였다"],"a":1,"e":"도병마사·식목도감은 고려 독자 기구이며, 중추원은 군사 기밀·왕명 출납, 어사대는 감찰을 담당했습니다.","tip":"고려 삼사 = 회계 (조선 삼사와 구별).","w":["고려의 삼사는 화폐·곡식 출납 회계를 맡았습니다.","","감찰은 어사대의 기능입니다.","낭사는 중서문하성 소속입니다."],"p":"10강 고려(초기 정치) › 고려 중앙 정치","h":1},
{"id":"K1-071","t":"10강 고려(초기 정치)","q":"고려의 대간은 어사대 관원과 중서문하성 낭사로 구성되었으며 서경권을 가졌다.","c":["맞다","틀리다"],"a":0,"e":"대간은 간쟁·봉박·서경권으로 왕권과 관리를 견제했습니다.","tip":"대간 = 어사대 + 낭사.","w":["","이 설명은 옳은 내용입니다. 해설을 확인하세요."],"p":"10강 고려(초기 정치) › 대간","h":0},
{"id":"K1-072","t":"10강 고려(초기 정치)","q":"고려의 지방 행정 제도에 대한 설명으로 옳은 것은?","c":["향·부곡·소의 주민은 일반 군현민과 똑같은 대우를 받았다","모든 군현에 수령이 파견되었다","지방관이 파견되지 않은 속현이 주현보다 많았다","양계에 안찰사를 파견하였다"],"a":2,"e":"고려는 5도 양계와 경기, 주현·속현 구조로 운영되었고 속현은 향리가 실제 행정을 맡았습니다.","tip":"고려 = 속현 > 주현.","w":["세금 부담이 크고 이주가 제한되는 등 차별받았습니다.","조선의 지방 제도입니다.","","양계에는 병마사, 5도에는 안찰사를 파견했습니다."],"p":"10강 고려(초기 정치) › 고려 지방 행정","h":0},
{"id":"K1-073","t":"10강 고려(초기 정치)","q":"다음 정책을 시행된 순서대로 바르게 나열한 것은?","c":["(다) - (가) - (나)","(나) - (가) - (다)","(다) - (나) - (가)","(가) - (다) - (나)"],"a":0,"e":"태조(훈요 10조) → 광종(노비안검법) → 성종(시무 28조) 순입니다.","tip":"태조 → 광종 → 성종.","w":["","태조 → 광종 → 성종 순입니다.","광종(노비안검법)이 성종(시무 28조)보다 먼저입니다.","훈요 10조(태조)가 가장 먼저입니다."],"p":"10강 고려(초기 정치) › 고려 초기 정치","h":0,"d":"(가) 노비안검법 실시 (나) 시무 28조 수용 (다) 훈요 10조 작성"},
{"id":"K1-074","t":"10강 고려(초기 정치)","q":"경종 때 관품과 인품을 반영한 시정 전시과가 처음 실시되었다.","c":["맞다","틀리다"],"a":0,"e":"시정 전시과(976)는 관품과 인품을 함께 반영했습니다.","tip":"시정 = 인품 반영.","w":["","이 설명은 옳은 내용입니다. 해설을 확인하세요."],"p":"10강 고려(초기 정치) › 전시과","h":0},
{"id":"K1-075","t":"11강 고려(중기 정치~무신 정변)","q":"다음 사건에 대한 설명으로 옳은 것은?","c":["이 사건을 전후하여 이자겸 세력은 금의 사대 요구를 수용하였다","윤관이 별무반을 편성하였다","서경 세력이 국호를 대위, 연호를 천개라 하였다","최충헌이 교정도감을 설치하였다"],"a":0,"e":"이자겸은 인종의 외척으로 권력을 독점하고 금의 사대 요구를 받아들였으며, 난(1126) 이후 왕권이 크게 약화되었습니다.","tip":"척준경·인종 외척 = 이자겸.","w":["","숙종 때의 일입니다.","묘청의 서경 천도 운동입니다.","무신 집권기의 일입니다."],"p":"11강 고려(중기 정치~무신 정변) › 이자겸의 난","h":1,"d":"척준경이 군사를 이끌고 궁궐을 침범하여 불을 지르니, 왕이 이자겸의 집으로 옮겨 가는 처지가 되었다."},
{"id":"K1-076","t":"11강 고려(중기 정치~무신 정변)","q":"다음 자료의 사건에 대한 설명으로 옳은 것은?","c":["김부식이 이끄는 관군에 의해 진압되었다","보현원에서 문신들이 살해되었다","윤관이 동북 9성을 쌓았다","척준경이 궁궐을 불태웠다"],"a":0,"e":"묘청 세력은 칭제 건원·금국 정벌을 주장했고, 개경파 김부식에게 진압되었습니다(1135~1136). 신채호는 ‘조선 역사상 일천년래 제일대사건’이라 평가했습니다.","tip":"서경·칭제 건원·금 정벌 = 묘청.","w":["","무신 정변입니다.","여진 정벌입니다.","이자겸의 난입니다."],"p":"11강 고려(중기 정치~무신 정변) › 묘청의 서경 천도 운동","h":1,"d":"서경에 대화궁을 짓고 도읍을 옮기면 금이 스스로 항복하고 36국이 조공할 것이라 하였다."},
{"id":"K1-077","t":"11강 고려(중기 정치~무신 정변)","q":"다음 자료의 인물이 집권한 시기 사실로 옳은 것은?","c":["중방을 중심으로 정치를 운영하였다","신변 보호를 위해 도방을 처음 설치하였다","정방을 설치하여 인사권을 장악하였다","교정도감을 설치하여 국정을 총괄하였다"],"a":3,"e":"최충헌은 봉사 10조, 교정도감(최고 권력 기구), 도방 확대로 최씨 무신 정권을 세웠습니다.","tip":"봉사 10조·교정도감 = 최충헌.","w":["정중부 등 초기 무신 집권기입니다.","경대승입니다.","최우의 정책입니다.",""],"p":"11강 고려(중기 정치~무신 정변) › 최충헌","h":1,"d":"왕에게 봉사 10조를 올려 사회 개혁을 건의하였다."},
{"id":"K1-078","t":"11강 고려(중기 정치~무신 정변)","q":"정방을 설치한 인물이 집권한 시기의 사실로 옳은 것은?","c":["망이·망소이가 공주 명학소에서 봉기하였다","만적이 신분 해방을 꾀하였다","김사미와 효심이 운문과 초전에서 봉기하였다","몽골의 침입에 대비하여 강화도로 도읍을 옮겼다"],"a":3,"e":"최우는 정방(인사), 서방(문신 숙위), 삼별초를 조직하고 강화 천도(1232)를 단행했습니다.","tip":"정방·강화 천도·삼별초 = 최우.","w":["정중부 집권기(1176)입니다.","최충헌 집권기(1198)입니다.","이의민 집권기(1193)입니다.",""],"p":"11강 고려(중기 정치~무신 정변) › 최우","h":0},
{"id":"K1-079","t":"11강 고려(중기 정치~무신 정변)","q":"다음 자료의 봉기에 대한 설명으로 옳은 것은?","c":["고구려 부흥을 내세웠다","운문과 초전에서 일어났다","봉기의 결과 명학소가 충순현으로 승격되기도 하였다","노비들이 개경에서 정권 탈취를 계획하였다"],"a":2,"e":"망이·망소이의 난(1176)은 특수 행정 구역 소의 차별에 대한 저항이었습니다.","tip":"명학소 = 망이·망소이.","w":["최광수의 난입니다.","김사미·효심의 난입니다.","","만적의 난입니다."],"p":"11강 고려(중기 정치~무신 정변) › 망이·망소이의 난","h":1,"d":"공주 명학소의 주민들이 과도한 부담과 차별에 반발하여 봉기하였다."},
{"id":"K1-080","t":"11강 고려(중기 정치~무신 정변)","q":"만적은 최충헌의 사노비로, 개경에서 신분 해방을 위한 봉기를 계획하였으나 사전에 발각되었다.","c":["맞다","틀리다"],"a":0,"e":"만적은 ‘장상의 씨가 어찌 따로 있겠는가’라며 천민의 신분 해방을 주장했습니다(1198).","tip":"만적 = 최충헌의 사노비.","w":["","이 설명은 옳은 내용입니다. 해설을 확인하세요."],"p":"11강 고려(중기 정치~무신 정변) › 만적의 난","h":0},
{"id":"K1-081","t":"11강 고려(중기 정치~무신 정변)","q":"다음 사건을 일어난 순서대로 바르게 나열한 것은?","c":["(가) - (나) - (다)","(가) - (다) - (나)","(다) - (가) - (나)","(나) - (가) - (다)"],"a":1,"e":"이자겸의 난(1126) → 묘청의 서경 천도 운동(1135) → 무신 정변(1170) 순입니다.","tip":"문벌 귀족 사회의 동요 → 무신 정변.","w":["묘청(1135)이 무신 정변(1170)보다 먼저입니다.","","이자겸의 난(1126)이 가장 먼저입니다.","무신 정변이 가장 나중입니다."],"p":"11강 고려(중기 정치~무신 정변) › 고려 중기 정치","h":0,"d":"(가) 이자겸의 난 (나) 무신 정변 (다) 묘청의 서경 천도 운동"},
{"id":"K1-082","t":"11강 고려(중기 정치~무신 정변)","q":"경대승은 신변 보호를 위해 도방을 처음 설치하였다.","c":["맞다","틀리다"],"a":0,"e":"도방은 경대승이 처음 설치했고 최충헌이 확대했습니다.","tip":"도방 처음 = 경대승.","w":["","이 설명은 옳은 내용입니다. 해설을 확인하세요."],"p":"11강 고려(중기 정치~무신 정변) › 무신 집권기","h":0},
{"id":"K1-083","t":"12강 고려(외교)","q":"다음 자료의 외교 활동에 대한 결과로 옳은 것은?","c":["압록강 동쪽의 강동 6주를 확보하였다","강감찬이 귀주에서 크게 승리하였다","윤관이 동북 9성을 쌓았다","김윤후가 처인성에서 적장을 사살하였다"],"a":0,"e":"거란 1차 침입(993) 때 서희의 외교 담판으로 강동 6주를 확보했습니다.","tip":"서희 = 강동 6주.","w":["","거란 3차 침입 때입니다.","여진 정벌입니다.","몽골 침입 때입니다."],"p":"12강 고려(외교) › 거란 1차 침입","h":1,"d":"서희가 소손녕과 담판하여 “우리는 고구려의 옛 땅이므로 나라 이름을 고려라 하였다.”라고 주장하였다."},
{"id":"K1-084","t":"12강 고려(외교)","q":"다음 사건을 일어난 순서대로 바르게 나열한 것은?","c":["(가) - (다) - (나)","(나) - (가) - (다)","(다) - (가) - (나)","(가) - (나) - (다)"],"a":0,"e":"1차(993, 강동 6주) → 2차(1010, 개경 함락·나주 피란) → 3차(1018~1019, 귀주 대첩) 순입니다.","tip":"서희 → 양규·나주 → 강감찬.","w":["","1차 → 2차 → 3차 순입니다.","강동 6주(993, 1차)가 가장 먼저입니다.","나주 피란(2차, 1010)이 귀주 대첩(3차, 1019)보다 먼저입니다."],"p":"12강 고려(외교) › 거란의 침입","h":0,"d":"(가) 강동 6주 획득 (나) 귀주 대첩 (다) 현종의 나주 피란"},
{"id":"K1-085","t":"12강 고려(외교)","q":"신기군, 신보군, 항마군으로 편성된 부대에 대한 설명으로 옳은 것은?","c":["압록강에서 도련포까지 천리장성을 쌓았다","윤관이 이끌고 여진을 정벌하여 동북 9성을 쌓았다","진포에서 화포로 왜구를 격퇴하였다","강동 6주를 확보하였다"],"a":1,"e":"숙종 때 윤관의 건의로 별무반이 편성되었고, 예종 때 동북 9성을 쌓았으나 1년여 만에 돌려주었습니다.","tip":"별무반 = 윤관·동북 9성.","w":["거란 침입 이후 쌓은 장성입니다.","","최무선의 활약입니다.","서희의 외교 성과입니다."],"p":"12강 고려(외교) › 별무반","h":1},
{"id":"K1-086","t":"12강 고려(외교)","q":"몽골의 침입에 맞선 항쟁으로 옳은 것은?","c":["김윤후가 처인성에서 몽골 장수 살리타를 사살하였다","양규가 흥화진에서 적을 막아 냈다","강감찬이 귀주에서 적을 크게 무찔렀다","정지가 관음포에서 승리하였다"],"a":0,"e":"몽골 침입 때 박서(귀주성), 김윤후(처인성·충주성), 충주 다인철소 주민 등이 항전했습니다.","tip":"처인성 = 김윤후(몽골).","w":["","거란 2차 침입 때입니다.","거란 3차 침입 때입니다.","왜구 격퇴입니다."],"p":"12강 고려(외교) › 몽골의 침입","h":1},
{"id":"K1-087","t":"12강 고려(외교)","q":"다음 자료의 군사 조직에 대한 설명으로 옳은 것은?","c":["개경 환도 결정에 반발하여 봉기하였다","최충헌이 신변 보호를 위해 조직하였다","여진 정벌을 위해 편성되었다","쓰시마섬을 정벌하였다"],"a":0,"e":"삼별초는 좌별초·우별초·신의군으로 구성되었고, 개경 환도(1270)에 반발해 진도·제주에서 항쟁(~1273)했습니다.","tip":"진도·항파두리 = 삼별초.","w":["","삼별초는 최우 때 조직되었습니다.","별무반입니다.","박위(고려 말)·이종무(조선)의 활동입니다."],"p":"12강 고려(외교) › 삼별초","h":1,"d":"배중손이 왕족 승화후 온을 왕으로 추대하고 진도의 용장성을 거점으로 삼았다. 이후 김통정이 제주도 항파두리에서 항전하였다."},
{"id":"K1-088","t":"12강 고려(외교)","q":"다음 자료의 왕이 추진한 정책으로 옳은 것은?","c":["사림원을 두어 개혁을 추진하였다","원의 수도에 만권당을 세웠다","정치도감을 설치하였다","쌍성총관부를 무력으로 수복하였다"],"a":3,"e":"공민왕은 반원 개혁(기철 숙청, 이문소 혁파, 쌍성총관부 수복, 관제 복구, 몽골풍 금지)과 왕권 강화(신돈 전민변정도감, 정방 폐지)를 추진했습니다.","tip":"기철 숙청·쌍성총관부 = 공민왕.","w":["충선왕입니다.","충선왕입니다.","충목왕 때입니다.",""],"p":"12강 고려(외교) › 공민왕","h":1,"d":"기철 등 친원 세력을 숙청하고 정동행성 이문소를 혁파하였다."},
{"id":"K1-089","t":"12강 고려(외교)","q":"원 간섭기에 중서문하성과 상서성은 첨의부로 통합되었다.","c":["맞다","틀리다"],"a":0,"e":"원 간섭기에 관제가 격하되어 첨의부, 밀직사, 도평의사사 등으로 바뀌었습니다.","tip":"원 간섭 = 관제 격하.","w":["","이 설명은 옳은 내용입니다. 해설을 확인하세요."],"p":"12강 고려(외교) › 원 간섭기","h":0},
{"id":"K1-090","t":"12강 고려(외교)","q":"최무선은 화통도감에서 화약 무기를 만들어 진포에서 왜구를 격퇴하였다.","c":["맞다","틀리다"],"a":0,"e":"화통도감(1377) 설치 후 진포 대첩(1380)에서 화포를 사용했습니다.","tip":"최무선 = 화통도감·진포.","w":["","이 설명은 옳은 내용입니다. 해설을 확인하세요."],"p":"12강 고려(외교) › 왜구 격퇴","h":0},
{"id":"K1-091","t":"13강 고려(경제, 사회)","q":"다음 토지 제도에 대한 설명으로 옳은 것은?","c":["공양왕 때 실시된 과전법이다","목종 때 실시된 개정 전시과이다","경종 때 실시된 시정 전시과이다","문종 때 실시된 경정 전시과이다"],"a":3,"e":"역분전(태조) → 시정(경종, 인품) → 개정(목종, 관품) → 경정(문종, 현직만) 순으로 정비되었습니다.","tip":"경정 = 현직만.","w":["과전법은 경기 지역에 한해 지급했습니다.","개정 전시과는 산관(전직)에게도 지급했습니다.","시정 전시과는 관품과 인품을 함께 반영했습니다.",""],"p":"13강 고려(경제, 사회) › 전시과","h":1,"d":"현직 관리에게만 토지를 지급하고, 무반에 대한 차별을 다소 완화하였다."},
{"id":"K1-092","t":"13강 고려(경제, 사회)","q":"고려의 공음전은 5품 이상 고위 관료에게 지급되어 세습이 허용되었다.","c":["맞다","틀리다"],"a":0,"e":"공음전은 음서와 함께 문벌 귀족의 특권을 뒷받침했습니다.","tip":"공음전 = 5품 이상·세습.","w":["","이 설명은 옳은 내용입니다. 해설을 확인하세요."],"p":"13강 고려(경제, 사회) › 토지 제도","h":0},
{"id":"K1-093","t":"13강 고려(경제, 사회)","q":"고려 숙종 때의 경제 정책으로 옳은 것은?","c":["주전도감을 설치하고 은병(활구)을 만들었다","건원중보를 처음 만들었다","저화를 발행하였다","상평통보를 전국에 유통하였다"],"a":0,"e":"숙종은 의천의 건의로 주전도감을 두고 해동통보·삼한통보·활구를 만들었으나 널리 유통되지는 못했습니다.","tip":"고려 숙종 = 주전도감·활구.","w":["","성종 때입니다.","공양왕(고려 말) 때입니다.","조선 숙종 때입니다."],"p":"13강 고려(경제, 사회) › 화폐","h":1},
{"id":"K1-094","t":"13강 고려(경제, 사회)","q":"고려의 사회 시책과 그 기능을 바르게 연결한 것은?","c":["상평창 - 물가 조절","동서 대비원 - 물가 조절","제위보 - 질병 치료","의창 - 서적 간행"],"a":0,"e":"흑창 → 의창(빈민 구제), 상평창(물가 조절), 동서 대비원·혜민국(의료), 제위보(기금 구제), 구제도감(재해 구휼)이 있었습니다.","tip":"상평창 = 물가.","w":["","동서 대비원은 환자 치료와 빈민 구휼을 맡았습니다.","제위보는 기금을 마련해 이자로 빈민을 구제했습니다.","의창은 빈민 구제 기구입니다."],"p":"13강 고려(경제, 사회) › 사회 제도","h":0},
{"id":"K1-095","t":"13강 고려(경제, 사회)","q":"고려 시대 가족 제도에 대한 설명으로 옳은 것은?","c":["혼인 후 신부가 바로 신랑 집에서 사는 친영 제도가 정착되었다","여성의 재가가 법으로 금지되었다","재산은 자녀에게 균분 상속하였고 호적에는 태어난 순서대로 기록하였다","아들이 없으면 반드시 양자를 들였다"],"a":2,"e":"고려는 여성 호주 가능, 균분 상속, 사위·외손 음서, 윤회 봉사, 재가 자유 등 여성 지위가 비교적 높았습니다.","tip":"고려 = 균분·출생순.","w":["조선 후기의 모습입니다.","고려는 재가가 비교적 자유로웠습니다.","","조선 후기의 모습입니다."],"p":"13강 고려(경제, 사회) › 가족 제도","h":1},
{"id":"K1-096","t":"13강 고려(경제, 사회)","q":"고려의 향·부곡·소 주민은 일반 군현민보다 세금 부담이 많고 거주 이전이 제한되었다.","c":["맞다","틀리다"],"a":0,"e":"향·부곡·소는 차별받는 특수 행정 구역으로, 조선 시대에 소멸했습니다.","tip":"향·부곡·소 = 차별.","w":["","이 설명은 옳은 내용입니다. 해설을 확인하세요."],"p":"13강 고려(경제, 사회) › 신분","h":0},
{"id":"K1-097","t":"13강 고려(경제, 사회)","q":"고려의 국제 무역항 벽란도는 예성강 하구에 있었다.","c":["맞다","틀리다"],"a":0,"e":"벽란도에는 송, 일본, 아라비아 상인이 왕래했고 ‘고려(Corea)’라는 이름이 서방에 알려졌습니다.","tip":"벽란도 = 예성강.","w":["","이 설명은 옳은 내용입니다. 해설을 확인하세요."],"p":"13강 고려(경제, 사회) › 대외 무역","h":0},
{"id":"K1-098","t":"13강 고려(경제, 사회)","q":"원 간섭기에 이암이 원의 농서인 『농상집요』를 소개하였다.","c":["맞다","틀리다"],"a":0,"e":"고려 후기에는 『농상집요』 소개, 문익점의 목화 전래, 시비법 발달이 있었습니다.","tip":"농상집요 = 이암.","w":["","이 설명은 옳은 내용입니다. 해설을 확인하세요."],"p":"13강 고려(경제, 사회) › 농업","h":0},
{"id":"K1-099","t":"14강 고려(문화 1)","q":"김부식이 편찬한 역사서에 대한 설명으로 옳은 것은?","c":["성리학적 정통·대의명분을 강조하였다","고구려 계승 의식을 드러낸 영웅 서사시이다","단군의 건국 이야기를 수록하였다","기전체로 서술되었으며 현존하는 가장 오래된 역사서이다"],"a":3,"e":"『삼국사기』(1145, 인종)는 유교적 합리주의에 입각한 기전체 사서로 신라 계승 의식이 강합니다.","tip":"삼국사기 = 기전체·현존 최고.","w":["이제현의 『사략』입니다.","이규보의 「동명왕편」입니다.","『삼국유사』·『제왕운기』의 특징입니다.",""],"p":"14강 고려(문화 1) › 삼국사기","h":1},
{"id":"K1-100","t":"14강 고려(문화 1)","q":"다음 자료의 역사서에 대한 설명으로 옳은 것은?","c":["무신 집권기에 승려들의 전기를 정리하였다","불교사를 중심으로 민간 설화를 수록하였다","유교적 합리주의를 바탕으로 기전체로 서술하였다","단군을 우리 역사의 시작으로 서술하고 발해를 우리 역사로 인식하였다"],"a":3,"e":"『제왕운기』는 중국사와 우리 역사를 대등하게 서술해 자주 의식을 드러냈습니다.","tip":"이승휴·제왕운기 = 단군·발해.","w":["각훈의 『해동고승전』입니다.","『삼국유사』의 특징입니다.","『삼국사기』입니다.",""],"p":"14강 고려(문화 1) › 제왕운기","h":0,"d":"충렬왕 때 이승휴가 저술하였으며, 상권에는 중국 역사를, 하권에는 우리 역사를 7언시와 5언시로 서술하였다."},
{"id":"K1-101","t":"14강 고려(문화 1)","q":"다음 자료의 승려에 대한 설명으로 옳은 것은?","c":["백련 결사를 조직하였다","해동 천태종을 개창하고 교관겸수를 주장하였다","「보현십원가」를 지어 불교를 대중화하였다","정혜쌍수와 돈오점수를 주장하였다"],"a":1,"e":"의천은 교종 중심의 선종 통합을 추구하며 국청사에서 천태종을 개창했고 『신편제종교장총록』을 편찬했습니다.","tip":"의천 = 교관겸수·천태종.","w":["요세입니다.","","균여입니다.","지눌입니다."],"p":"14강 고려(문화 1) › 의천","h":1,"d":"문종의 아들로 출가하여 송에 유학하였으며, 돌아와 흥왕사에 교장도감을 두고 교장을 간행하였다."},
{"id":"K1-102","t":"14강 고려(문화 1)","q":"다음 자료의 승려에 대한 설명으로 옳은 것은?","c":["돈오점수와 정혜쌍수를 주장하였다","교관겸수를 내세웠다","유불 일치설을 주장하였다","『신편제종교장총록』을 편찬하였다"],"a":0,"e":"지눌은 선종 중심의 교종 통합을 추구해 조계종을 확립했습니다.","tip":"수선사·돈오점수 = 지눌.","w":["","의천입니다.","지눌의 제자 혜심입니다.","의천입니다."],"p":"14강 고려(문화 1) › 지눌","h":1,"d":"송광사(수선사)를 중심으로 결사를 조직하여 승려 본연의 자세로 돌아갈 것을 주장하였다."},
{"id":"K1-103","t":"14강 고려(문화 1)","q":"해동공자로 불린 최충에 대한 설명으로 옳은 것은?","c":["성리학을 처음 소개하였다","국학에 7재를 설치하였다","9재 학당을 세워 사학 발달을 이끌었다","원의 만권당에서 학자들과 교류하였다"],"a":2,"e":"최충의 문헌공도 등 사학 12도가 번성하자 관학이 위축되어 관학 진흥책이 추진되었습니다.","tip":"최충 = 9재 학당.","w":["안향입니다.","예종 때입니다.","","이제현입니다."],"p":"14강 고려(문화 1) › 유학과 교육","h":0},
{"id":"K1-104","t":"14강 고려(문화 1)","q":"예종은 국학에 7재를 설치하고 양현고를 두어 관학을 진흥하였다.","c":["맞다","틀리다"],"a":0,"e":"숙종(서적포), 예종(7재·양현고), 인종(경사 6학)이 관학 진흥책을 폈습니다.","tip":"예종 = 7재·양현고.","w":["","이 설명은 옳은 내용입니다. 해설을 확인하세요."],"p":"14강 고려(문화 1) › 관학 진흥","h":0},
{"id":"K1-105","t":"14강 고려(문화 1)","q":"팔만대장경은 거란의 침입을 불력으로 막고자 현종 때 처음 조판되었다.","c":["맞다","틀리다"],"a":1,"e":"현종 때 거란 침입을 계기로 조판한 것은 초조대장경입니다. 팔만대장경(재조대장경)은 몽골 침입 때 조판했습니다.","tip":"거란 = 초조, 몽골 = 팔만.","w":["이 설명은 틀린 내용입니다. 해설에서 바른 내용을 확인하세요.",""],"p":"14강 고려(문화 1) › 대장경","h":0},
{"id":"K1-106","t":"14강 고려(문화 1)","q":"『삼국유사』는 충렬왕 때 일연이 저술하였으며 단군의 건국 이야기를 수록하였다.","c":["맞다","틀리다"],"a":0,"e":"『삼국유사』는 불교사와 민간 설화를 함께 담았습니다.","tip":"일연 = 삼국유사.","w":["","이 설명은 옳은 내용입니다. 해설을 확인하세요."],"p":"14강 고려(문화 1) › 삼국유사","h":0},
{"id":"K1-107","t":"15강 고려(문화 2)","q":"다음 자료의 문화유산은?","c":["예산 수덕사 대웅전","안동 봉정사 극락전","사리원 성불사 응진전","영주 부석사 무량수전"],"a":3,"e":"고려 전기는 주심포 양식(봉정사 극락전, 부석사 무량수전, 수덕사 대웅전), 후기에는 다포 양식(성불사 응진전)이 등장했습니다.","tip":"배흘림·팔작·소조 아미타 = 무량수전.","w":["주심포 양식이나 맞배지붕이며 소조 아미타불과 무관합니다.","현존하는 가장 오래된 목조 건물로 맞배지붕입니다.","다포 양식 건물입니다.",""],"p":"15강 고려(문화 2) › 건축","h":0,"d":"고려 시대의 주심포 양식 건물로 배흘림기둥과 팔작지붕이 특징이며, 안에는 소조 아미타여래 좌상이 모셔져 있다."},
{"id":"K1-108","t":"15강 고려(문화 2)","q":"원의 영향을 받아 대리석으로 만든 고려의 탑은?","c":["평창 월정사 8각 9층 석탑","개성 경천사지 10층 석탑","부여 정림사지 5층 석탑","구례 화엄사 4사자 3층 석탑"],"a":1,"e":"경천사지 10층 석탑은 조선 세조 때 원각사지 10층 석탑에 영향을 주었습니다.","tip":"원 영향·대리석 = 경천사지.","w":["송의 영향을 받은 다각 다층탑입니다.","","백제의 석탑입니다.","통일 신라의 석탑입니다."],"p":"15강 고려(문화 2) › 탑","h":1},
{"id":"K1-109","t":"15강 고려(문화 2)","q":"『직지심체요절』에 대한 설명으로 옳은 것은?","c":["청주 흥덕사에서 금속 활자로 인쇄되었다","해인사에 보관된 목판이다","현존 세계 최고(最古)의 목판 인쇄물이다","최윤의 등이 편찬한 의례서이다"],"a":0,"e":"『직지심체요절』(1377)은 현존 세계 최고의 금속 활자본으로 프랑스 국립 도서관에 있습니다.","tip":"직지 = 흥덕사·금속 활자.","w":["","팔만대장경입니다.","무구정광대다라니경입니다.","『상정고금예문』입니다."],"p":"15강 고려(문화 2) › 인쇄술","h":1},
{"id":"K1-110","t":"15강 고려(문화 2)","q":"상감 청자는 원 간섭기 이후 퇴조하고 분청사기로 이어졌다.","c":["맞다","틀리다"],"a":0,"e":"순수 청자 → 상감 청자(12세기 중엽) → 원 간섭기 퇴조 → 분청사기(조선 전기) 흐름입니다.","tip":"청자 → 분청 → 백자.","w":["","이 설명은 옳은 내용입니다. 해설을 확인하세요."],"p":"15강 고려(문화 2) › 자기","h":0},
{"id":"K1-111","t":"15강 고려(문화 2)","q":"고려 시대 불상에 대한 설명으로 옳은 것은?","c":["논산 관촉사 석조 미륵보살 입상은 거대한 크기로 지역적 특색을 보여 준다","서산 용현리 마애여래삼존상은 고려 불상이다","석굴암 본존불은 고려 불상이다","이불병좌상은 고려 불상이다"],"a":0,"e":"고려 불상은 하남 하사창동 철조 석가여래 좌상, 관촉사·안동 이천동 대형 석불, 부석사 소조 아미타여래 좌상이 대표적입니다.","tip":"거대 석불 = 고려 지방 문화.","w":["","백제의 불상입니다.","통일 신라의 불상입니다.","발해의 불상입니다."],"p":"15강 고려(문화 2) › 불상","h":0},
{"id":"K1-112","t":"15강 고려(문화 2)","q":"고려의 문학가와 작품을 바르게 연결한 것은?","c":["이인로 - 『역옹패설』","이제현 - 「국순전」","임춘 - 『파한집』","이규보 - 「국선생전」"],"a":3,"e":"가전체: 「국순전」(임춘), 「국선생전」(이규보) / 패관 문학: 『파한집』(이인로), 『보한집』(최자), 『역옹패설』(이제현).","tip":"술 의인화 = 국순전(임춘)·국선생전(이규보).","w":["『역옹패설』은 이제현의 작품입니다.","「국순전」은 임춘의 작품입니다.","『파한집』은 이인로의 작품입니다.",""],"p":"15강 고려(문화 2) › 문학","h":0},
{"id":"K1-113","t":"15강 고려(문화 2)","q":"『향약구급방』은 현존하는 가장 오래된 우리나라 의학서이다.","c":["맞다","틀리다"],"a":0,"e":"고려 후기(13세기)에 편찬되어 국산 약재 사용법을 담았습니다.","tip":"현존 최고 의서 = 향약구급방.","w":["","이 설명은 옳은 내용입니다. 해설을 확인하세요."],"p":"15강 고려(문화 2) › 과학","h":0},
{"id":"K1-114","t":"15강 고려(문화 2)","q":"고려 후기에는 원의 영향으로 다포 양식 건축이 나타났다.","c":["맞다","틀리다"],"a":0,"e":"다포 양식의 대표 건물은 사리원 성불사 응진전입니다.","tip":"다포 = 고려 후기~조선.","w":["","이 설명은 옳은 내용입니다. 해설을 확인하세요."],"p":"15강 고려(문화 2) › 건축","h":0},
{"id":"K1-115","t":"16강 조선 전기(정치)","q":"다음 정책을 추진한 왕의 업적으로 옳은 것은?","c":["홍문관을 설치하였다","6조 직계제를 실시하고 사병을 혁파하였다","의정부 서사제를 실시하였다","직전법을 실시하였다"],"a":1,"e":"태종은 6조 직계제, 사병 혁파, 호패법, 양전 사업, 사원 정리, 계미자 주조로 왕권을 강화했습니다.","tip":"태종 = 6조 직계·호패·신문고.","w":["성종의 정책입니다.","","세종의 정책입니다.","세조의 정책입니다."],"p":"16강 조선 전기(정치) › 태종","h":1,"d":"사간원을 독립시키고 신문고를 설치하였다."},
{"id":"K1-116","t":"16강 조선 전기(정치)","q":"전분 6등법과 연분 9등법을 시행한 왕의 업적으로 옳은 것은?","c":["최윤덕, 김종서를 보내 4군 6진을 개척하였다","『조선경국전』을 편찬하였다","계유정난으로 정권을 장악하였다","『경국대전』을 완성하여 반포하였다"],"a":0,"e":"세종은 의정부 서사제, 집현전, 4군 6진, 공법, 훈민정음 창제를 추진했습니다.","tip":"세종 = 공법·4군 6진.","w":["","태조 때 정도전의 저술입니다.","수양 대군(세조)입니다.","성종 때입니다."],"p":"16강 조선 전기(정치) › 세종","h":1},
{"id":"K1-117","t":"16강 조선 전기(정치)","q":"이시애의 난을 진압한 왕의 재위 시기 사실로 옳은 것은?","c":["사간원을 독립시켰다","집현전을 설치하였다","현직 관리에게만 수조권을 주는 직전법을 실시하였다","관수관급제를 실시하였다"],"a":2,"e":"세조는 6조 직계제 부활, 집현전·경연 폐지, 직전법(1466), 이시애의 난 진압 후 유향소 폐지, 『경국대전』 편찬 착수 등을 했습니다.","tip":"세조 = 직전법·이시애.","w":["태종 때입니다.","세종 때입니다(세조는 폐지).","","성종 때입니다."],"p":"16강 조선 전기(정치) › 세조","h":1},
{"id":"K1-118","t":"16강 조선 전기(정치)","q":"『경국대전』을 완성·반포한 왕의 업적으로 옳은 것은?","c":["6조 직계제를 처음 실시하였다","현량과를 실시하였다","홍문관을 설치하고 경연을 활성화하였다","갑인자를 주조하였다"],"a":2,"e":"성종은 『경국대전』 완성, 홍문관, 관수관급제, 사림 등용, 『동국통감』·『국조오례의』 편찬 등 체제를 완성했습니다.","tip":"성종 = 경국대전·홍문관.","w":["태종입니다.","중종 때 조광조의 건의입니다.","","세종 때입니다."],"p":"16강 조선 전기(정치) › 성종","h":1},
{"id":"K1-119","t":"16강 조선 전기(정치)","q":"다음 자료의 인물이 추진한 개혁으로 옳은 것은?","c":["「조의제문」을 지어 세조의 즉위를 비판하였다","폐비 윤씨 사건을 문제 삼았다","대윤과 소윤의 대립을 주도하였다","소격서를 폐지하고 향약을 보급하였다"],"a":3,"e":"조광조의 급진적 개혁은 훈구의 반발로 기묘사화(1519)를 불러왔습니다.","tip":"현량과·위훈 삭제 = 조광조.","w":["김종직입니다.","갑자사화의 배경입니다.","을사사화의 배경입니다.",""],"p":"16강 조선 전기(정치) › 조광조","h":1,"d":"현량과를 실시하여 사림을 등용하고, 반정 공신들의 위훈을 삭제할 것을 주장하였다."},
{"id":"K1-120","t":"16강 조선 전기(정치)","q":"다음 사화를 일어난 순서대로 바르게 나열한 것은?","c":["(나) - (다) - (가)","(가) - (나) - (다)","(나) - (가) - (다)","(다) - (가) - (나)"],"a":2,"e":"무오사화(1498, 조의제문) → 갑자사화(1504, 폐비 윤씨) → 기묘사화(1519, 조광조) → 을사사화(1545, 외척 대립).","tip":"무갑기을.","w":["기묘사화(1519)가 을사사화(1545)보다 먼저입니다.","무오사화(1498)가 가장 먼저입니다.","","무오 → 갑자 → 기묘 → 을사 순입니다."],"p":"16강 조선 전기(정치) › 사화","h":1,"d":"(가) 기묘사화 (나) 무오사화 (다) 을사사화"},
{"id":"K1-121","t":"16강 조선 전기(정치)","q":"선조 때 이조 전랑 임명 문제를 둘러싸고 김효원 중심의 동인과 심의겸 중심의 서인으로 나뉘었다.","c":["맞다","틀리다"],"a":0,"e":"이후 정여립 모반 사건과 건저의 사건을 계기로 동인은 남인과 북인으로 나뉘었습니다.","tip":"이조 전랑 → 동서 분당.","w":["","이 설명은 옳은 내용입니다. 해설을 확인하세요."],"p":"16강 조선 전기(정치) › 붕당의 형성","h":0},
{"id":"K1-122","t":"16강 조선 전기(정치)","q":"정도전은 『불씨잡변』을 지어 불교를 비판하고 재상 중심의 정치를 주장하였다.","c":["맞다","틀리다"],"a":0,"e":"정도전은 『조선경국전』, 『경제문감』, 『불씨잡변』을 저술했습니다.","tip":"정도전 = 재상 정치.","w":["","이 설명은 옳은 내용입니다. 해설을 확인하세요."],"p":"16강 조선 전기(정치) › 정도전","h":0},
{"id":"K1-123","t":"17강 조선(조직)","q":"다음 자료의 기구는?","c":["춘추관","의금부","홍문관","승정원"],"a":3,"e":"승정원은 도승지를 중심으로 왕명 출납을 맡았고 『승정원일기』를 남겼습니다.","tip":"왕명 출납 = 승정원.","w":["역사 편찬을 담당했습니다.","국왕 직속 사법 기구로 반역죄 등을 다루었습니다.","경연과 왕의 자문을 담당했습니다.",""],"p":"17강 조선(조직) › 중앙 정치","h":1,"d":"왕명의 출납을 맡은 왕의 비서 기관으로 ‘은대’라고도 불렸으며, 이곳에서 작성한 일기는 세계 기록 유산이다."},
{"id":"K1-124","t":"17강 조선(조직)","q":"조선의 삼사에 대한 설명으로 옳은 것은?","c":["사헌부와 사간원 관원은 5품 이하 관리 임명 때 서경권을 행사하였다","홍문관은 관리의 비리를 감찰하였다","의금부가 삼사에 포함되었다","사간원은 왕명 출납을 담당하였다"],"a":0,"e":"사헌부(감찰), 사간원(간쟁), 홍문관(경연·자문)의 삼사는 언론 기능으로 권력 독점을 견제했습니다.","tip":"삼사 = 헌·간·홍.","w":["","감찰은 사헌부의 기능입니다.","삼사는 사헌부·사간원·홍문관입니다.","왕명 출납은 승정원입니다."],"p":"17강 조선(조직) › 삼사","h":1},
{"id":"K1-125","t":"17강 조선(조직)","q":"조선의 지방 행정 제도에 대한 설명으로 옳은 것은?","c":["모든 군현에 수령을 파견하고 향·부곡·소를 소멸시켰다","양계에 병마사를 파견하였다","지방관이 파견되지 않는 속현이 많았다","관찰사는 자기 출신 지역에 임명되었다"],"a":0,"e":"조선은 8도에 관찰사를, 모든 군현에 수령을 파견했으며 향리는 수령을 보좌하는 아전으로 지위가 낮아졌습니다.","tip":"조선 = 모든 군현 수령 파견.","w":["","고려의 제도입니다.","고려의 모습입니다.","상피제로 출신 지역 임명을 피했습니다."],"p":"17강 조선(조직) › 지방 행정","h":1},
{"id":"K1-126","t":"17강 조선(조직)","q":"유향소는 좌수와 별감을 두어 수령을 보좌하고 향리의 비리를 감찰하였다.","c":["맞다","틀리다"],"a":0,"e":"경재소는 중앙의 고관이 출신 지역 유향소를 통제한 기구입니다.","tip":"유향소 = 좌수·별감.","w":["","이 설명은 옳은 내용입니다. 해설을 확인하세요."],"p":"17강 조선(조직) › 향촌 자치","h":0},
{"id":"K1-127","t":"17강 조선(조직)","q":"조선 시대 교육 기관에 대한 설명으로 옳은 것은?","c":["향교는 한양에만 설치되었다","4부 학당은 지방에 설치된 관립 학교였다","성균관 입학 자격은 잡과 합격자에게 주어졌다","백운동 서원은 주세붕이 세웠고 이황의 건의로 소수 서원이라는 사액을 받았다"],"a":3,"e":"관학: 성균관(최고), 4부 학당(한양), 향교(지방) / 사학: 서원, 서당.","tip":"최초 서원 = 백운동(주세붕) → 소수 서원(사액).","w":["향교는 지방(부·목·군·현)에 설치되었습니다.","4부 학당은 한양의 중등 관학입니다.","생원·진사에게 기본 입학 자격이 있었습니다.",""],"p":"17강 조선(조직) › 교육","h":0},
{"id":"K1-128","t":"17강 조선(조직)","q":"조선에서는 탐관오리의 아들, 재가한 여자의 자손, 서얼의 문과 응시가 제한되었다.","c":["맞다","틀리다"],"a":0,"e":"양인이면 원칙적으로 응시할 수 있었으나 이들은 문과 응시가 제한되었습니다.","tip":"문과 제한 = 탐관오리 아들·재가녀 자손·서얼.","w":["","이 설명은 옳은 내용입니다. 해설을 확인하세요."],"p":"17강 조선(조직) › 과거 제도","h":0},
{"id":"K1-129","t":"17강 조선(조직)","q":"조선 전기 군사 제도에 대한 설명으로 옳은 것은?","c":["세조 때 지역 단위의 방위 체제인 진관 체제가 실시되었다","중앙군은 5군영으로 편성되었다","속오군은 양반만으로 편성되었다","별무반을 편성하여 국경을 방어하였다"],"a":0,"e":"진관 체제(세조) → 제승방략 체제(16세기) → 임진왜란 후 속오군 편성으로 바뀌었습니다.","tip":"진관 = 세조, 제승방략 = 16세기.","w":["","5군영은 조선 후기의 중앙군입니다.","속오군은 양반부터 노비까지 편성되었습니다.","고려 숙종 때의 일입니다."],"p":"17강 조선(조직) › 군사 제도","h":0},
{"id":"K1-130","t":"17강 조선(조직)","q":"이조 전랑은 삼사 관리의 추천권과 자신의 후임자 추천권을 행사하였다.","c":["맞다","틀리다"],"a":0,"e":"이조 전랑의 막강한 권한이 붕당 형성의 계기가 되었고, 영조가 후임자 추천권을 폐지했습니다.","tip":"이조 전랑 = 통청권·자대권.","w":["","이 설명은 옳은 내용입니다. 해설을 확인하세요."],"p":"17강 조선(조직) › 이조 전랑","h":0},
{"id":"K1-131","t":"18강 조선 전기(외교)","q":"다음 사건을 일어난 순서대로 바르게 나열한 것은?","c":["(가) - (나) - (다)","(나) - (가) - (다)","(나) - (다) - (가)","(다) - (가) - (나)"],"a":1,"e":"이종무의 쓰시마 정벌(1419) → 3포 개항(1426) → 계해약조(1443) 순으로 강경책과 회유책을 병행했습니다.","tip":"정벌 → 개항 → 약조.","w":["쓰시마 정벌(1419)이 가장 먼저입니다.","","3포 개항(1426)이 계해약조(1443)보다 먼저입니다.","쓰시마 정벌 → 3포 개항 → 계해약조 순입니다."],"p":"18강 조선 전기(외교) › 일본과의 관계","h":0,"d":"(가) 3포 개항 (나) 쓰시마섬 정벌 (다) 계해약조 체결"},
{"id":"K1-132","t":"18강 조선 전기(외교)","q":"비변사에 대한 설명으로 옳은 것은?","c":["왕명 출납을 담당하였다","세조 때 6조 직계제를 위해 설치되었다","3포 왜란을 계기로 임시 설치되었다가 을묘왜변을 계기로 상설 기구가 되었다","흥선 대원군 때 기능이 크게 강화되었다"],"a":2,"e":"비변사는 임진왜란 이후 국정 최고 기구로 확대되어 의정부와 6조를 유명무실하게 만들었습니다.","tip":"3포 왜란(임시) → 을묘왜변(상설) → 임란(최고 기구).","w":["승정원의 기능입니다.","비변사는 16세기 국방 문제를 계기로 설치되었습니다.","","흥선 대원군은 비변사를 축소·폐지했습니다."],"p":"18강 조선 전기(외교) › 비변사","h":1},
{"id":"K1-133","t":"18강 조선 전기(외교)","q":"다음 전투 이후에 일어난 사실로 옳은 것은?","c":["옥포에서 수군이 첫 승리를 거두었다","정발이 부산진에서 전사하였다","권율이 행주산성에서 일본군을 격퇴하였다","신립이 탄금대에서 패배하였다"],"a":2,"e":"부산진·동래성 함락 → 탄금대 패배 → 옥포·사천 → 한산도(1592.7) → 진주 대첩(1592.10) → 평양성 탈환(1593.1) → 행주 대첩(1593.2).","tip":"한산도 → 진주 → 평양 → 행주.","w":["옥포 해전(1592.5)은 한산도 대첩 이전입니다.","전쟁 초기(1592.4)입니다.","","한산도 대첩(1592.7) 이전(1592.4)입니다."],"p":"18강 조선 전기(외교) › 임진왜란","h":1,"d":"이순신이 한산도 앞바다에서 학익진을 펼쳐 일본 수군을 크게 무찔렀다."},
{"id":"K1-134","t":"18강 조선 전기(외교)","q":"임진왜란 때 의병 활동에 대한 설명으로 옳은 것은?","c":["곽재우가 의령에서 의병을 일으켜 홍의장군으로 불렸다","김시민이 의병을 이끌고 행주산성에서 승리하였다","정문부가 금산에서 승병 영규와 함께 싸우다 전사하였다","조헌이 함경도 길주에서 일본군을 물리쳤다"],"a":0,"e":"곽재우(의령), 고경명(담양), 조헌(금산), 정문부(길주), 휴정·유정(승병) 등이 활약했습니다.","tip":"홍의장군 = 곽재우.","w":["","김시민은 진주 목사로 진주 대첩을 이끌었습니다.","조헌의 활동입니다(정문부는 길주).","정문부의 활동입니다."],"p":"18강 조선 전기(외교) › 의병","h":0},
{"id":"K1-135","t":"18강 조선 전기(외교)","q":"다음 자료의 왕이 추진한 정책으로 옳은 것은?","c":["삼전도에서 청에 항복하였다","이괄의 난으로 공주로 피란하였다","어영청을 강화하여 북벌을 준비하였다","경기도에 대동법을 처음 실시하였다"],"a":3,"e":"광해군은 중립 외교, 대동법(경기), 『동의보감』 완성, 토지 대장·호적 정비를 추진했으나 인조반정(1623)으로 폐위되었습니다.","tip":"중립 외교·대동법 = 광해군.","w":["인조입니다.","인조입니다.","효종입니다.",""],"p":"18강 조선 전기(외교) › 광해군","h":1,"d":"왕이 강홍립에게 명의 요청에 따라 출병하되 형세를 보아 향배를 정하라고 지시하였다."},
{"id":"K1-136","t":"18강 조선 전기(외교)","q":"병자호란에 대한 설명으로 옳은 것은?","c":["정봉수가 용골산성에서 항전하였다","후금과 형제 관계를 맺었다","인조가 남한산성에서 항전하다 삼전도에서 항복하였다","이괄의 난 잔당이 후금에 투항한 것이 배경이 되었다"],"a":2,"e":"병자호란(1636)으로 청과 군신 관계를 맺고, 소현 세자·봉림 대군이 인질로 끌려갔습니다.","tip":"정묘 = 형제, 병자 = 군신.","w":["정묘호란 때입니다.","정묘호란의 결과입니다.","","정묘호란의 배경입니다."],"p":"18강 조선 전기(외교) › 호란","h":1},
{"id":"K1-137","t":"18강 조선 전기(외교)","q":"세종 때 체결된 계해약조로 세견선을 50척, 세사미두를 200석으로 제한하였다.","c":["맞다","틀리다"],"a":0,"e":"계해약조(1443)는 제한된 범위의 교역을 허용했습니다.","tip":"계해약조 = 50척·200석.","w":["","이 설명은 옳은 내용입니다. 해설을 확인하세요."],"p":"18강 조선 전기(외교) › 계해약조","h":0},
{"id":"K1-138","t":"18강 조선 전기(외교)","q":"훈련도감은 임진왜란 중 유성룡의 건의로 설치되었으며 포수·사수·살수의 삼수병으로 구성되었다.","c":["맞다","틀리다"],"a":0,"e":"훈련도감은 급료를 받는 직업 군인으로 구성되었습니다.","tip":"훈련도감 = 삼수병.","w":["","이 설명은 옳은 내용입니다. 해설을 확인하세요."],"p":"18강 조선 전기(외교) › 훈련도감","h":0},
{"id":"K1-139","t":"19강 조선 전기(경제, 사회)","q":"다음 토지 제도에 대한 설명으로 옳은 것은?","c":["국가가 직접 조세를 거두어 관리에게 나누어 주었다","수신전과 휼양전의 명목으로 세습되기도 하였다","현직 관리에게만 수조권을 지급하였다","관품과 인품을 기준으로 지급하였다"],"a":1,"e":"과전법(1391) → 직전법(1466, 세조) → 관수관급제(1470, 성종) → 직전법 폐지(1556, 명종) 순입니다.","tip":"과전법 = 경기·수신전·휼양전.","w":["성종의 관수관급제입니다.","","세조의 직전법입니다.","고려 시정 전시과입니다."],"p":"19강 조선 전기(경제, 사회) › 과전법","h":1,"d":"고려 말 공양왕 때 마련되었으며, 경기 지역의 토지에 한하여 전·현직 관리에게 수조권을 지급하였다."},
{"id":"K1-140","t":"19강 조선 전기(경제, 사회)","q":"세조 때 직전법이 실시되어 현직 관리에게만 수조권을 지급하고 수신전·휼양전을 폐지하였다.","c":["맞다","틀리다"],"a":0,"e":"직전법은 관리에게 지급할 토지 부족 문제를 해결하려는 조치였습니다.","tip":"직전법 = 현직만.","w":["","이 설명은 옳은 내용입니다. 해설을 확인하세요."],"p":"19강 조선 전기(경제, 사회) › 직전법","h":0},
{"id":"K1-141","t":"19강 조선 전기(경제, 사회)","q":"세종 때 시행된 공법에 대한 설명으로 옳은 것은?","c":["토지 비옥도를 6등급, 풍흉을 9등급으로 나누어 1결당 최고 20두에서 최저 4두까지 거두었다","토지 1결당 쌀 12두를 공납 대신 거두었다","풍흉에 관계없이 1결당 4~6두로 고정하였다","군포를 1년에 1필로 줄였다"],"a":0,"e":"공법은 전분 6등법과 연분 9등법으로 구성되었습니다.","tip":"공법 = 6등·9등·20~4두.","w":["","대동법입니다.","인조 때의 영정법입니다.","영조의 균역법입니다."],"p":"19강 조선 전기(경제, 사회) › 조세 제도","h":1},
{"id":"K1-142","t":"19강 조선 전기(경제, 사회)","q":"조선 전기 신분 제도에 대한 설명으로 옳은 것은?","c":["신량역천은 법적으로 양인이지만 천한 역을 담당하였다","노비는 매매나 상속의 대상이 될 수 없었다","법적으로 양반과 상민을 구분하는 반상제가 기준이었다","서얼은 문과에 자유롭게 응시할 수 있었다"],"a":0,"e":"법제상 양천제였으나 실제로는 양반·중인·상민·천민의 반상제가 정착했습니다.","tip":"법 = 양천제, 실제 = 반상제.","w":["","노비는 재산으로 매매·상속되었습니다.","법제적 기준은 양인과 천인의 양천제입니다.","서얼은 문과 응시가 금지되었습니다."],"p":"19강 조선 전기(경제, 사회) › 신분 제도","h":0},
{"id":"K1-143","t":"19강 조선 전기(경제, 사회)","q":"조선의 향약에 대한 설명으로 옳은 것은?","c":["매향 활동을 하던 불교 신앙 조직이었다","서얼의 관직 진출을 요구하였다","중앙의 고관이 지방의 유향소를 통제하는 기구였다","중종 때 조광조 등 사림이 보급을 시도하였다"],"a":3,"e":"향약은 덕업상권, 과실상규, 예속상교, 환난상휼의 4대 덕목으로 사림의 향촌 지배를 뒷받침했습니다.","tip":"향약 4덕목.","w":["고려의 향도입니다.","서얼 허통 운동입니다.","경재소입니다.",""],"p":"19강 조선 전기(경제, 사회) › 향약","h":0},
{"id":"K1-144","t":"19강 조선 전기(경제, 사회)","q":"세종 때 정초 등이 우리 실정에 맞는 농법을 정리한 『농사직설』을 편찬하였다.","c":["맞다","틀리다"],"a":0,"e":"『농사직설』은 농민의 경험을 토대로 한 우리 농서입니다. 성종 때는 강희맹이 『금양잡록』을 지었습니다.","tip":"농사직설 = 세종.","w":["","이 설명은 옳은 내용입니다. 해설을 확인하세요."],"p":"19강 조선 전기(경제, 사회) › 농업","h":0},
{"id":"K1-145","t":"19강 조선 전기(경제, 사회)","q":"15세기 후반 전라도 지역에서 장시가 처음 등장하였다.","c":["맞다","틀리다"],"a":0,"e":"장시는 16세기에 확대되고 조선 후기에 전국 1,000여 곳으로 늘었습니다.","tip":"장시 = 15세기 후반 전라도.","w":["","이 설명은 옳은 내용입니다. 해설을 확인하세요."],"p":"19강 조선 전기(경제, 사회) › 상업","h":0},
{"id":"K1-146","t":"19강 조선 전기(경제, 사회)","q":"16세기까지는 혼인 후 남자가 여자 집에서 생활하는 경우가 많았고 재산을 자녀에게 균분 상속하였다.","c":["맞다","틀리다"],"a":0,"e":"17세기 이후 친영 제도, 장자 중심 상속, 양자 입양이 일반화되었습니다.","tip":"조선 전기 = 남귀여가·균분.","w":["","이 설명은 옳은 내용입니다. 해설을 확인하세요."],"p":"19강 조선 전기(경제, 사회) › 가족 제도","h":0},
{"id":"K1-147","t":"20강 조선 전기(문화 1)","q":"『성학십도』를 지은 학자에 대한 설명으로 옳은 것은?","c":["경(敬)과 의(義)를 강조하며 실천을 중시하였다","『동호문답』을 지어 개혁안을 제시하였다","『성학집요』를 저술하였다","예안 향약을 시행하였다"],"a":3,"e":"이황은 주리론적 입장에서 『성학십도』, 『주자서절요』를 지었고 영남학파(남인)로 이어졌으며 일본 성리학에 영향을 주었습니다.","tip":"성학십도 = 이황.","w":["조식입니다.","이이입니다.","이이입니다.",""],"p":"20강 조선 전기(문화 1) › 이황","h":1},
{"id":"K1-148","t":"20강 조선 전기(문화 1)","q":"다음 자료의 학자에 대한 설명으로 옳은 것은?","c":["『성학십도』를 지어 왕에게 올렸다","백운동 서원의 사액을 건의하였다","예안 향약을 시행하였다","『성학집요』를 저술하였다"],"a":3,"e":"이이는 기를 중시하고 『성학집요』, 『동호문답』, 『격몽요결』을 지었으며 기호학파(서인)로 이어졌습니다.","tip":"성학집요·동호문답 = 이이.","w":["이황입니다.","이황입니다.","이황입니다.",""],"p":"20강 조선 전기(문화 1) › 이이","h":1,"d":"『동호문답』을 지어 수미법 시행을 주장하는 등 현실 개혁 방안을 제시하였다."},
{"id":"K1-149","t":"20강 조선 전기(문화 1)","q":"『조선왕조실록』에 대한 설명으로 옳은 것은?","c":["기전체로 서술되었다","왕이 직접 열람하고 수정할 수 있었다","왕이 죽은 뒤 춘추관에 실록청을 설치하여 사초와 시정기 등을 바탕으로 편찬하였다","임진왜란 이후 충주 사고본만 남았다"],"a":2,"e":"『조선왕조실록』은 유네스코 세계 기록 유산이며 임진왜란 뒤 전주 사고본을 바탕으로 재간행되었습니다.","tip":"실록 = 편년체·사초·전주 사고.","w":["편년체로 서술되었습니다.","왕도 실록을 볼 수 없었습니다.","","전주 사고본만 남았습니다."],"p":"20강 조선 전기(문화 1) › 역사서","h":1},
{"id":"K1-150","t":"20강 조선 전기(문화 1)","q":"조선 전기 역사서에 대한 설명으로 옳은 것은?","c":["『고려사절요』는 기전체로 서술되었다","『고려국사』는 이이가 편찬하였다","『동국통감』은 성종 때 서거정 등이 고조선부터 고려 말까지를 편년체로 정리하였다","『고려사』는 편년체로 서술되었다"],"a":2,"e":"『고려사』(기전체, 문종), 『고려사절요』(편년체, 문종~단종), 『동국통감』(편년체, 성종)이 편찬되었습니다.","tip":"고려사 = 기전, 절요 = 편년.","w":["『고려사절요』는 편년체입니다.","정도전이 편찬했습니다.","","『고려사』는 기전체입니다."],"p":"20강 조선 전기(문화 1) › 역사서","h":0},
{"id":"K1-151","t":"20강 조선 전기(문화 1)","q":"태종 때 제작된 혼일강리역대국도지도는 현존하는 동양 최고(最古)의 세계 지도이다.","c":["맞다","틀리다"],"a":0,"e":"1402년 제작되었으며 중국·한반도·일본·아라비아·아프리카까지 담았습니다.","tip":"혼일강리도 = 태종.","w":["","이 설명은 옳은 내용입니다. 해설을 확인하세요."],"p":"20강 조선 전기(문화 1) › 지도","h":0},
{"id":"K1-152","t":"20강 조선 전기(문화 1)","q":"세종 때 편찬된 것이 아닌 것은?","c":["『국조오례의』","『동국정운』","「월인천강지곡」","「용비어천가」"],"a":0,"e":"『국조오례의』는 성종 때 완성된 국가 의례서입니다.","tip":"국조오례의 = 성종.","w":["","세종 때 편찬되었습니다.","세종 때 편찬되었습니다.","세종 때 편찬되었습니다."],"p":"20강 조선 전기(문화 1) › 편찬 사업","h":0},
{"id":"K1-153","t":"20강 조선 전기(문화 1)","q":"조식은 경(敬)과 의(義)를 강조하며 실천을 중시하였고, 그의 문인들은 북인 형성에 영향을 주었다.","c":["맞다","틀리다"],"a":0,"e":"조식은 노장 사상에도 포용적이었으며 제자들은 임진왜란 때 의병으로도 활약했습니다.","tip":"조식 = 경·의·북인.","w":["","이 설명은 옳은 내용입니다. 해설을 확인하세요."],"p":"20강 조선 전기(문화 1) › 성리학","h":0},
{"id":"K1-154","t":"20강 조선 전기(문화 1)","q":"『신증동국여지승람』은 성종 때 편찬된 『동국여지승람』을 보완하여 중종 때 간행되었다.","c":["맞다","틀리다"],"a":0,"e":"『동국여지승람』(성종) → 『신증동국여지승람』(중종, 1530)입니다.","tip":"신증 = 중종.","w":["","이 설명은 옳은 내용입니다. 해설을 확인하세요."],"p":"20강 조선 전기(문화 1) › 지리지","h":0},
{"id":"K1-155","t":"01강 역사는 왜 배우는가","q":"랑케는 역사가의 주관적 해석을 중시하여 기록으로서의 역사를 강조하였다.","c":["맞다","틀리다"],"a":1,"e":"랑케는 ‘본래 있었던 그대로’의 객관적 사실을 강조했고, 역사가의 해석을 중시한 인물은 카입니다.","tip":"랑케 = 객관, 카 = 해석.","w":["이 설명은 틀린 내용입니다. 해설에서 바른 내용을 확인하세요.",""],"p":"01강 역사는 왜 배우는가 › 역사의 의미","h":0},
{"id":"K1-156","t":"01강 역사는 왜 배우는가","q":"역사 학습은 과거 사실의 암기에 그칠 뿐 현재의 문제 해결과는 관련이 없다.","c":["맞다","틀리다"],"a":1,"e":"역사 학습은 현재를 이해하고 미래를 전망하며 비판적 사고와 정체성을 기르는 데 도움이 됩니다.","tip":"역사 = 현재 이해.","w":["이 설명은 틀린 내용입니다. 해설에서 바른 내용을 확인하세요.",""],"p":"01강 역사는 왜 배우는가 › 역사 학습의 목적","h":0},
{"id":"K1-157","t":"02강 선사 시대","q":"신석기 시대에는 벼농사가 시작되어 반달 돌칼로 이삭을 수확하였다.","c":["맞다","틀리다"],"a":1,"e":"신석기 시대에는 조·피 등 잡곡 농경이 시작되었고 벼농사와 반달 돌칼은 청동기 시대입니다.","tip":"벼농사 = 청동기.","w":["이 설명은 틀린 내용입니다. 해설에서 바른 내용을 확인하세요.",""],"p":"02강 선사 시대 › 신석기 시대","h":0},
{"id":"K1-158","t":"02강 선사 시대","q":"구석기 시대에는 계급이 발생하여 고인돌을 만들었다.","c":["맞다","틀리다"],"a":1,"e":"구석기 시대는 평등한 무리 사회였고 고인돌은 청동기 시대 지배층의 무덤입니다.","tip":"고인돌 = 청동기.","w":["이 설명은 틀린 내용입니다. 해설에서 바른 내용을 확인하세요.",""],"p":"02강 선사 시대 › 구석기 시대","h":0},
{"id":"K1-159","t":"03강 여러 나라의 성장","q":"삼한의 천군은 정치적 지배자로서 소도에서 정치를 주관하였다.","c":["맞다","틀리다"],"a":1,"e":"천군은 제사장이며 정치적 지배자는 신지·읍차 등 군장입니다. 소도는 천군이 다스린 신성 지역입니다.","tip":"천군 = 제사장.","w":["이 설명은 틀린 내용입니다. 해설에서 바른 내용을 확인하세요.",""],"p":"03강 여러 나라의 성장 › 삼한","h":0},
{"id":"K1-160","t":"03강 여러 나라의 성장","q":"동예에서는 12월에 영고라는 제천 행사를 열었다.","c":["맞다","틀리다"],"a":1,"e":"영고(12월)는 부여의 제천 행사이고 동예는 무천(10월)입니다.","tip":"영고 = 부여, 무천 = 동예.","w":["이 설명은 틀린 내용입니다. 해설에서 바른 내용을 확인하세요.",""],"p":"03강 여러 나라의 성장 › 동예","h":0},
{"id":"K1-161","t":"04강 고대(고구려, 가야)","q":"광개토 대왕은 평양으로 도읍을 옮기고 한성을 함락하였다.","c":["맞다","틀리다"],"a":1,"e":"평양 천도(427)와 한성 함락(475)은 장수왕의 업적입니다.","tip":"평양 천도 = 장수왕.","w":["이 설명은 틀린 내용입니다. 해설에서 바른 내용을 확인하세요.",""],"p":"04강 고대(고구려, 가야) › 고구려 광개토 대왕","h":0},
{"id":"K1-162","t":"04강 고대(고구려, 가야)","q":"소수림왕은 진대법을 실시하여 빈민을 구제하였다.","c":["맞다","틀리다"],"a":1,"e":"진대법은 고국천왕이 을파소의 건의로 실시했습니다. 소수림왕은 불교 수용, 태학 설립, 율령 반포를 했습니다.","tip":"진대법 = 고국천왕.","w":["이 설명은 틀린 내용입니다. 해설에서 바른 내용을 확인하세요.",""],"p":"04강 고대(고구려, 가야) › 고구려 소수림왕","h":0},
{"id":"K1-163","t":"05강 고대(백제, 신라)","q":"백제 성왕은 22담로를 설치하여 지방에 왕족을 파견하였다.","c":["맞다","틀리다"],"a":1,"e":"22담로는 무령왕의 지방 통제책이며 성왕은 사비 천도와 22부 정비를 했습니다.","tip":"22담로 = 무령왕.","w":["이 설명은 틀린 내용입니다. 해설에서 바른 내용을 확인하세요.",""],"p":"05강 고대(백제, 신라) › 백제 성왕","h":0},
{"id":"K1-164","t":"05강 고대(백제, 신라)","q":"신라 지증왕은 불교를 공인하고 율령을 반포하였다.","c":["맞다","틀리다"],"a":1,"e":"불교 공인과 율령 반포는 법흥왕의 업적이며 지증왕은 국호 신라 확정, 우산국 복속을 했습니다.","tip":"율령·불교 = 법흥왕.","w":["이 설명은 틀린 내용입니다. 해설에서 바른 내용을 확인하세요.",""],"p":"05강 고대(백제, 신라) › 신라 지증왕","h":0},
{"id":"K1-165","t":"06강 고대(통일 신라, 발해)","q":"발해 문왕은 인안 연호를 사용하고 장문휴를 보내 당의 등주를 공격하였다.","c":["맞다","틀리다"],"a":1,"e":"인안 연호와 등주 공격은 무왕이며 문왕은 대흥 연호와 상경 천도를 했습니다.","tip":"무왕 = 인안·등주.","w":["이 설명은 틀린 내용입니다. 해설에서 바른 내용을 확인하세요.",""],"p":"06강 고대(통일 신라, 발해) › 발해 무왕","h":0},
{"id":"K1-166","t":"06강 고대(통일 신라, 발해)","q":"신문왕은 녹읍을 부활시켜 귀족의 경제 기반을 보장하였다.","c":["맞다","틀리다"],"a":1,"e":"신문왕은 관료전을 지급하고 녹읍을 폐지했으며, 녹읍 부활은 경덕왕(757) 때입니다.","tip":"폐지 = 신문왕, 부활 = 경덕왕.","w":["이 설명은 틀린 내용입니다. 해설에서 바른 내용을 확인하세요.",""],"p":"06강 고대(통일 신라, 발해) › 신라 신문왕","h":0},
{"id":"K1-167","t":"07강 고대(경제, 사회)","q":"신라의 6두품은 대아찬 이상의 관등까지 승진할 수 있었다.","c":["맞다","틀리다"],"a":1,"e":"6두품은 아찬(6관등)까지만 승진할 수 있었고 대아찬 이상은 진골만 가능했습니다.","tip":"6두품 = 아찬까지.","w":["이 설명은 틀린 내용입니다. 해설에서 바른 내용을 확인하세요.",""],"p":"07강 고대(경제, 사회) › 골품제","h":0},
{"id":"K1-168","t":"07강 고대(경제, 사회)","q":"신라 촌락 문서(민정 문서)에서는 호(戶)를 3등급으로 나누어 기록하였다.","c":["맞다","틀리다"],"a":1,"e":"호는 9등급, 인구는 연령에 따라 6등급으로 나누어 기록했습니다.","tip":"호 9등급.","w":["이 설명은 틀린 내용입니다. 해설에서 바른 내용을 확인하세요.",""],"p":"07강 고대(경제, 사회) › 민정 문서","h":0},
{"id":"K1-169","t":"08강 고대(문화 1)","q":"의상은 『대승기신론소』를 저술하고 정토 신앙을 대중화하였다.","c":["맞다","틀리다"],"a":1,"e":"『대승기신론소』와 정토 신앙의 대중화는 원효이며 의상은 화엄 사상과 관음 신앙을 전파했습니다.","tip":"원효 = 일심·정토, 의상 = 화엄·관음.","w":["이 설명은 틀린 내용입니다. 해설에서 바른 내용을 확인하세요.",""],"p":"08강 고대(문화 1) › 의상과 원효","h":0},
{"id":"K1-170","t":"08강 고대(문화 1)","q":"최치원은 「화왕계」를 지어 신문왕에게 도덕 정치를 권하였다.","c":["맞다","틀리다"],"a":1,"e":"「화왕계」는 설총의 작품이며 최치원은 「토황소격문」과 『계원필경』으로 알려졌습니다.","tip":"화왕계 = 설총.","w":["이 설명은 틀린 내용입니다. 해설에서 바른 내용을 확인하세요.",""],"p":"08강 고대(문화 1) › 최치원","h":0},
{"id":"K1-171","t":"09강 고대(문화 2)","q":"신라의 천마총은 굴식 돌방무덤으로 벽화가 그려져 있다.","c":["맞다","틀리다"],"a":1,"e":"천마총은 돌무지덧널무덤이며 벽화가 없습니다. 벽화는 굴식 돌방무덤에 그려집니다.","tip":"돌무지덧널 = 벽화 없음.","w":["이 설명은 틀린 내용입니다. 해설에서 바른 내용을 확인하세요.",""],"p":"09강 고대(문화 2) › 고분","h":0},
{"id":"K1-172","t":"09강 고대(문화 2)","q":"발해 정효 공주 묘는 고구려 양식의 굴식 돌방무덤이다.","c":["맞다","틀리다"],"a":1,"e":"정효 공주 묘는 당의 영향을 받은 벽돌무덤이며 정혜 공주 묘가 굴식 돌방무덤입니다.","tip":"정혜 = 고구려식, 정효 = 당식.","w":["이 설명은 틀린 내용입니다. 해설에서 바른 내용을 확인하세요.",""],"p":"09강 고대(문화 2) › 발해 문화","h":0},
{"id":"K1-173","t":"10강 고려(초기 정치)","q":"광종은 12목을 설치하고 지방관을 파견하였다.","c":["맞다","틀리다"],"a":1,"e":"12목 설치는 성종의 정책이며 광종은 노비안검법, 과거제, 공복 제정을 했습니다.","tip":"12목 = 성종.","w":["이 설명은 틀린 내용입니다. 해설에서 바른 내용을 확인하세요.",""],"p":"10강 고려(초기 정치) › 고려 성종","h":0},
{"id":"K1-174","t":"10강 고려(초기 정치)","q":"고려의 도병마사는 관리의 비리를 감찰하고 풍속을 바로잡는 기구였다.","c":["맞다","틀리다"],"a":1,"e":"도병마사는 재신·추밀이 국방·군사 문제를 논의한 회의 기구이며 감찰은 어사대입니다.","tip":"도병마사 = 국방, 어사대 = 감찰.","w":["이 설명은 틀린 내용입니다. 해설에서 바른 내용을 확인하세요.",""],"p":"10강 고려(초기 정치) › 고려 중앙 정치","h":0},
{"id":"K1-175","t":"11강 고려(중기 정치~무신 정변)","q":"최우는 교정도감을 설치하고 봉사 10조를 올렸다.","c":["맞다","틀리다"],"a":1,"e":"교정도감과 봉사 10조는 최충헌이며 최우는 정방, 서방, 삼별초를 설치했습니다.","tip":"교정도감 = 최충헌.","w":["이 설명은 틀린 내용입니다. 해설에서 바른 내용을 확인하세요.",""],"p":"11강 고려(중기 정치~무신 정변) › 최충헌","h":0},
{"id":"K1-176","t":"11강 고려(중기 정치~무신 정변)","q":"망이·망소이는 개경에서 노비 신분 해방을 위한 봉기를 계획하였다.","c":["맞다","틀리다"],"a":1,"e":"개경에서 신분 해방을 계획한 인물은 만적이며 망이·망소이는 공주 명학소에서 봉기했습니다.","tip":"만적 = 신분 해방.","w":["이 설명은 틀린 내용입니다. 해설에서 바른 내용을 확인하세요.",""],"p":"11강 고려(중기 정치~무신 정변) › 무신 집권기 봉기","h":0},
{"id":"K1-177","t":"12강 고려(외교)","q":"강감찬은 거란의 1차 침입 때 소손녕과 담판하여 강동 6주를 확보하였다.","c":["맞다","틀리다"],"a":1,"e":"서희가 1차 침입 때 외교 담판으로 강동 6주를 확보했고 강감찬은 3차 침입 때 귀주 대첩을 이끌었습니다.","tip":"서희 = 담판, 강감찬 = 귀주.","w":["이 설명은 틀린 내용입니다. 해설에서 바른 내용을 확인하세요.",""],"p":"12강 고려(외교) › 거란의 침입","h":0},
{"id":"K1-178","t":"12강 고려(외교)","q":"공민왕은 원의 수도에 만권당을 세우고 정치도감을 설치하였다.","c":["맞다","틀리다"],"a":1,"e":"만권당은 충선왕이, 정치도감은 충목왕이 설치했습니다. 공민왕은 반원 정책과 신돈의 전민변정도감을 추진했습니다.","tip":"공민왕 = 반원 개혁.","w":["이 설명은 틀린 내용입니다. 해설에서 바른 내용을 확인하세요.",""],"p":"12강 고려(외교) › 공민왕","h":0},
{"id":"K1-179","t":"13강 고려(경제, 사회)","q":"고려의 시정 전시과는 현직 관리에게만 토지를 지급하였다.","c":["맞다","틀리다"],"a":1,"e":"시정 전시과는 전·현직 관리에게 관품과 인품을 기준으로 지급했고 현직만 지급한 것은 경정 전시과입니다.","tip":"경정 = 현직만.","w":["이 설명은 틀린 내용입니다. 해설에서 바른 내용을 확인하세요.",""],"p":"13강 고려(경제, 사회) › 전시과","h":0},
{"id":"K1-180","t":"13강 고려(경제, 사회)","q":"고려 시대에는 재산을 장남 중심으로 상속하였고 여성의 재가가 법으로 금지되었다.","c":["맞다","틀리다"],"a":1,"e":"고려는 자녀 균분 상속이었고 여성의 재가가 비교적 자유로웠습니다.","tip":"고려 = 균분·재가 자유.","w":["이 설명은 틀린 내용입니다. 해설에서 바른 내용을 확인하세요.",""],"p":"13강 고려(경제, 사회) › 가족 제도","h":0},
{"id":"K1-181","t":"14강 고려(문화 1)","q":"『삼국사기』는 단군의 건국 이야기를 수록한 불교 중심의 사서이다.","c":["맞다","틀리다"],"a":1,"e":"『삼국사기』는 단군 이야기를 싣지 않은 유교적 합리주의의 기전체 사서이며 단군을 실은 책은 『삼국유사』입니다.","tip":"단군 = 삼국유사·제왕운기.","w":["이 설명은 틀린 내용입니다. 해설에서 바른 내용을 확인하세요.",""],"p":"14강 고려(문화 1) › 삼국사기","h":0},
{"id":"K1-182","t":"14강 고려(문화 1)","q":"지눌은 교관겸수를 주장하며 해동 천태종을 창시하였다.","c":["맞다","틀리다"],"a":1,"e":"교관겸수·천태종은 의천이며 지눌은 정혜쌍수·돈오점수와 수선사 결사를 주도했습니다.","tip":"의천 = 교관겸수.","w":["이 설명은 틀린 내용입니다. 해설에서 바른 내용을 확인하세요.",""],"p":"14강 고려(문화 1) › 지눌과 의천","h":0},
{"id":"K1-183","t":"15강 고려(문화 2)","q":"『직지심체요절』은 현존하는 세계 최고(最古)의 목판 인쇄물이다.","c":["맞다","틀리다"],"a":1,"e":"『직지심체요절』은 현존 세계 최고의 금속 활자본이며, 최고의 목판 인쇄물은 무구정광대다라니경입니다.","tip":"직지 = 금속 활자.","w":["이 설명은 틀린 내용입니다. 해설에서 바른 내용을 확인하세요.",""],"p":"15강 고려(문화 2) › 인쇄술","h":0},
{"id":"K1-184","t":"15강 고려(문화 2)","q":"주심포 양식은 고려 후기에 원의 영향으로 처음 등장하였다.","c":["맞다","틀리다"],"a":1,"e":"고려 전기에는 주심포 양식이, 후기에는 원의 영향으로 다포 양식이 등장했습니다.","tip":"전기 = 주심포, 후기 = 다포.","w":["이 설명은 틀린 내용입니다. 해설에서 바른 내용을 확인하세요.",""],"p":"15강 고려(문화 2) › 건축","h":0},
{"id":"K1-185","t":"16강 조선 전기(정치)","q":"세종은 6조 직계제를 실시하고 호패법을 시행하였다.","c":["맞다","틀리다"],"a":1,"e":"6조 직계제와 호패법은 태종의 정책이며 세종은 의정부 서사제를 실시했습니다.","tip":"태종 = 6조 직계, 세종 = 서사제.","w":["이 설명은 틀린 내용입니다. 해설에서 바른 내용을 확인하세요.",""],"p":"16강 조선 전기(정치) › 태종과 세종","h":0},
{"id":"K1-186","t":"16강 조선 전기(정치)","q":"성종은 직전법을 실시하고 집현전을 폐지하였다.","c":["맞다","틀리다"],"a":1,"e":"직전법 실시와 집현전 폐지는 세조의 정책이며 성종은 홍문관 설치, 관수관급제를 했습니다.","tip":"직전법 = 세조.","w":["이 설명은 틀린 내용입니다. 해설에서 바른 내용을 확인하세요.",""],"p":"16강 조선 전기(정치) › 세조","h":0},
{"id":"K1-187","t":"17강 조선(조직)","q":"사간원은 관리의 비리를 감찰하는 기구이다.","c":["맞다","틀리다"],"a":1,"e":"관리의 비리를 감찰한 기구는 사헌부이며 사간원은 간쟁을 담당했습니다.","tip":"감찰 = 사헌부.","w":["이 설명은 틀린 내용입니다. 해설에서 바른 내용을 확인하세요.",""],"p":"17강 조선(조직) › 삼사","h":0},
{"id":"K1-188","t":"17강 조선(조직)","q":"조선의 향교는 한양에 설치된 중등 관립 교육 기관이었다.","c":["맞다","틀리다"],"a":1,"e":"한양의 중등 관학은 4부 학당이며 향교는 지방(군현)에 설치되었습니다.","tip":"향교 = 지방, 4부 학당 = 한양.","w":["이 설명은 틀린 내용입니다. 해설에서 바른 내용을 확인하세요.",""],"p":"17강 조선(조직) › 교육","h":0},
{"id":"K1-189","t":"18강 조선 전기(외교)","q":"정묘호란의 결과 조선과 후금은 군신 관계를 맺었다.","c":["맞다","틀리다"],"a":1,"e":"정묘호란(1627)은 형제 관계, 병자호란(1636)은 군신 관계를 맺었습니다.","tip":"정묘 = 형제.","w":["이 설명은 틀린 내용입니다. 해설에서 바른 내용을 확인하세요.",""],"p":"18강 조선 전기(외교) › 호란","h":0},
{"id":"K1-190","t":"18강 조선 전기(외교)","q":"비변사는 3포 왜란 때 설치된 이래 줄곧 의정부를 대신하는 국정 최고 기구였다.","c":["맞다","틀리다"],"a":1,"e":"비변사는 3포 왜란 때 임시 기구로 출발해 을묘왜변 때 상설화되었고 임진왜란 이후 최고 기구로 성장했습니다.","tip":"임란 후 최고 기구.","w":["이 설명은 틀린 내용입니다. 해설에서 바른 내용을 확인하세요.",""],"p":"18강 조선 전기(외교) › 비변사","h":0},
{"id":"K1-191","t":"19강 조선 전기(경제, 사회)","q":"과전법은 현직 관리에게만 수조권을 지급하였다.","c":["맞다","틀리다"],"a":1,"e":"과전법은 경기 지역에서 전·현직 관리에게 지급했고 현직만 지급한 것은 직전법입니다.","tip":"직전법 = 현직만.","w":["이 설명은 틀린 내용입니다. 해설에서 바른 내용을 확인하세요.",""],"p":"19강 조선 전기(경제, 사회) › 과전법","h":0},
{"id":"K1-192","t":"19강 조선 전기(경제, 사회)","q":"연분 9등법은 토지의 비옥도에 따라 세액을 달리하는 방식이다.","c":["맞다","틀리다"],"a":1,"e":"토지 비옥도에 따른 구분은 전분 6등법이며 연분 9등법은 풍흉에 따른 구분입니다.","tip":"전분 = 토지, 연분 = 풍흉.","w":["이 설명은 틀린 내용입니다. 해설에서 바른 내용을 확인하세요.",""],"p":"19강 조선 전기(경제, 사회) › 공법","h":0},
{"id":"K1-193","t":"20강 조선 전기(문화 1)","q":"이황은 기호학파를 형성하고 『성학집요』를 저술하였다.","c":["맞다","틀리다"],"a":1,"e":"『성학집요』와 기호학파는 이이이며 이황은 『성학십도』와 영남학파입니다.","tip":"이황 = 성학십도·영남.","w":["이 설명은 틀린 내용입니다. 해설에서 바른 내용을 확인하세요.",""],"p":"20강 조선 전기(문화 1) › 이황과 이이","h":0},
{"id":"K1-194","t":"20강 조선 전기(문화 1)","q":"『고려사』는 편년체로, 『고려사절요』는 기전체로 편찬되었다.","c":["맞다","틀리다"],"a":1,"e":"『고려사』는 기전체, 『고려사절요』는 편년체입니다.","tip":"고려사 = 기전체.","w":["이 설명은 틀린 내용입니다. 해설에서 바른 내용을 확인하세요.",""],"p":"20강 조선 전기(문화 1) › 역사서","h":0}],"2":[{"id":"K2-001","t":"21강 조선 전기(문화 2)","q":"다음 자료의 문자를 창제한 왕의 업적으로 옳은 것은?","c":["『동국통감』을 편찬하였다","『경국대전』을 완성하였다","홍문관을 설치하였다","「용비어천가」를 지어 훈민정음으로 간행하였다"],"a":3,"e":"세종은 1443년 훈민정음을 창제하고 1446년 반포했으며, 「용비어천가」, 「월인천강지곡」, 『동국정운』 등을 간행했습니다.","tip":"훈민정음 = 세종(1443 창제, 1446 반포).","w":["성종 때의 일입니다.","성종 때의 일입니다.","성종 때의 일입니다.",""],"p":"21강 조선 전기(문화 2) › 훈민정음","h":1,"d":"나랏말이 중국과 달라 문자와 서로 맞지 아니하므로, 어리석은 백성이 말하고자 하는 바가 있어도 그 뜻을 펴지 못하는 사람이 많다. 내가 이를 불쌍히 여겨 새로 스물여덟 자를 만드니…"},
{"id":"K2-002","t":"21강 조선 전기(문화 2)","q":"세종 때 제작된 과학 기구와 그 기능을 바르게 연결한 것은?","c":["앙부일구 - 해시계","측우기 - 시각 측정","혼천의 - 물시계","자격루 - 강우량 측정"],"a":0,"e":"앙부일구(해시계), 자격루(물시계), 측우기(강우량), 혼천의(천체 관측)가 제작되었고, 『칠정산』으로 한양 기준 역법을 정리했습니다.","tip":"앙부일구 = 해시계, 자격루 = 물시계.","w":["","측우기는 강우량을 측정합니다.","혼천의는 천체 관측 기구입니다.","자격루는 물시계이며, 강우량 측정은 측우기입니다."],"p":"21강 조선 전기(문화 2) › 과학 기술","h":1},
{"id":"K2-003","t":"21강 조선 전기(문화 2)","q":"다음 자료의 서적에 대한 설명으로 옳은 것은?","c":["『동의수세보원』","『향약집성방』","『동의보감』","『향약구급방』"],"a":1,"e":"세종 때 『향약집성방』, 『의방유취』가 편찬되었습니다.","tip":"향약집성방 = 세종.","w":["조선 후기 이제마의 사상 의학서입니다.","","광해군 때 허준이 완성했습니다.","고려 시대의 의학서입니다."],"p":"21강 조선 전기(문화 2) › 의학 서적","h":0,"d":"세종 때 간행되었으며, 우리나라 자생 약재와 치료법을 정리하였다."},
{"id":"K2-004","t":"21강 조선 전기(문화 2)","q":"조선 전기 회화에 대한 설명으로 옳은 것은?","c":["김홍도의 「씨름」은 서민 생활을 그린 풍속화이다","안견의 「몽유도원도」는 안평 대군의 꿈 이야기를 그린 산수화이다","정선의 「인왕제색도」는 진경산수화이다","강세황의 「영통동구도」는 서양 화법을 사용하였다"],"a":1,"e":"조선 전기 대표 화가는 안견(「몽유도원도」), 강희안(「고사관수도」), 이상좌(「송하보월도」), 신사임당(「초충도」)입니다.","tip":"전기 = 안견·강희안, 후기 = 정선·김홍도.","w":["김홍도는 조선 후기 화가입니다.","","정선은 조선 후기 화가입니다.","조선 후기의 그림입니다."],"p":"21강 조선 전기(문화 2) › 회화","h":1},
{"id":"K2-005","t":"21강 조선 전기(문화 2)","q":"조선 전기 도자기에 대한 설명으로 옳은 것은?","c":["상감 청자가 전성기를 이루었다","분청사기는 15~16세기에 유행하였고 이후 백자가 주류가 되었다","순수 청자를 시작으로 분청사기가 등장하였다","청화 백자는 조선 전기에 처음 등장해 가장 널리 사용되었다"],"a":1,"e":"분청사기는 귀얄·덤벙·박지 등 기법이 자유롭고 소박했으며, 16세기 이후 백자가 주류를 이루었습니다.","tip":"분청 → 백자.","w":["고려 시대의 모습입니다.","","분청사기는 상감 청자의 전통을 이은 것입니다.","청화 백자는 조선 후기에 널리 쓰였습니다."],"p":"21강 조선 전기(문화 2) › 도자기","h":0},
{"id":"K2-006","t":"21강 조선 전기(문화 2)","q":"조선 전기 건축에 대한 설명으로 옳은 것은?","c":["해인사 장경판전은 팔만대장경판을 보관하기 위해 지어졌다","화엄사 각황전은 조선 전기 건축물이다","법주사 팔상전은 조선 전기의 대표적 석탑이다","금산사 미륵전은 고려 시대 건축물이다"],"a":0,"e":"조선 전기에는 궁궐(경복궁·창덕궁), 종묘, 해인사 장경판전 등 왕실과 관청 건축이 중심이었습니다.","tip":"장경판전 = 통풍과 습도 조절(세계 유산).","w":["","조선 후기 건축물입니다.","조선 후기의 5층 목탑입니다.","조선 후기 건축물입니다."],"p":"21강 조선 전기(문화 2) › 건축","h":0},
{"id":"K2-007","t":"21강 조선 전기(문화 2)","q":"조선 성종 때 음악 이론서인 『악학궤범』이 편찬되었다.","c":["맞다","틀리다"],"a":0,"e":"성종 때 성현 등이 『악학궤범』을 편찬해 궁중 음악을 정리했습니다.","tip":"악학궤범 = 성종.","w":["","이 설명은 옳은 내용입니다. 해설을 확인하세요."],"p":"21강 조선 전기(문화 2) › 음악","h":0},
{"id":"K2-008","t":"21강 조선 전기(문화 2)","q":"『농사직설』은 중국의 농법을 소개한 농서로 성종 때 편찬되었다.","c":["맞다","틀리다"],"a":1,"e":"『농사직설』은 세종 때 정초 등이 우리 풍토에 맞는 농법을 정리한 농서입니다.","tip":"농사직설 = 세종·우리 농법.","w":["이 설명은 틀린 내용입니다. 해설에서 바른 내용을 확인하세요.",""],"p":"21강 조선 전기(문화 2) › 농서","h":0},
{"id":"K2-009","t":"21강 조선 전기(문화 2)","q":"조선 전기에는 풍수지리와 도교 행사가 완전히 사라졌다.","c":["맞다","틀리다"],"a":1,"e":"도교(소격서)와 풍수지리, 민간 신앙은 유지되었으며 소격서는 중종 때 폐지 논의가 일어났습니다.","tip":"조선 전기에도 도교·풍수 존속.","w":["이 설명은 틀린 내용입니다. 해설에서 바른 내용을 확인하세요.",""],"p":"21강 조선 전기(문화 2) › 민간 신앙","h":0},
{"id":"K2-010","t":"22강 조선 후기(정치)","q":"다음 자료의 사건 이후의 상황으로 옳은 것은?","c":["기해예송에서는 서인의 주장이 채택되었다","갑인예송에서는 서인의 주장이 채택되었다","예송은 광해군 때 일어났다","예송의 결과 북인이 집권하였다"],"a":0,"e":"기해예송(1659)은 서인의 기년설, 갑인예송(1674)은 남인의 기년설이 받아들여졌고 이후 숙종 때 환국이 이어졌습니다.","tip":"기해 = 서인 승, 갑인 = 남인 승.","w":["","갑인예송에서는 남인의 주장이 채택되었습니다.","예송은 현종 때입니다.","북인은 인조반정 이후 몰락했습니다."],"p":"22강 조선 후기(정치) › 예송","h":1,"d":"서인 송시열 등이 효종이 죽자 자의 대비의 상복을 1년으로 하자고 주장하였고, 남인 허목 등은 3년으로 하자고 주장하였다."},
{"id":"K2-011","t":"22강 조선 후기(정치)","q":"숙종 때의 정치 상황에 대한 설명으로 옳은 것은?","c":["환국은 영조가 탕평을 위해 일으켰다","갑술환국으로 남인이 집권하였다","경신환국으로 남인이 몰락하고 서인이 집권하였다","기사환국으로 서인이 집권하였다"],"a":2,"e":"경신환국(1680, 서인 집권) → 기사환국(1689, 남인 집권, 송시열 사사) → 갑술환국(1694, 서인 재집권, 인현왕후 복위) 순입니다.","tip":"경(서) - 기(남) - 갑(서).","w":["환국은 숙종 때 붕당 간 급격한 교체입니다.","갑술환국으로 서인이 재집권했습니다.","","기사환국은 남인이 집권한 환국입니다."],"p":"22강 조선 후기(정치) › 환국","h":1},
{"id":"K2-012","t":"22강 조선 후기(정치)","q":"영조의 정책으로 옳은 것은?","c":["장용영을 설치하고 수원 화성을 건설하였다","신해통공을 실시하여 금난전권을 폐지하였다","성균관 입구에 탕평비를 세우고 균역법을 시행하였다","규장각을 설치하여 서얼을 등용하였다"],"a":2,"e":"영조는 완론 탕평(탕평비), 균역법, 『속대전』, 신문고 부활, 청계천 준설, 서원 정리 등을 실시했습니다.","tip":"영조 = 탕평비·균역법·속대전.","w":["정조의 정책입니다.","정조의 정책입니다.","","정조의 정책입니다."],"p":"22강 조선 후기(정치) › 영조","h":1},
{"id":"K2-013","t":"22강 조선 후기(정치)","q":"정조의 정책으로 옳은 것은?","c":["청계천을 준설하였다","초계문신제를 실시하여 젊은 관료를 재교육하였다","균역법을 시행하였다","『속대전』을 편찬하였다"],"a":1,"e":"정조는 규장각, 초계문신제, 장용영, 화성 건설, 신해통공, 『대전통편』을 추진해 왕권을 강화했습니다.","tip":"정조 = 규장각·장용영·화성.","w":["영조 때입니다.","","영조 때입니다.","영조 때입니다."],"p":"22강 조선 후기(정치) › 정조","h":1},
{"id":"K2-014","t":"22강 조선 후기(정치)","q":"세도 정치 시기의 상황으로 옳은 것은?","c":["왕이 직접 6조를 통솔하는 6조 직계제가 부활하였다","비변사를 중심으로 소수 가문이 권력을 독점하였다","탕평책이 가장 강력하게 추진되었다","정치는 사림과 훈구의 대립이 중심이었다"],"a":1,"e":"순조(안동 김씨), 헌종(풍양 조씨), 철종(안동 김씨) 시기에 외척 가문이 비변사를 장악하고 매관매직·삼정의 문란이 심해졌습니다.","tip":"세도 = 외척 + 비변사.","w":["세도 정치는 왕권이 약화된 시기입니다.","","영·정조 때의 모습입니다.","16세기의 모습입니다."],"p":"22강 조선 후기(정치) › 세도 정치","h":0},
{"id":"K2-015","t":"22강 조선 후기(정치)","q":"다음 사건에 대한 설명으로 옳은 것은?","c":["진주에서 시작하여 삼남 지방으로 확산되었다","삼정이정청이 설치되었다","철종 때 일어났다","몰락 양반, 상인, 광산 노동자 등이 참여하였다"],"a":3,"e":"홍경래의 난(1811)은 평안도 차별과 세도 정치의 수탈에 대한 저항이며 5개월 만에 진압되었습니다.","tip":"홍경래 = 순조·평안도·1811.","w":["임술 농민 봉기입니다.","임술 농민 봉기의 수습책입니다.","홍경래의 난은 순조 때(1811)입니다.",""],"p":"22강 조선 후기(정치) › 홍경래의 난","h":1,"d":"서북 지역에 대한 차별에 불만을 품은 홍경래가 평안도 가산에서 봉기하여 정주성을 점령하였다."},
{"id":"K2-016","t":"22강 조선 후기(정치)","q":"임술 농민 봉기(1862)는 진주에서 시작되어 삼남 지방으로 확산되었고, 조정은 삼정이정청을 설치하였다.","c":["맞다","틀리다"],"a":0,"e":"진주 농민 봉기는 경상 우병사 백낙신의 수탈이 원인이었고, 삼정이정청은 곧 폐지되어 개혁은 실패했습니다.","tip":"임술 = 진주·삼정이정청.","w":["","이 설명은 옳은 내용입니다. 해설을 확인하세요."],"p":"22강 조선 후기(정치) › 임술 농민 봉기","h":0},
{"id":"K2-017","t":"22강 조선 후기(정치)","q":"인조 때 인조반정으로 북인이 집권하고 광해군이 폐위되었다.","c":["맞다","틀리다"],"a":1,"e":"인조반정(1623)으로 서인이 집권하고 북인은 몰락했습니다.","tip":"인조반정 = 서인 집권.","w":["이 설명은 틀린 내용입니다. 해설에서 바른 내용을 확인하세요.",""],"p":"22강 조선 후기(정치) › 인조반정","h":0},
{"id":"K2-018","t":"22강 조선 후기(정치)","q":"영조는 균역법 시행으로 군포를 1필로 줄이고, 부족한 재정은 결작·선무군관포 등으로 보충하였다.","c":["맞다","틀리다"],"a":0,"e":"균역법(1750)은 양인 농민의 군포 부담을 줄이려는 개혁입니다.","tip":"균역법 = 군포 1필.","w":["","이 설명은 옳은 내용입니다. 해설을 확인하세요."],"p":"22강 조선 후기(정치) › 균역법","h":0},
{"id":"K2-019","t":"22강 조선 후기(정치)","q":"숙종은 상평통보를 만들어 전국에서 유통하게 하였다.","c":["맞다","틀리다"],"a":0,"e":"상평통보는 1678년 숙종 때 전국 유통이 시작되었습니다.","tip":"상평통보 = 숙종.","w":["","이 설명은 옳은 내용입니다. 해설을 확인하세요."],"p":"22강 조선 후기(정치) › 숙종","h":0},
{"id":"K2-020","t":"23강 조선 후기(조직, 외교)","q":"조선 후기의 중앙군에 대한 설명으로 옳은 것은?","c":["5군영은 조선 전기의 중앙군이었다","속오군은 5군영의 중앙군이었다","금위영은 인조 때 설치되었다","훈련도감은 임진왜란 중 설치된 직업 군인 중심의 군영이다"],"a":3,"e":"훈련도감(1593), 어영청, 총융청, 수어청, 금위영(1682)으로 5군영이 완성되었습니다.","tip":"훈련도감 = 삼수병·직업 군인.","w":["5군(오위)은 조선 전기의 중앙군입니다.","속오군은 지방군입니다.","금위영은 숙종 때(1682) 설치되었습니다.",""],"p":"23강 조선 후기(조직, 외교) › 5군영","h":1},
{"id":"K2-021","t":"23강 조선 후기(조직, 외교)","q":"비변사에 대한 설명으로 옳은 것은?","c":["3사에 포함되어 간쟁을 담당하였다","임진왜란 이후 국정 전반을 총괄하는 최고 기구로 성장하였다","왕명 출납을 담당하였다","흥선 대원군 때 기능이 확대되었다"],"a":1,"e":"비변사는 임란 후 의정부와 6조의 기능을 약화시켰고 세도 정치의 권력 기반이 되었습니다.","tip":"비변사 = 임란 후 확대·흥선 대원군이 폐지.","w":["삼사는 사헌부·사간원·홍문관입니다.","","승정원의 기능입니다.","흥선 대원군 때 축소·폐지되었습니다."],"p":"23강 조선 후기(조직, 외교) › 비변사","h":0},
{"id":"K2-022","t":"23강 조선 후기(조직, 외교)","q":"조선 후기 북벌 운동에 대한 설명으로 옳은 것은?","c":["효종은 송시열 등과 함께 북벌을 준비하며 어영청을 강화하였다","광해군은 북벌을 추진하였다","북벌 운동은 청의 요청으로 시작되었다","숙종 때 북벌이 실제 군사 행동으로 이어졌다"],"a":0,"e":"효종은 북벌을 준비했으나 현실적으로 실행되지 못했고 정권 안정을 위한 명분 구실도 컸습니다.","tip":"북벌 = 효종·송시열·어영청.","w":["","광해군은 중립 외교를 폈습니다.","병자호란의 패배에 대한 복수심에서 비롯되었습니다.","북벌은 실제 정벌로 이어지지 못했습니다."],"p":"23강 조선 후기(조직, 외교) › 북벌","h":1},
{"id":"K2-023","t":"23강 조선 후기(조직, 외교)","q":"조선 후기 일본과의 관계에 대한 설명으로 옳은 것은?","c":["통신사는 한성에서 오사카까지만 이동하였다","임진왜란 직후 곧바로 국교가 완전히 단절되어 교류가 없었다","통신사는 에도 막부 쇼군 취임 등을 축하하기 위해 파견되어 선진 문물을 전하였다","일본은 조선에 사절을 보낼 수 없었다"],"a":2,"e":"기유약조(1609) 이후 12차례 통신사가 파견되었고 부산 왜관에서 교역이 이루어졌습니다.","tip":"기유약조 → 통신사 12회.","w":["통신사는 에도까지 갔습니다.","기유약조(1609)로 국교가 재개되었습니다.","","일본은 부산 왜관을 통해 교류했습니다."],"p":"23강 조선 후기(조직, 외교) › 대일 관계","h":0},
{"id":"K2-024","t":"23강 조선 후기(조직, 외교)","q":"다음 사건을 일어난 순서대로 바르게 나열한 것은?","c":["(다) - (가) - (나)","(가) - (나) - (다)","(나) - (다) - (가)","(다) - (나) - (가)"],"a":3,"e":"나선 정벌(효종, 1654·1658) → 안용복(숙종, 1693·1696) → 백두산 정계비(숙종, 1712) 순입니다.","tip":"효종 → 숙종(안용복) → 숙종(정계비).","w":["안용복의 활동이 정계비 건립(1712)보다 먼저입니다.","나선 정벌(1654, 1658)이 가장 먼저입니다.","나선 정벌이 안용복의 활동(1693, 1696)보다 먼저입니다.",""],"p":"23강 조선 후기(조직, 외교) › 조선 후기 대외 관계","h":1,"d":"(가) 백두산 정계비 건립 (나) 안용복의 활동 (다) 나선 정벌"},
