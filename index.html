{"id":"K2-025","t":"23강 조선 후기(조직, 외교)","q":"숙종 때 세운 백두산 정계비의 ‘토문강’ 해석 차이는 19세기 간도 귀속 분쟁의 배경이 되었다.","c":["맞다","틀리다"],"a":0,"e":"조선은 토문강을 송화강 지류로, 청은 두만강으로 해석해 분쟁이 벌어졌습니다.","tip":"토문강 해석 → 간도 분쟁.","w":["","이 설명은 옳은 내용입니다. 해설을 확인하세요."],"p":"23강 조선 후기(조직, 외교) › 간도","h":0},
{"id":"K2-026","t":"23강 조선 후기(조직, 외교)","q":"조선 후기 속오군은 양반만으로 구성된 정예 지방군이었다.","c":["맞다","틀리다"],"a":1,"e":"속오군은 양반부터 노비까지 편제한 지방군으로 점차 신분 구분 없는 군역 부담의 수단이 되었습니다.","tip":"속오군 = 양반~노비 편성.","w":["이 설명은 틀린 내용입니다. 해설에서 바른 내용을 확인하세요.",""],"p":"23강 조선 후기(조직, 외교) › 속오군","h":0},
{"id":"K2-027","t":"23강 조선 후기(조직, 외교)","q":"청에 인질로 끌려간 소현 세자는 서양 문물을 접하고 돌아왔다.","c":["맞다","틀리다"],"a":0,"e":"소현 세자는 청에서 아담 샬 등 서양 선교사와 교류했습니다.","tip":"소현 세자 = 심양 8년·서양 문물.","w":["","이 설명은 옳은 내용입니다. 해설을 확인하세요."],"p":"23강 조선 후기(조직, 외교) › 병자호란 이후","h":0},
{"id":"K2-028","t":"24강 조선 후기(경제)","q":"다음 자료의 제도에 대한 설명으로 옳은 것은?","c":["풍흉에 관계없이 1결당 4~6두를 거두었다","공물 대신 쌀, 베, 동전 등으로 납부하게 하였고 공인이 등장하는 계기가 되었다","전분 6등법과 연분 9등법으로 운영되었다","군포를 1필로 줄이고 결작을 부과하였다"],"a":1,"e":"대동법은 광해군 때 경기도에서 시작해 숙종 때 전국으로 확대되었고, 공인(어용 상인)의 활동이 활발해졌습니다.","tip":"대동법 = 12두·선혜청·공인.","w":["영정법입니다.","","공법입니다.","균역법입니다."],"p":"24강 조선 후기(경제) › 대동법","h":1,"d":"토지 1결당 쌀 12두를 납부하게 하고, 이를 마련하기 위해 선혜청을 설치하였다."},
{"id":"K2-029","t":"24강 조선 후기(경제)","q":"영정법에 대한 설명으로 옳은 것은?","c":["광해군 때 경기도에서 처음 실시되었다","전분 6등과 연분 9등을 적용하였다","인조 때 풍흉에 관계없이 1결당 쌀 4~6두를 거두도록 하였다","영조 때 군포 부담을 줄이려 실시되었다"],"a":2,"e":"영정법(1635)은 전세를 고정한 제도이지만 각종 부가세 때문에 농민의 부담은 크게 줄지 않았습니다.","tip":"영정법 = 인조·4~6두.","w":["대동법에 해당합니다.","세종 때의 공법입니다.","","균역법에 해당합니다."],"p":"24강 조선 후기(경제) › 영정법","h":0},
{"id":"K2-030","t":"24강 조선 후기(경제)","q":"조선 후기 농업에 대한 설명으로 옳은 것은?","c":["모내기법이 확산되어 노동력이 절감되고 광작이 가능해졌다","이앙법은 15세기에 전국적으로 금지되었다","담배, 인삼 등 상품 작물 재배는 금지되었다","소작료는 수확량의 반을 내는 병작반수제가 사라졌다"],"a":0,"e":"이앙법 확산으로 광작, 상품 작물(담배·인삼·면화) 재배가 늘었고 소작료는 도조법으로 점차 정액화되었습니다.","tip":"모내기 = 광작·노동력 절감.","w":["","이앙법은 조선 후기에 널리 보급되었습니다.","상품 작물 재배가 확대되었습니다.","병작반수제는 도조법과 함께 지속되었습니다."],"p":"24강 조선 후기(경제) › 농업","h":1},
{"id":"K2-031","t":"24강 조선 후기(경제)","q":"조선 후기 상업에 대한 설명으로 옳은 것은?","c":["만상은 한강을 중심으로 선박 운송업을 하였다","경강상인은 의주를 중심으로 청과 무역하였다","송상은 전국에 송방이라는 지점을 설치하여 활동하였다","내상은 개성을 중심으로 인삼을 판매하였다"],"a":2,"e":"사상(송상·경강상인·만상·내상)이 성장했고 육의전 외에는 금난전권이 폐지(신해통공, 1791)되었습니다.","tip":"송상 = 송방, 만상 = 의주, 내상 = 동래.","w":["경강상인입니다.","의주의 만상이 대청 무역을 했습니다.","","개성은 송상의 근거지이며 내상은 동래를 중심으로 일본과 무역했습니다."],"p":"24강 조선 후기(경제) › 상업","h":1},
{"id":"K2-032","t":"24강 조선 후기(경제)","q":"조선 후기 수공업과 광업에 대한 설명으로 옳은 것은?","c":["관영 수공업이 확대되고 민영 수공업이 위축되었다","민간 광산에서는 덕대가 상인에게 자본을 받아 광산을 경영하였다","공장안에 등록된 장인만 제품을 만들 수 있었다","광산 개발은 국가가 독점하여 민간 채굴이 금지되었다"],"a":1,"e":"조선 후기에는 선대제 수공업과 잠채(몰래 채굴)가 발달하고 광산 노동자가 임금 노동자로 늘었습니다.","tip":"덕대 = 광산 경영자.","w":["민영 수공업이 확대되었습니다.","","납포장으로 바뀌며 자유로운 생산이 확대되었습니다.","설점수세제로 민간 채굴이 허용되었습니다."],"p":"24강 조선 후기(경제) › 수공업·광업","h":0},
{"id":"K2-033","t":"24강 조선 후기(경제)","q":"조선 후기 개성 상인은 인삼 재배·판매로 성장하였고 송방을 두어 전국에서 활동하였다.","c":["맞다","틀리다"],"a":0,"e":"송상은 개성을 근거지로 인삼과 대외 무역에 종사했습니다.","tip":"송상 = 개성·인삼·송방.","w":["","이 설명은 옳은 내용입니다. 해설을 확인하세요."],"p":"24강 조선 후기(경제) › 송상","h":0},
{"id":"K2-034","t":"24강 조선 후기(경제)","q":"도고는 대상인이 물건을 독점적으로 사들여 가격을 조절하며 이윤을 얻은 상업 형태이다.","c":["맞다","틀리다"],"a":0,"e":"도고는 독점 도매업으로 18~19세기에 성행했습니다.","tip":"도고 = 독점 상업.","w":["","이 설명은 옳은 내용입니다. 해설을 확인하세요."],"p":"24강 조선 후기(경제) › 도고","h":0},
{"id":"K2-035","t":"24강 조선 후기(경제)","q":"조선 후기에는 장시가 점차 줄어들어 19세기에는 전국에 100곳 미만이 되었다.","c":["맞다","틀리다"],"a":1,"e":"장시는 18세기에 전국적으로 1,000여 곳으로 늘었습니다. 보부상은 장시를 돌며 상품을 유통했습니다.","tip":"장시 = 증가.","w":["이 설명은 틀린 내용입니다. 해설에서 바른 내용을 확인하세요.",""],"p":"24강 조선 후기(경제) › 장시","h":0},
{"id":"K2-036","t":"25강 조선 후기(사회)","q":"조선 후기 신분제의 변동에 대한 설명으로 옳은 것은?","c":["족보 위조와 매매는 엄격히 금지되어 나타나지 않았다","노비는 대부분 법적으로 완전히 해방되었다","납속책과 공명첩으로 부유한 농민이 양반 신분을 얻기도 하였다","양반 수가 줄고 상민의 수가 크게 늘었다"],"a":2,"e":"조선 후기에는 양반이 늘고 상민·노비가 줄었으며 공노비는 순조 때(1801) 해방되었습니다.","tip":"공명첩·납속책 = 신분 상승.","w":["족보 위조·매매가 성행했습니다.","노비 제도는 갑오개혁(1894)에서 폐지되었습니다.","","양반 수가 증가하고 상민·노비가 감소했습니다."],"p":"25강 조선 후기(사회) › 신분제 동요","h":1},
{"id":"K2-037","t":"25강 조선 후기(사회)","q":"서얼의 관직 진출을 확대하기 위한 노력으로 옳은 것은?","c":["서얼 출신은 문과에 자유롭게 응시할 수 있었다","서얼 허통 운동은 임진왜란 이전부터 성공하였다","정조 때 규장각 검서관에 서얼 출신이 등용되었다","철종 때 신해허통으로 중인의 관직 진출이 허용되었다"],"a":2,"e":"영조·정조 때 서얼 허통 확대, 정조 때 규장각 검서관(이덕무·박제가·유득공)에 서얼 출신이 등용되었습니다.","tip":"서얼 = 검서관·신해허통.","w":["서얼은 문과 응시가 제한되었습니다.","조선 후기에 점진적으로 허통이 확대되었습니다.","","신해허통(1851)은 서얼의 관직 진출을 허용한 조치입니다."],"p":"25강 조선 후기(사회) › 서얼","h":0},
{"id":"K2-038","t":"25강 조선 후기(사회)","q":"조선 후기 중인층의 활동으로 옳은 것은?","c":["서원을 세워 성리학을 연구하였다","시사(詩社)를 조직하고 위항 문학 활동을 펼쳤다","광작을 통해 양반 지주로 성장하였다","문과 응시 자격을 얻어 고위직에 진출하였다"],"a":1,"e":"역관·의관 등 기술직 중인은 경제력을 바탕으로 위항 문학을 꽃피우고 신분 상승 운동을 펼쳤습니다.","tip":"중인 = 시사·위항 문학.","w":["양반(사림)의 활동입니다.","","부농에 대한 설명입니다.","중인은 주로 기술직·행정직에 종사했습니다."],"p":"25강 조선 후기(사회) › 중인","h":0},
{"id":"K2-039","t":"25강 조선 후기(사회)","q":"다음 자료의 종교에 대한 설명으로 옳은 것은?","c":["양반 중심의 학문으로 시작하여 서학이라 불렸다","제사를 거부하여 신유박해를 받았다","이승훈이 베이징에서 세례를 받고 돌아와 전파하였다","교조 최제우가 처형된 후 최시형이 『동경대전』과 『용담유사』를 간행하였다"],"a":3,"e":"동학은 1860년 최제우가 창시했고 ‘사람이 곧 하늘’, ‘시천주’, ‘후천개벽’을 주장하며 농민층에 확산되었습니다.","tip":"동학 = 인내천·후천개벽·최제우.","w":["천주교(서학)에 대한 설명입니다.","천주교입니다.","천주교의 전래 과정입니다.",""],"p":"25강 조선 후기(사회) › 동학","h":1,"d":"사람이 곧 하늘이라는 인내천 사상을 강조하고, 유·불·선의 장점을 합쳐 후천개벽을 주장하였다."},
{"id":"K2-040","t":"25강 조선 후기(사회)","q":"천주교 박해를 일어난 순서대로 바르게 나열한 것은?","c":["(나) - (다) - (가)","(나) - (가) - (다)","(다) - (나) - (가)","(가) - (나) - (다)"],"a":0,"e":"신해박해(1791, 진산 사건) → 신유박해(1801, 황사영 백서 사건) → 기해박해(1839) → 병오박해(1846, 김대건) → 병인박해(1866) 순입니다.","tip":"신해 → 신유 → 기해 → 병오 → 병인.","w":["","병인박해는 기해박해(1839) 이후입니다.","신유박해(1801)가 기해박해보다 먼저입니다.","병인박해(1866)가 가장 나중입니다."],"p":"25강 조선 후기(사회) › 천주교 박해","h":1,"d":"(가) 병인박해 (나) 신유박해 (다) 기해박해"},
{"id":"K2-041","t":"25강 조선 후기(사회)","q":"신유박해 때 정약종이 순교하고 정약용이 유배되었으며 황사영 백서 사건이 일어났다.","c":["맞다","틀리다"],"a":0,"e":"황사영은 베이징 주교에게 외세의 도움을 요청하는 백서를 쓰려다 발각되었습니다.","tip":"신유 = 황사영 백서.","w":["","이 설명은 옳은 내용입니다. 해설을 확인하세요."],"p":"25강 조선 후기(사회) › 신유박해","h":0},
{"id":"K2-042","t":"25강 조선 후기(사회)","q":"이승훈은 베이징에서 세례를 받아 천주교를 조선에 전하였다.","c":["맞다","틀리다"],"a":0,"e":"천주교는 17세기 서학으로 전래되고 이승훈의 세례(1784)로 신앙 공동체가 형성되었습니다.","tip":"이승훈 = 최초 세례.","w":["","이 설명은 옳은 내용입니다. 해설을 확인하세요."],"p":"25강 조선 후기(사회) › 천주교","h":0},
{"id":"K2-043","t":"25강 조선 후기(사회)","q":"조선 후기 사회에서 『정감록』 같은 예언 사상은 지배층 사이에서만 환영받았다.","c":["맞다","틀리다"],"a":1,"e":"『정감록』은 왕조 교체와 변혁을 기대하는 민중 사이에 널리 퍼졌습니다.","tip":"정감록 = 민중의 변혁 기대.","w":["이 설명은 틀린 내용입니다. 해설에서 바른 내용을 확인하세요.",""],"p":"25강 조선 후기(사회) › 예언 사상","h":0},
{"id":"K2-044","t":"25강 조선 후기(사회)","q":"조선 후기 향촌에서는 부농층이 향회를 장악하려 해 구향과 신향의 대립(향전)이 나타났다.","c":["맞다","틀리다"],"a":0,"e":"양반의 지위가 흔들리고 부농층이 성장하면서 향촌 질서가 변화했습니다.","tip":"향전 = 구향 vs 신향.","w":["","이 설명은 옳은 내용입니다. 해설을 확인하세요."],"p":"25강 조선 후기(사회) › 향촌 사회","h":0},
{"id":"K2-045","t":"26강 조선 후기(문화 1)","q":"다음 자료의 인물이 주장한 내용으로 옳은 것은?","c":["한전론을 제시하고 영업전의 매매를 금지하였다","균전론을 주장하고 신분에 따른 토지 차등 분배를 구상하였다","여전론을 주장하여 마을 단위 공동 경작을 제안하였다","상공업 진흥과 청과의 통상 확대를 주장하였다"],"a":1,"e":"유형원은 『반계수록』에서 균전론을 주장했고, 이익은 한전론, 정약용은 여전론·정전론을 제시했습니다.","tip":"유형원 = 균전론·반계수록.","w":["이익입니다.","","정약용입니다.","중상학파의 주장입니다."],"p":"26강 조선 후기(문화 1) › 유형원","h":1,"d":"토지를 농민에게 고루 나누어 주어야 한다. 농민에게 1경(頃)을 기준으로 토지를 분배하고, 점차 사대부와 관리에게도 차등을 두어 지급해야 한다. (『반계수록』)"},
{"id":"K2-046","t":"26강 조선 후기(문화 1)","q":"다음 자료의 인물에 대한 설명으로 옳은 것은?","c":["『북학의』를 저술하여 소비를 장려하였다","영업전을 지정해 매매를 금지하는 한전론을 주장하였다","『우서』를 저술하여 사농공상의 직업 평등을 주장하였다","『목민심서』를 저술하여 수령의 도리를 밝혔다"],"a":1,"e":"이익은 성호학파를 형성하여 안정복·정약용 등에게 영향을 주었으며 한전론, 6좀론을 주장했습니다.","tip":"이익 = 성호사설·한전론.","w":["박제가입니다.","","유수원입니다.","정약용입니다."],"p":"26강 조선 후기(문화 1) › 이익","h":1,"d":"『성호사설』을 저술하였으며, 나라를 좀먹는 여섯 가지 폐단(노비제, 과거제, 양반 문벌제, 사치와 미신, 승려, 게으름)을 지적하였다."},
{"id":"K2-047","t":"26강 조선 후기(문화 1)","q":"정약용에 대한 설명으로 옳은 것은?","c":["『반계수록』을 저술하였다","거중기를 설계하여 수원 화성 축조에 활용하였다","지전설을 주장하고 무한 우주론을 펼쳤다","『발해고』를 저술하여 남북국이라는 용어를 사용하였다"],"a":1,"e":"정약용은 『목민심서』, 『경세유표』, 『흠흠신서』를 저술하고 여전론·정전론을 제안했으며 『여유당전서』를 남겼습니다.","tip":"정약용 = 목민심서·거중기·여전론.","w":["유형원입니다.","","홍대용입니다.","유득공입니다."],"p":"26강 조선 후기(문화 1) › 정약용","h":1},
{"id":"K2-048","t":"26강 조선 후기(문화 1)","q":"다음 자료의 인물에 대한 설명으로 옳은 것은?","c":["『양반전』, 『허생전』 등 한문 소설로 양반 사회를 풍자하였다","『동사강목』에서 정통론을 서술하였다","『북학의』에서 소비를 우물물에 비유하였다","『의산문답』에서 지전설을 주장하였다"],"a":0,"e":"박지원은 홍대용·박제가·유득공과 함께 북학파(중상학파)로 청의 문물을 받아들여 상공업 발전을 주장했습니다.","tip":"열하일기 = 박지원.","w":["","안정복입니다.","박제가입니다.","홍대용입니다."],"p":"26강 조선 후기(문화 1) › 박지원","h":1,"d":"『열하일기』를 저술하여 청의 문물을 소개하고 수레와 선박의 이용, 화폐 유통을 주장하였다."},
{"id":"K2-049","t":"26강 조선 후기(문화 1)","q":"국학 연구와 저술을 바르게 연결한 것은?","c":["이중환 - 『연려실기술』","안정복 - 『택리지』","유득공 - 『발해고』","이긍익 - 『동사강목』"],"a":2,"e":"『동사강목』(안정복), 『연려실기술』(이긍익), 『발해고』(유득공), 『택리지』(이중환), 『해동역사』(한치윤)입니다.","tip":"발해고 = 유득공(남북국).","w":["『연려실기술』은 이긍익이 저술했습니다.","『택리지』는 이중환이 저술했습니다.","","『동사강목』은 안정복이 저술했습니다."],"p":"26강 조선 후기(문화 1) › 국학","h":0},
{"id":"K2-050","t":"26강 조선 후기(문화 1)","q":"지도와 지리서에 대한 설명으로 옳은 것은?","c":["『대동여지도』는 10리마다 표시를 한 필사본이다","정상기는 『대동여지도』를 완성하였다","김정호는 『대동여지도』를 목판으로 제작하여 대량 인쇄하였다","이중환은 『동국지리지』를 저술하였다"],"a":2,"e":"『동국지리지』(한백겸), 『택리지』(이중환), 『동국지도』(정상기, 100리 척), 『대동여지도』(김정호, 1861)입니다.","tip":"대동여지도 = 김정호·목판·10리.","w":["10리마다 표시가 있고 목판본으로 인쇄되었습니다.","정상기는 『동국지도』를 만들었습니다.","","『동국지리지』는 한백겸의 저술입니다."],"p":"26강 조선 후기(문화 1) › 지도","h":1},
{"id":"K2-051","t":"26강 조선 후기(문화 1)","q":"홍대용은 『의산문답』에서 지전설과 무한 우주론을 주장하며 중화 중심 세계관을 비판하였다.","c":["맞다","틀리다"],"a":0,"e":"홍대용은 혼천의를 제작하고 『담헌서』를 남겼습니다.","tip":"홍대용 = 의산문답·지전설.","w":["","이 설명은 옳은 내용입니다. 해설을 확인하세요."],"p":"26강 조선 후기(문화 1) › 홍대용","h":0},
{"id":"K2-052","t":"26강 조선 후기(문화 1)","q":"정제두는 양명학을 체계화하여 강화 학파를 형성하였다.","c":["맞다","틀리다"],"a":0,"e":"양명학은 지행합일을 강조하며 실천을 중시했습니다.","tip":"정제두 = 강화 학파.","w":["","이 설명은 옳은 내용입니다. 해설을 확인하세요."],"p":"26강 조선 후기(문화 1) › 양명학","h":0},
{"id":"K2-053","t":"26강 조선 후기(문화 1)","q":"박제가는 『북학의』에서 검소한 생활을 강조하며 소비를 억제하자고 주장하였다.","c":["맞다","틀리다"],"a":1,"e":"박제가는 소비가 생산을 자극한다며 소비를 장려하고 청과의 통상을 주장했습니다.","tip":"박제가 = 소비 장려.","w":["이 설명은 틀린 내용입니다. 해설에서 바른 내용을 확인하세요.",""],"p":"26강 조선 후기(문화 1) › 박제가","h":0},
{"id":"K2-054","t":"27강 조선 후기(문화 2)","q":"조선 후기 문화에 대한 설명으로 옳은 것은?","c":["민화는 궁중 화원들만 그렸다","사설시조는 양반 사대부만의 문학이었다","한글 소설은 17세기 이전에 이미 유행하였다","판소리는 신재효가 사설을 정리하였고 탈춤은 양반을 풍자하였다"],"a":3,"e":"판소리(12마당 → 6마당 정리), 탈춤, 사설시조, 한글 소설(『홍길동전』, 『춘향전』), 민화가 서민 문화로 성장했습니다.","tip":"서민 문화 = 판소리·탈춤·민화·사설시조.","w":["민화는 서민들이 그리고 즐겼습니다.","서민이 참여해 현실을 솔직하게 표현했습니다.","한글 소설은 17세기 이후 널리 보급되었습니다.",""],"p":"27강 조선 후기(문화 2) › 서민 문화","h":1},
{"id":"K2-055","t":"27강 조선 후기(문화 2)","q":"조선 후기 회화에 대한 설명으로 옳은 것은?","c":["정선은 「인왕제색도」, 「금강전도」 등 진경산수화를 그렸다","김홍도는 「몽유도원도」를 그렸다","신윤복은 「세한도」를 그려 지조를 표현하였다","안견은 「씨름」으로 서민의 생활을 묘사하였다"],"a":0,"e":"정선(진경산수화), 김홍도(서민 풍속화), 신윤복(양반·기녀 풍속화), 강세황(서양 화법의 「영통동구도」), 김정희(「세한도」), 장승업(「군마도」)입니다.","tip":"진경산수 = 정선.","w":["","안견의 작품입니다.","「세한도」는 김정희의 작품입니다.","「씨름」은 김홍도의 작품입니다."],"p":"27강 조선 후기(문화 2) › 회화","h":1},
{"id":"K2-056","t":"27강 조선 후기(문화 2)","q":"다음 설명에 해당하는 인물은?","c":["김정희","정약용","김정호","신재효"],"a":0,"e":"김정희는 『금석과안록』을 저술하고 「세한도」를 그렸으며 추사체를 창안했습니다.","tip":"추사체·북한산비 = 김정희.","w":["","실학을 집대성한 학자입니다.","『대동여지도』를 만든 지리학자입니다.","판소리 사설을 정리한 인물입니다."],"p":"27강 조선 후기(문화 2) › 김정희","h":0,"d":"청의 고증학을 바탕으로 금석학을 연구하여 북한산비가 진흥왕 순수비임을 밝혔고, 독창적인 서체인 추사체를 만들었다."},
{"id":"K2-057","t":"27강 조선 후기(문화 2)","q":"조선 후기 건축물에 대한 설명으로 옳은 것은?","c":["경주 불국사는 조선 후기에 처음 창건되었다","수원 화성은 고종 때 쌓은 성이다","법주사 팔상전은 현존하는 유일한 5층 목탑이다","해인사 장경판전은 조선 후기에 지어졌다"],"a":2,"e":"조선 후기에는 불교 건축(법주사 팔상전, 금산사 미륵전, 화엄사 각황전)과 수원 화성(정약용, 실학 반영)이 대표적입니다.","tip":"팔상전 = 5층 목탑.","w":["불국사는 통일 신라 때 창건되었습니다.","정조 때(1794~1796) 쌓았습니다.","","조선 전기(15세기)에 건립되었습니다."],"p":"27강 조선 후기(문화 2) › 건축","h":1},
{"id":"K2-058","t":"27강 조선 후기(문화 2)","q":"조선 후기 과학과 의학에 대한 설명으로 옳은 것은?","c":["허준은 『동의보감』을 저술하였고 이제마는 사상 의학을 확립하였다","김육의 건의로 태음력인 칠정산이 편찬되었다","이수광은 『농사직설』을 저술하였다","정약용은 『동의수세보원』을 저술하였다"],"a":0,"e":"『동의보감』(허준, 광해군), 『마과회통』(정약용, 홍역·종두법), 『동의수세보원』(이제마), 시헌력(효종 때 채택)입니다.","tip":"허준 = 동의보감(광해군).","w":["","김육은 시헌력 도입을 건의했습니다.","이수광은 『지봉유설』을 저술했습니다.","『동의수세보원』은 이제마의 저술입니다."],"p":"27강 조선 후기(문화 2) › 과학·의학","h":0},
{"id":"K2-059","t":"27강 조선 후기(문화 2)","q":"조선 후기에는 서양의 천문·지리·의학이 전해지면서 마테오 리치의 「곤여만국전도」 등이 소개되었다.","c":["맞다","틀리다"],"a":0,"e":"서양 지식은 사신을 통해 전해졌고 이수광의 『지봉유설』은 서양을 소개했습니다.","tip":"곤여만국전도 = 서양 세계 지도.","w":["","이 설명은 옳은 내용입니다. 해설을 확인하세요."],"p":"27강 조선 후기(문화 2) › 서양 문물","h":0},
{"id":"K2-060","t":"27강 조선 후기(문화 2)","q":"조선 후기에는 한글 소설이 쇠퇴하고 한문 소설만 유행하였다.","c":["맞다","틀리다"],"a":1,"e":"한글 소설(『홍길동전』, 『춘향전』)이 크게 유행했고 박지원 등의 한문 소설도 발달했습니다.","tip":"한글 소설 = 유행.","w":["이 설명은 틀린 내용입니다. 해설에서 바른 내용을 확인하세요.",""],"p":"27강 조선 후기(문화 2) › 문학","h":0},
{"id":"K2-061","t":"27강 조선 후기(문화 2)","q":"풍속화가 신윤복은 양반과 기녀의 생활을 감각적으로 그렸으며 대표작으로 「단오풍정」이 있다.","c":["맞다","틀리다"],"a":0,"e":"김홍도는 서민의 일상(「씨름」), 신윤복은 양반·기녀의 풍류를 주로 그렸습니다.","tip":"신윤복 = 단오풍정.","w":["","이 설명은 옳은 내용입니다. 해설을 확인하세요."],"p":"27강 조선 후기(문화 2) › 풍속화","h":0},
{"id":"K2-062","t":"28강 개항기(흥선 대원군)","q":"흥선 대원군의 정책으로 옳은 것은?","c":["비변사를 폐지하고 의정부의 기능을 회복시켰다","대동법을 실시하여 공납을 개혁하였다","규장각을 설치하여 서얼을 등용하였다","통리기무아문을 설치하여 개화 정책을 추진하였다"],"a":0,"e":"흥선 대원군은 비변사 폐지, 『대전회통』·『육전조례』 편찬, 서원 철폐, 호포제, 사창제, 경복궁 중건을 추진했습니다.","tip":"대원군 = 비변사 폐지·서원 철폐.","w":["","조선 후기 제도입니다.","정조의 정책입니다.","고종 친정 이후의 정책입니다."],"p":"28강 개항기(흥선 대원군) › 흥선 대원군","h":1},
{"id":"K2-063","t":"28강 개항기(흥선 대원군)","q":"흥선 대원군의 경제 정책으로 옳은 것은?","c":["사창제를 폐지하고 의창을 확대하였다","양반에게도 군포를 부과하는 호포제를 실시하였다","균역법을 실시하여 군포를 1필로 줄였다","영정법을 실시하여 전세를 고정하였다"],"a":1,"e":"호포제(군정), 사창제(환곡), 양전 사업(전정)으로 삼정의 문란을 개혁하려 했습니다.","tip":"호포제 = 양반도 군포.","w":["사창제를 실시해 환곡 폐단을 개선했습니다.","","영조의 정책입니다.","인조 때의 정책입니다."],"p":"28강 개항기(흥선 대원군) › 삼정 개혁","h":1},
{"id":"K2-064","t":"28강 개항기(흥선 대원군)","q":"경복궁 중건 과정에서 나타난 현상으로 옳은 것은?","c":["원납전은 양반의 자발적 기부로만 이루어졌다","당백전은 상평통보의 1/100 가치로 발행되었다","원납전 강제 징수와 당백전 발행으로 물가가 폭등하였다","경복궁 중건으로 민심이 안정되고 재정이 확충되었다"],"a":2,"e":"경복궁 중건은 왕권 강화를 위해 추진되었으나 원납전·결두전·당백전·부역으로 민중의 부담이 커졌고 최익현의 탄핵으로 이어졌습니다.","tip":"당백전 = 물가 폭등.","w":["강제 징수와 부역 동원이 병행되었습니다.","당백전은 상평통보의 100배 가치였습니다.","","민심 이반과 재정 악화를 초래했습니다."],"p":"28강 개항기(흥선 대원군) › 경복궁 중건","h":0},
{"id":"K2-065","t":"28강 개항기(흥선 대원군)","q":"다음 사건에 대한 설명으로 옳은 것은?","c":["어재연이 광성보에서 항전하였다","미군이 수자기를 약탈하였다","양헌수가 정족산성에서 프랑스군을 격퇴하였다","평양 관민이 군함을 불태워 격퇴하였다"],"a":2,"e":"병인박해(1866)를 구실로 프랑스가 강화도를 침략했고 한성근(문수산성)·양헌수(정족산성)가 격퇴했으며 프랑스는 외규장각 도서를 약탈했습니다.","tip":"병인양요 = 양헌수·정족산성·외규장각.","w":["신미양요 때입니다.","신미양요 때입니다.","","제너럴 셔먼호 사건으로, 미국 상선과 관련된 별개의 사건입니다."],"p":"28강 개항기(흥선 대원군) › 병인양요","h":1,"d":"프랑스 로즈 제독이 군대를 이끌고 강화도를 점령하였다."},
{"id":"K2-066","t":"28강 개항기(흥선 대원군)","q":"신미양요에 대한 설명으로 옳은 것은?","c":["프랑스군이 외규장각 도서를 약탈하였다","제너럴 셔먼호 사건을 계기로 1866년에 일어났다","양헌수가 정족산성에서 승리하였다","어재연이 광성보에서 항전하였고 미군이 수자기를 약탈하였다"],"a":3,"e":"제너럴 셔먼호 사건(1866)에 대한 보복으로 미국이 강화도를 공격했고(1871) 이후 척화비가 전국에 건립되었습니다.","tip":"신미양요 = 어재연·광성보·수자기.","w":["병인양요입니다.","신미양요는 1871년입니다.","병인양요입니다.",""],"p":"28강 개항기(흥선 대원군) › 신미양요","h":1},
{"id":"K2-067","t":"28강 개항기(흥선 대원군)","q":"흥선 대원군은 서원을 철폐하여 47개소만 남기고 양반의 면세·면역 특권을 줄였다.","c":["맞다","틀리다"],"a":0,"e":"서원 철폐는 유생의 반발을 불렀고 최익현 등이 대원군을 비판했습니다.","tip":"서원 철폐 = 47개소 남김.","w":["","이 설명은 옳은 내용입니다. 해설을 확인하세요."],"p":"28강 개항기(흥선 대원군) › 서원 철폐","h":0},
{"id":"K2-068","t":"28강 개항기(흥선 대원군)","q":"오페르트는 남연군의 묘를 도굴하려다 실패하였고 이를 계기로 통상 수교 거부 정책이 더욱 강화되었다.","c":["맞다","틀리다"],"a":0,"e":"오페르트 도굴 사건(1868)은 서양에 대한 반감을 키웠습니다.","tip":"오페르트 = 남연군 묘.","w":["","이 설명은 옳은 내용입니다. 해설을 확인하세요."],"p":"28강 개항기(흥선 대원군) › 오페르트 도굴 사건","h":0},
{"id":"K2-069","t":"28강 개항기(흥선 대원군)","q":"척화비는 병인양요 직후에 건립되었다.","c":["맞다","틀리다"],"a":1,"e":"척화비는 신미양요(1871) 직후 전국에 세웠습니다.","tip":"척화비 = 신미양요 후.","w":["이 설명은 틀린 내용입니다. 해설에서 바른 내용을 확인하세요.",""],"p":"28강 개항기(흥선 대원군) › 척화비","h":0},
{"id":"K2-070","t":"29강 개항기(개항~갑신정변)","q":"다음 조약에 대한 설명으로 옳은 것은?","c":["일본 상품에 대한 관세를 부과하였다","부산 외 2개 항구를 개항하고 일본인에게 영사 재판권을 인정하였다","최혜국 대우 조항이 포함되었다","청의 종주권을 명시하였다"],"a":1,"e":"강화도 조약(1876)은 운요호 사건(1875)을 구실로 체결된 불평등 조약으로 부산, 원산, 인천이 개항되었습니다.","tip":"강화도 조약 = 영사 재판권·해안 측량권.","w":["무관세 무역이었습니다.","","조미 수호 통상 조약(1882)에 포함된 조항입니다.","조·청 간의 문제는 포함되지 않았습니다."],"p":"29강 개항기(개항~갑신정변) › 강화도 조약","h":1,"d":"제1관 조선국은 자주국이며 일본국과 평등한 권리를 보유한다. 제7관 조선국 연해의 섬과 암초를 측량하여 위치와 심천을 도면으로 제작하는 것을 허가한다."},
{"id":"K2-071","t":"29강 개항기(개항~갑신정변)","q":"조미 수호 통상 조약에 대한 설명으로 옳은 것은?","c":["최혜국 대우와 거중 조정 조항이 포함되었다","관세 규정이 없어 무관세 무역이 이루어졌다","조선이 서양과 맺은 두 번째 조약이었다","청의 알선 없이 일본의 중재로 체결되었다"],"a":0,"e":"조미 수호 통상 조약(1882)은 황준헌의 『조선책략』의 영향으로 체결되었고 영사 재판권·최혜국 대우·관세 규정을 담았습니다.","tip":"조미 수호 = 서양 최초·최혜국·거중 조정.","w":["","관세 규정이 포함되었습니다.","조선이 서양과 맺은 최초의 조약입니다.","청의 알선으로 체결되었습니다."],"p":"29강 개항기(개항~갑신정변) › 조미 수호 통상 조약","h":1},
{"id":"K2-072","t":"29강 개항기(개항~갑신정변)","q":"조선이 개화 정책을 추진하며 파견한 사절단으로 옳은 것은?","c":["수신사는 영국에 파견되어 통상을 교섭하였다","조사 시찰단은 미국에 파견되었다","보빙사는 청에 파견되어 근대 무기를 배웠다","영선사는 김윤식이 이끌고 톈진에서 근대 무기 제조법을 학습하였다"],"a":3,"e":"수신사(일본, 김기수·김홍집), 조사 시찰단(일본, 1881), 영선사(청 톈진, 1881), 보빙사(미국, 1883, 민영익)입니다.","tip":"영선사 = 청·김윤식, 보빙사 = 미국·민영익.","w":["수신사는 일본에 파견되었습니다.","조사 시찰단은 일본에 파견되었습니다.","보빙사는 미국에 파견되었습니다.",""],"p":"29강 개항기(개항~갑신정변) › 사절단","h":0},
{"id":"K2-073","t":"29강 개항기(개항~갑신정변)","q":"다음 사건에 대한 설명으로 옳은 것은?","c":["청군이 개입하여 흥선 대원군을 톈진으로 압송하였다","한성 조약이 체결되어 일본의 배상금이 없었다","개화당이 정권을 장악하여 14개조 정강을 발표하였다","우정총국 개국 축하연에서 일어났다"],"a":0,"e":"임오군란(1882) 이후 제물포 조약(일본 공사관 경비병 주둔)과 조청 상민 수륙 무역 장정(청의 내정 간섭)이 체결되었습니다.","tip":"임오 = 구식 군인·제물포 조약.","w":["","제물포 조약으로 일본에 배상금을 지불했습니다.","갑신정변입니다.","갑신정변입니다."],"p":"29강 개항기(개항~갑신정변) › 임오군란","h":1,"d":"구식 군인들이 신식 군대인 별기군과의 차별 대우에 반발하여 봉기하였다."},
{"id":"K2-074","t":"29강 개항기(개항~갑신정변)","q":"갑신정변에 대한 설명으로 옳은 것은?","c":["청의 도움을 받아 성공하였다","김옥균 등 급진 개화파가 우정총국 개국 축하연을 이용해 일으켰다","거문도 사건의 원인이 되었다","온건 개화파가 주도하였다"],"a":1,"e":"갑신정변(1884)은 청에 대한 조공 폐지, 문벌 폐지, 지조법 개혁 등을 담은 14개조 정강을 발표했으나 청군 개입으로 실패했고 한성 조약(조·일), 톈진 조약(청·일)으로 마무리되었습니다.","tip":"갑신 = 우정총국·14개조·3일 천하.","w":["청군의 개입으로 3일 천하로 끝났습니다.","","거문도 사건(1885)은 영·러 대립 때문입니다.","급진 개화파가 주도했습니다."],"p":"29강 개항기(개항~갑신정변) › 갑신정변","h":1},
{"id":"K2-075","t":"29강 개항기(개항~갑신정변)","q":"다음 사건을 일어난 순서대로 바르게 나열한 것은?","c":["(다) - (나) - (가)","(나) - (가) - (다)","(가) - (다) - (나)","(다) - (가) - (나)"],"a":3,"e":"강화도 조약(1876) → 임오군란(1882) → 갑신정변(1884) → 거문도 사건(1885)입니다.","tip":"강화도 → 임오 → 갑신.","w":["임오군란(1882)이 갑신정변(1884)보다 먼저입니다.","강화도 조약 → 임오군란 → 갑신정변입니다.","강화도 조약(1876)이 가장 먼저입니다.",""],"p":"29강 개항기(개항~갑신정변) › 개항기 사건 순서","h":0,"d":"(가) 임오군란 (나) 갑신정변 (다) 강화도 조약"},
{"id":"K2-076","t":"29강 개항기(개항~갑신정변)","q":"최익현은 일본과의 개항에 반대하는 왜양일체론과 지부복궐 척화 소를 올렸다.","c":["맞다","틀리다"],"a":0,"e":"위정척사 운동은 이항로(통상 반대), 최익현(왜양일체론), 이만손(영남 만인소) 등으로 이어졌습니다.","tip":"최익현 = 왜양일체론.","w":["","이 설명은 옳은 내용입니다. 해설을 확인하세요."],"p":"29강 개항기(개항~갑신정변) › 위정척사","h":0},
{"id":"K2-077","t":"29강 개항기(개항~갑신정변)","q":"통리기무아문과 별기군은 갑신정변 이후 설치되었다.","c":["맞다","틀리다"],"a":1,"e":"통리기무아문(1880)과 별기군(1881)은 갑신정변(1884) 이전의 개화 정책입니다.","tip":"기무아문·별기군 = 임오군란 이전.","w":["이 설명은 틀린 내용입니다. 해설에서 바른 내용을 확인하세요.",""],"p":"29강 개항기(개항~갑신정변) › 개화 정책","h":0},
{"id":"K2-078","t":"29강 개항기(개항~갑신정변)","q":"영남 만인소(1881)는 이만손 등이 『조선책략』의 유포를 비판하며 올린 상소이다.","c":["맞다","틀리다"],"a":0,"e":"영남 유생들은 김홍집이 가져온 『조선책략』과 미국과의 수교를 비판했습니다.","tip":"영남 만인소 = 조선책략 비판.","w":["","이 설명은 옳은 내용입니다. 해설을 확인하세요."],"p":"29강 개항기(개항~갑신정변) › 위정척사","h":0},
{"id":"K2-079","t":"30강 개항기(동학 농민 운동~대한 제국)","q":"다음 사건에 대한 설명으로 옳은 것은?","c":["청일 전쟁이 끝난 뒤에 2차 봉기를 일으켰다","집강소를 설치하는 개혁은 실패하였다","황토현 전투에서 승리하고 전주성을 점령한 뒤 전주 화약을 체결하였다","우금치 전투에서 승리하여 서울로 진격하였다"],"a":2,"e":"동학 농민 운동(1894)은 고부 봉기 → 1차 봉기(황토현·전주성) → 전주 화약·집강소 → 2차 봉기(우금치 패배) 순으로 전개되었습니다.","tip":"전주 화약 → 집강소 → 2차 봉기.","w":["청일 전쟁 중 일본의 경복궁 점령에 반발해 2차 봉기를 했습니다.","전주 화약 이후 집강소를 설치해 폐정 개혁을 추진했습니다.","","우금치에서 일본군·관군에 패배했습니다."],"p":"30강 개항기(동학 농민 운동~대한 제국) › 동학 농민 운동","h":1,"d":"전봉준이 고부 군수 조병갑의 학정에 항의하여 농민을 이끌고 봉기하였다."},
{"id":"K2-080","t":"30강 개항기(동학 농민 운동~대한 제국)","q":"1차 갑오개혁(1894)의 내용으로 옳은 것은?","c":["군국기무처를 설치하고 과거제를 폐지하였으며 신분제를 철폐하였다","단발령을 시행하고 건양 연호를 사용하였다","홍범 14조를 반포하여 개혁의 방향을 제시하였다","지계아문을 설치해 지계를 발급하였다"],"a":0,"e":"1차 갑오개혁은 군국기무처 중심으로 과거제 폐지, 노비제·연좌제 폐지, 조혼 금지, 은 본위 화폐제 등을 추진했습니다.","tip":"1차 = 군국기무처·과거제 폐지.","w":["","을미개혁(3차)의 내용입니다.","2차 갑오개혁(1895.1)의 내용입니다.","광무개혁의 내용입니다."],"p":"30강 개항기(동학 농민 운동~대한 제국) › 갑오개혁","h":1},
{"id":"K2-081","t":"30강 개항기(동학 농민 운동~대한 제국)","q":"다음 자료에 나타난 개혁에 대한 설명으로 옳은 것은?","c":["태양력을 채택하고 단발령을 시행하였다","원수부를 설치하여 황제가 군권을 장악하였다","8아문을 7부로 바꾸고 재판소를 설치하였다","군국기무처에서 개혁을 주도하였다"],"a":2,"e":"2차 갑오개혁은 박영효·김홍집 연립 내각이 주도했고 교육 입국 조서를 발표해 근대 교육 제도의 기반을 마련했습니다.","tip":"2차 = 홍범 14조·7부·재판소.","w":["을미개혁입니다.","광무개혁입니다.","","1차 갑오개혁입니다."],"p":"30강 개항기(동학 농민 운동~대한 제국) › 2차 갑오개혁","h":1,"d":"홍범 14조: 청에 의존하는 생각을 끊고 자주독립의 기초를 확고히 세운다. 왕실 사무와 국정 사무를 분리한다."},
{"id":"K2-082","t":"30강 개항기(동학 농민 운동~대한 제국)","q":"을미사변 이후의 상황으로 옳은 것은?","c":["독립 협회가 만민 공동회를 개최하여 이후 을미사변이 일어났다","대한 제국이 선포된 후 을미사변이 발생하였다","광무개혁이 먼저 시행되고 이후 을미개혁이 시행되었다","단발령에 반발하여 을미의병이 일어났고 고종은 러시아 공사관으로 피신하였다"],"a":3,"e":"을미사변(1895.10) → 을미개혁(단발령) → 을미의병 → 아관 파천(1896.2) 순입니다.","tip":"을미사변 → 단발령 → 아관 파천.","w":["독립 협회(1896)는 을미사변(1895) 이후에 창립되었습니다.","대한 제국 선포는 1897년입니다.","을미개혁(1895)이 먼저입니다.",""],"p":"30강 개항기(동학 농민 운동~대한 제국) › 을미개혁·아관 파천","h":0},
{"id":"K2-083","t":"30강 개항기(동학 농민 운동~대한 제국)","q":"독립 협회에 대한 설명으로 옳은 것은?","c":["국채 보상 운동을 전개하였다","105인 사건으로 해체되었다","관민 공동회를 열어 헌의 6조를 결의하였다","보안회와 함께 일본의 황무지 개간권 요구를 저지하였다"],"a":2,"e":"독립 협회(1896)는 독립문 건립, 만민 공동회, 중추원 관제 개편(의회 설립 운동)을 추진했으나 황국 협회·보부상의 습격과 정부의 탄압으로 해산(1898)되었습니다.","tip":"독립 협회 = 독립문·만민 공동회·헌의 6조.","w":["대구에서 시작된 운동(1907)입니다.","신민회입니다.","","보안회의 활동입니다."],"p":"30강 개항기(동학 농민 운동~대한 제국) › 독립 협회","h":1},
{"id":"K2-084","t":"30강 개항기(동학 농민 운동~대한 제국)","q":"광무개혁에 대한 설명으로 옳은 것은?","c":["군국기무처를 중심으로 추진되었다","민권을 신장하고 입헌 군주제를 지향하였다","홍범 14조를 반포하여 시작하였다","구본신참을 원칙으로 원수부를 설치하고 지계를 발급하였다"],"a":3,"e":"대한 제국(1897)은 환구단에서 황제 즉위식을 올리고 대한국 국제(1899)를 반포했으며, 양전 사업·지계 발급, 상공업·교육 진흥을 추진했습니다.","tip":"광무 = 구본신참·원수부·지계.","w":["1차 갑오개혁입니다.","전제 황권(대한국 국제)을 강화했습니다.","2차 갑오개혁입니다.",""],"p":"30강 개항기(동학 농민 운동~대한 제국) › 광무개혁","h":1},
{"id":"K2-085","t":"30강 개항기(동학 농민 운동~대한 제국)","q":"독립신문은 한글판과 영문판을 함께 발행한 최초의 민간 신문이다.","c":["맞다","틀리다"],"a":0,"e":"독립신문(1896)은 서재필이 창간했습니다.","tip":"독립신문 = 서재필·한글+영문.","w":["","이 설명은 옳은 내용입니다. 해설을 확인하세요."],"p":"30강 개항기(동학 농민 운동~대한 제국) › 독립 협회","h":0},
{"id":"K2-086","t":"30강 개항기(동학 농민 운동~대한 제국)","q":"청일 전쟁은 동학 농민 운동의 진압을 위한 청과 일본의 군대 파병이 계기가 되었다.","c":["맞다","틀리다"],"a":0,"e":"전주 화약 뒤에도 일본군이 철수하지 않고 경복궁을 점령하며 청일 전쟁이 시작되었습니다.","tip":"파병 → 청일 전쟁.","w":["","이 설명은 옳은 내용입니다. 해설을 확인하세요."],"p":"30강 개항기(동학 농민 운동~대한 제국) › 청일 전쟁","h":0},
{"id":"K2-087","t":"30강 개항기(동학 농민 운동~대한 제국)","q":"동학 농민군의 폐정 개혁안 12개조에는 노비 문서 소각과 토지의 균등 분작 등이 포함되었다.","c":["맞다","틀리다"],"a":0,"e":"폐정 개혁안은 탐관오리·횡포한 양반 처벌, 천인 대우 개선, 무명 잡세 폐지 등을 요구했습니다.","tip":"폐정 개혁 12개조.","w":["","이 설명은 옳은 내용입니다. 해설을 확인하세요."],"p":"30강 개항기(동학 농민 운동~대한 제국) › 폐정 개혁안","h":0},
{"id":"K2-088","t":"30강 개항기(동학 농민 운동~대한 제국)","q":"을미개혁에서는 태양력을 채택하고 ‘건양’ 연호를 사용하였으며 종두법을 시행하였다.","c":["맞다","틀리다"],"a":0,"e":"3차 갑오개혁(을미개혁)에서는 태양력, 건양 연호, 우편 사무 재개, 단발령 등이 시행되었습니다.","tip":"을미개혁 = 건양·단발령.","w":["","이 설명은 옳은 내용입니다. 해설을 확인하세요."],"p":"30강 개항기(동학 농민 운동~대한 제국) › 을미개혁","h":0},
{"id":"K2-089","t":"31강 국권 피탈과 저항","q":"다음 조약에 대한 설명으로 옳은 것은?","c":["한국의 외교권을 박탈하고 통감부를 설치하였다","한국 군대를 해산하고 차관 정치를 시작하였다","한국의 사법권과 감옥 사무권을 박탈하였다","러일 전쟁 중에 체결되어 고문 정치가 시작되었다"],"a":3,"e":"한일 의정서(1904.2) → 제1차 한일 협약(1904.8, 고문 정치: 메가타·스티븐스) → 을사늑약(1905) → 한일 신협약(1907) → 기유각서(1909) → 국권 피탈(1910) 순입니다.","tip":"1차 협약 = 고문(재정 메가타).","w":["을사늑약(1905)입니다.","한일 신협약(1907)입니다.","기유각서(1909)입니다.",""],"p":"31강 국권 피탈과 저항 › 제1차 한일 협약","h":1,"d":"제1조 한국 정부는 일본 정부의 추천하는 일본인 1명을 재정 고문으로 하고 외교 고문으로 외국인 1명을 두어 외교에 관한 중요 업무는 모두 그 의견을 물어 시행할 것."},
{"id":"K2-090","t":"31강 국권 피탈과 저항","q":"을사늑약에 대한 설명으로 옳은 것은?","c":["외교권이 박탈되고 통감부가 설치되었으며 장지연이 「시일야방성대곡」을 발표하였다","일본인 재정 고문으로 메가타가 파견되었다","한국 군대가 해산되고 정미의병이 일어났다","사법권과 감옥 사무권이 일본에 넘어갔다"],"a":0,"e":"을사늑약(1905.11)은 고종의 비준 없이 강제 체결되었고 민영환 등이 자결하고 을사의병이 일어났습니다. 이토 히로부미가 초대 통감이 되었습니다.","tip":"을사 = 외교권·통감부·시일야방성대곡.","w":["","제1차 한일 협약(1904)입니다.","1907년의 일입니다.","기유각서(1909)입니다."],"p":"31강 국권 피탈과 저항 › 을사늑약","h":1},
{"id":"K2-091","t":"31강 국권 피탈과 저항","q":"다음 사건에 대한 설명으로 옳은 것은?","c":["특사들은 회의에 정식 대표로 참석하였다","이 사건은 신민회가 주도하였다","이 사건 이후 을사늑약이 체결되었다","이 사건을 구실로 일제는 고종을 강제 퇴위시켰다"],"a":3,"e":"헤이그 특사(1907.6)는 제2회 만국 평화 회의에서 참가를 거부당했고 일제는 고종을 퇴위시키고 한일 신협약(정미 7조약)을 체결했습니다.","tip":"헤이그 → 고종 퇴위 → 신협약.","w":["참석을 거부당했습니다.","고종이 비밀리에 추진했습니다.","특사 파견(1907)은 을사늑약(1905) 이후입니다.",""],"p":"31강 국권 피탈과 저항 › 헤이그 특사 파견","h":1,"d":"고종이 이상설, 이준, 이위종을 네덜란드 헤이그에 특사로 파견하여 을사늑약의 부당함을 알리고자 하였다."},
{"id":"K2-092","t":"31강 국권 피탈과 저항","q":"정미의병에 대한 설명으로 옳은 것은?","c":["단발령에 반발하여 유생 중심으로 일어났다","신돌석이 평민 의병장으로 활약하였다","최익현이 태인에서 의병을 일으켰다","해산된 군인이 합류하여 의병 전쟁으로 확대되었고 13도 창의군이 서울 진공 작전을 펼쳤다"],"a":3,"e":"정미의병(1907)은 군대 해산 후 해산 군인이 가담해 전투력이 강화되었고 이인영(총대장)·허위(군사장) 중심의 13도 창의군이 서울 진공 작전(1908)을 시도했습니다.","tip":"정미 = 군대 해산·13도 창의군.","w":["을미의병입니다.","을사의병 때의 활약입니다.","을사의병입니다.",""],"p":"31강 국권 피탈과 저항 › 정미의병","h":1},
{"id":"K2-093","t":"31강 국권 피탈과 저항","q":"신민회에 대한 설명으로 옳은 것은?","c":["비밀 결사로 공화 정체의 국민 국가 수립을 목표로 하였다","대한 제국의 입헌 군주제를 지향하였다","고종 퇴위에 반대하는 운동을 벌이다 해산되었다","일본의 황무지 개간권 요구를 저지하였다"],"a":0,"e":"신민회(1907)는 안창호·양기탁·신채호 등이 조직했고 대성 학교·오산 학교 설립, 태극 서관 운영, 신흥 강습소(서간도) 건립을 추진했으나 105인 사건(1911)으로 해체되었습니다.","tip":"신민회 = 비밀·공화정·105인 사건.","w":["","헌정 연구회 등에 대한 설명입니다.","대한 자강회에 대한 설명입니다.","보안회의 활동입니다."],"p":"31강 국권 피탈과 저항 › 신민회","h":1},
{"id":"K2-094","t":"31강 국권 피탈과 저항","q":"국채 보상 운동에 대한 설명으로 옳은 것은?","c":["대구에서 시작되어 대한매일신보 등의 후원으로 전국으로 확산되었다","일본의 요구를 수용하여 국채를 갚자는 취지였다","통감부의 지원을 받아 성공하였다","독립 협회가 중심이 되어 전개하였다"],"a":0,"e":"국채 보상 운동(1907)은 김광제·서상돈이 시작했고 남성은 금연, 여성은 패물 기부 등으로 참여했습니다.","tip":"국채 보상 = 대구·단연 운동.","w":["","일본에 진 빚을 갚아 경제적 예속을 막으려는 운동이었습니다.","통감부의 탄압과 방해로 중단되었습니다.","독립 협회는 1898년에 해산되었습니다."],"p":"31강 국권 피탈과 저항 › 국채 보상 운동","h":0},
{"id":"K2-095","t":"31강 국권 피탈과 저항","q":"안중근은 1909년 하얼빈에서 이토 히로부미를 처단하였다.","c":["맞다","틀리다"],"a":0,"e":"안중근은 1910년 뤼순 감옥에서 순국했습니다.","tip":"안중근 = 하얼빈·이토.","w":["","이 설명은 옳은 내용입니다. 해설을 확인하세요."],"p":"31강 국권 피탈과 저항 › 안중근","h":0},
{"id":"K2-096","t":"31강 국권 피탈과 저항","q":"보안회는 1904년 일본의 황무지 개간권 요구를 철회시켰다.","c":["맞다","틀리다"],"a":0,"e":"보안회(1904)는 송수만 등이 조직해 최초의 항일 대중 운동을 벌였습니다.","tip":"보안회 = 황무지 개간권 저지.","w":["","이 설명은 옳은 내용입니다. 해설을 확인하세요."],"p":"31강 국권 피탈과 저항 › 보안회","h":0},
{"id":"K2-097","t":"31강 국권 피탈과 저항","q":"한일 신협약(1907)으로 통감이 행정권을 장악하는 사법권·감옥 사무권까지 박탈하였다.","c":["맞다","틀리다"],"a":1,"e":"한일 신협약(차관 정치, 군대 해산)이 먼저이고 사법권·감옥 사무권 박탈은 기유각서(1909)입니다.","tip":"신협약 = 차관·군대 해산, 기유 = 사법·감옥.","w":["이 설명은 틀린 내용입니다. 해설에서 바른 내용을 확인하세요.",""],"p":"31강 국권 피탈과 저항 › 한일 신협약","h":0},
{"id":"K2-098","t":"32강 개항기(경제)","q":"개항기 방곡령에 대한 설명으로 옳은 것은?","c":["청 상인의 내지 진출을 막기 위해 선포되었다","일본으로의 곡물 유출로 식량이 부족해지자 지방관이 곡물 수출을 금지하였다","강화도 조약에서 방곡령 선포가 금지되었다","일본이 방곡령 선포를 환영하여 배상금을 받지 않았다"],"a":1,"e":"함경도(조병식)와 황해도에서 방곡령이 선포되었으나 일본의 항의로 철회되었고 배상금을 물었습니다.","tip":"방곡령 = 곡물 유출 금지(1889).","w":["곡물 유출 방지를 위한 조치입니다.","","조일 통상 장정(1883)에 방곡령 규정이 있었습니다.","일본의 항의로 조선이 배상금을 지불했습니다."],"p":"32강 개항기(경제) › 방곡령","h":1},
{"id":"K2-099","t":"32강 개항기(경제)","q":"개항 이후 일본 상인의 무역 방식에 대한 설명으로 옳은 것은?","c":["조선의 면직물 산업이 크게 성장하였다","관세 장벽으로 일본 상품의 수입이 크게 제한되었다","영국산 면직물을 중계하고 조선의 쌀·콩 등을 수입해 갔다","조선 상인이 일본과 직접 대규모 수출입을 하였다"],"a":2,"e":"강화도 조약 직후 일본 상인은 개항장 10리 이내에서 활동했고, 임오군란 이후 청 상인이 진출해 경쟁이 심해졌습니다.","tip":"중계 무역·쌀 유출.","w":["수입 면직물로 전통 면직업이 타격을 받았습니다.","무관세 무역이 이루어졌습니다.","","일본 상인이 개항장에서 중계 무역을 주도했습니다."],"p":"32강 개항기(경제) › 개항 후 무역","h":0},
{"id":"K2-100","t":"32강 개항기(경제)","q":"개항기 열강의 이권 침탈에 대한 설명으로 옳은 것은?","c":["영국은 경의선 부설권을 획득하였다","러시아는 경인선 부설권을 획득하였다","미국은 운산 금광 채굴권과 서울의 전차 부설권을 획득하였다","일본은 압록강 삼림 채벌권을 획득하였다"],"a":2,"e":"아관 파천 이후 열강의 이권 침탈이 심해졌습니다. 경부선(1905)·경의선(1906)은 일본이 건설했습니다.","tip":"운산 금광·전차 = 미국.","w":["프랑스가 얻었으나 일본으로 넘어갔습니다.","경인선은 미국인 모스가 부설권을 얻었으나 일본에 넘어갔습니다.","","압록강·울릉도 삼림 채벌권은 러시아가 획득했습니다."],"p":"32강 개항기(경제) › 이권 침탈","h":1},
{"id":"K2-101","t":"32강 개항기(경제)","q":"러일 전쟁 이후 일제의 경제 침탈로 옳은 것은?","c":["메가타 주도의 화폐 정리 사업으로 한국 상인들이 타격을 받았다","동양 척식 주식회사는 한국인 자본으로 설립되었다","국채 보상 운동은 일본이 후원하였다","보안회는 일본의 요구를 수용하였다"],"a":0,"e":"화폐 정리 사업(1905)은 백동화를 일본 제일 은행권으로 교환해 민족 자본을 몰락시켰고, 동양 척식 주식회사(1908)는 토지를 수탈했습니다.","tip":"화폐 정리 = 메가타.","w":["","일본이 한국의 토지를 수탈하려 설립했습니다.","통감부가 탄압했습니다.","황무지 개간권 요구를 저지했습니다."],"p":"32강 개항기(경제) › 경제 침탈","h":0},
{"id":"K2-102","t":"32강 개항기(경제)","q":"1883년 조일 통상 장정은 방곡령 시행 규정과 관세 규정을 담고 있다.","c":["맞다","틀리다"],"a":0,"e":"조일 통상 장정(개정)은 방곡령 1개월 전 통보 규정과 관세 부과를 포함했습니다.","tip":"통상 장정(1883) = 방곡령·관세.","w":["","이 설명은 옳은 내용입니다. 해설을 확인하세요."],"p":"32강 개항기(경제) › 조일 통상 장정","h":0},
{"id":"K2-103","t":"32강 개항기(경제)","q":"보부상은 개항 이후 개항장 중심의 객주와 상회사 활동으로 점차 쇠퇴하였다.","c":["맞다","틀리다"],"a":1,"e":"객주와 보부상은 개항 후에도 활동했고, 일부는 상회사를 설립하며 대응했습니다.","tip":"객주·보부상의 대응.","w":["이 설명은 틀린 내용입니다. 해설에서 바른 내용을 확인하세요.",""],"p":"32강 개항기(경제) › 상인","h":0},
{"id":"K2-104","t":"33강 개항기(문화)","q":"개항기 근대 시설에 대한 설명으로 옳은 것은?","c":["광혜원은 최초의 사립 의료 기관이다","경부선은 1899년에 최초로 개통된 철도이다","우정총국은 갑신정변으로 중단되지 않고 계속 운영되었다","전차는 1899년 서대문과 청량리 사이에 처음 운행되었다"],"a":3,"e":"경인선(1899), 전차(1899), 전신(1885), 전화(1898), 전등(1887, 경복궁), 광혜원(1885)입니다.","tip":"전차 = 1899·서대문~청량리.","w":["광혜원은 최초의 서양식 국립 병원(1885)입니다.","경인선이 최초(1899)입니다.","갑신정변으로 중단되었다가 1895년 재개되었습니다.",""],"p":"33강 개항기(문화) › 근대 시설","h":1},
{"id":"K2-105","t":"33강 개항기(문화)","q":"개항기 근대 교육 기관에 대한 설명으로 옳은 것은?","c":["원산 학사는 덕원 주민이 설립한 최초의 근대적 사립 학교이다","배재 학당은 조선 정부가 세운 근대 학교였다","이화 학당은 남성을 위한 최초의 근대 학교였다","육영 공원은 선교사가 세운 사립 학교였다"],"a":0,"e":"원산 학사(1883) → 육영 공원(1886, 관립) → 배재 학당·이화 학당(선교사 사립)이 설립되었고, 교육 입국 조서(1895) 이후 근대 학제가 정비되었습니다.","tip":"원산 학사 = 최초.","w":["","배재 학당은 아펜젤러가 세운 사립 학교입니다.","스크랜튼이 세운 여성 교육 기관입니다.","정부가 세운 관립 학교입니다."],"p":"33강 개항기(문화) › 근대 교육","h":1},
{"id":"K2-106","t":"33강 개항기(문화)","q":"개항기 신문에 대한 설명으로 옳은 것은?","c":["독립신문은 국한문 혼용으로 발행되었다","제국신문은 양반 지식층을 대상으로 국한문으로 발행되었다","한성순보는 순한문으로 발행된 최초의 근대 신문이다","대한매일신보는 통감부의 사전 검열을 철저히 받았다"],"a":2,"e":"한성순보(1883, 순한문) → 한성주보(1886, 국한문) → 독립신문(1896) → 황성신문·제국신문(1898) → 대한매일신보(1904)입니다.","tip":"한성순보 = 순한문·관보.","w":["순한글(과 영문)로 발행되었습니다.","제국신문은 순한글로 서민층·부녀자를 대상으로 했습니다.","","영국인 베델 명의로 발행되어 통감부 검열을 비교적 피했습니다."],"p":"33강 개항기(문화) › 언론","h":1},
{"id":"K2-107","t":"33강 개항기(문화)","q":"개항기 종교와 사상에 대한 설명으로 옳은 것은?","c":["대종교는 나철이 창시하였고 만주에서 항일 무장 투쟁에 참여하였다","천도교는 박은식이 창시하였다","개신교는 의료·교육 사업에는 참여하지 않았다","박은식은 『유교구신론』에서 양명학을 배척하고 성리학 전통을 고수하자고 주장하였다"],"a":0,"e":"대종교(나철, 단군 숭배, 중광단·북로 군정서), 천도교(손병희, 『만세보』), 개신교(학교·병원), 불교(한용운)입니다.","tip":"대종교 = 나철·단군.","w":["","동학이 손병희에 의해 천도교로 개칭되었습니다.","병원·학교 설립에 적극적이었습니다.","박은식은 양명학을 바탕으로 한 유교 개혁을 주장했습니다."],"p":"33강 개항기(문화) › 종교","h":0},
{"id":"K2-108","t":"33강 개항기(문화)","q":"개항기 국학과 역사 연구에 대한 설명으로 옳은 것은?","c":["신채호는 『독사신론』에서 민족주의 관점으로 한국사를 서술하였다","주시경은 『서유견문』을 저술하였다","박은식은 『조선상고사』에서 낭가 사상을 강조하였다","이중환은 『택리지』를 저술하여 민족주의 사학을 확립하였다"],"a":0,"e":"신채호(『독사신론』, 『을지문덕전』), 박은식(『한국통사』), 주시경(『국어문법』), 유길준(『서유견문』)입니다.","tip":"독사신론 = 신채호.","w":["","『서유견문』은 유길준의 저술입니다.","『조선상고사』는 신채호의 저술입니다.","『택리지』는 조선 후기의 인문 지리서입니다."],"p":"33강 개항기(문화) › 민족주의 사학","h":1},
{"id":"K2-109","t":"33강 개항기(문화)","q":"『서유견문』은 유길준이 서양 문물을 소개한 국한문 혼용체 저술이다.","c":["맞다","틀리다"],"a":0,"e":"『서유견문』(1895)은 최초의 국한문 혼용 서양 견문록입니다.","tip":"서유견문 = 유길준.","w":["","이 설명은 옳은 내용입니다. 해설을 확인하세요."],"p":"33강 개항기(문화) › 유길준","h":0},
{"id":"K2-110","t":"33강 개항기(문화)","q":"원각사는 최초의 서양식 사립 극장으로 이인직의 「은세계」가 공연되었다.","c":["맞다","틀리다"],"a":0,"e":"원각사(1908)는 최초의 서양식 극장이며 신소설 『혈의 누』(이인직)도 이 시기에 등장했습니다.","tip":"원각사 = 최초 서양식 극장.","w":["","이 설명은 옳은 내용입니다. 해설을 확인하세요."],"p":"33강 개항기(문화) › 연극","h":0},
{"id":"K2-111","t":"33강 개항기(문화)","q":"최남선의 「해에게서 소년에게」는 신체시이며 잡지 『소년』에 실렸다.","c":["맞다","틀리다"],"a":0,"e":"신체시는 개화기 창가와 현대시 사이의 새로운 시 형식입니다.","tip":"신체시 = 최남선.","w":["","이 설명은 옳은 내용입니다. 해설을 확인하세요."],"p":"33강 개항기(문화) › 문학","h":0},
{"id":"K2-112","t":"34강 일제 강점기(식민 통치)","q":"1910년대 일제의 통치에 대한 설명으로 옳은 것은?","c":["헌병 경찰제를 실시하고 조선 태형령으로 한국인을 처벌하였다","치안 유지법을 제정해 사상을 탄압하였다","황국 신민 서사를 암송하게 하였다","보통 경찰제로 전환하고 신문 발행을 허가하였다"],"a":0,"e":"1910년대에는 헌병 경찰 제도, 즉결 처분권, 조선 태형령, 회사령(허가제), 토지 조사 사업, 제1차 조선 교육령이 추진되었습니다.","tip":"무단 = 헌병 경찰·태형령.","w":["","1925년의 일입니다.","1930년대 후반 민족 말살 통치입니다.","1920년대 문화 통치입니다."],"p":"34강 일제 강점기(식민 통치) › 무단 통치","h":1},
{"id":"K2-113","t":"34강 일제 강점기(식민 통치)","q":"다음 자료의 사업에 대한 설명으로 옳은 것은?","c":["산미 증식 계획과 함께 추진되어 쌀 생산량을 늘렸다","농촌 진흥 운동으로 소작농을 보호하였다","임시 토지 조사국이 주관하였고 많은 농민이 경작권을 상실하였다","토지 소유자가 아닌 소작농에게 토지를 분배하였다"],"a":2,"e":"토지 조사 사업(1910~1918)은 총독부가 토지 수입원을 확보하는 한편, 동양 척식 주식회사 등에 토지를 넘기는 결과를 낳았습니다.","tip":"토지 조사 = 신고주의·1910s.","w":["산미 증식 계획은 1920년대입니다.","1930년대의 농민 통제 정책입니다.","","소유권 신고제에 따른 지주권 강화였습니다."],"p":"34강 일제 강점기(식민 통치) › 토지 조사 사업","h":1,"d":"토지 소유자가 정해진 기간에 토지의 소유권을 신고하게 하고 신고되지 않은 토지는 국유지로 편입하였다."},
{"id":"K2-114","t":"34강 일제 강점기(식민 통치)","q":"1920년대 일제의 통치에 대한 설명으로 옳은 것은?","c":["지방 자치를 실질적으로 허용하였다","한국인의 신문 발행을 전면 금지하였다","보통 경찰제를 도입했으나 경찰 수는 오히려 늘렸다","헌병 경찰이 즉결 처분권을 행사하였다"],"a":2,"e":"문화 통치는 겉으로는 유화책이었으나 민족 분열을 노린 기만 정책이었고 치안 유지법(1925)으로 사상을 탄압했습니다.","tip":"문화 통치 = 기만·분열.","w":["도평의회 등은 자문 기관에 불과했습니다.","조선일보·동아일보 발행을 허가했으나 검열했습니다.","","1910년대의 모습입니다."],"p":"34강 일제 강점기(식민 통치) › 문화 통치","h":1},
{"id":"K2-115","t":"34강 일제 강점기(식민 통치)","q":"산미 증식 계획에 대한 설명으로 옳은 것은?","c":["한국인 지주의 몰락을 막기 위해 시행되었다","증산량보다 많은 쌀이 일본으로 반출되어 한국의 식량 사정이 악화되었다","1910년대에 토지 조사 사업과 함께 실시되었다","수리 조합 비용은 총독부가 모두 부담하였다"],"a":1,"e":"산미 증식 계획(1920~1934)은 일본의 쌀 부족을 해결하려는 것이었고 농민은 수리 조합비 등으로 부담이 커졌고 만주 잡곡 수입으로 식생활이 악화되었습니다.","tip":"산미 증식 = 일본으로 쌀 반출.","w":["일본의 식량 부족 해결이 목적이었습니다.","","1920~1934년에 추진되었습니다.","소작농과 지주에게 부담이 전가되었습니다."],"p":"34강 일제 강점기(식민 통치) › 산미 증식 계획","h":1},
{"id":"K2-116","t":"34강 일제 강점기(식민 통치)","q":"1930년대 후반 이후의 민족 말살 통치에 해당하는 것은?","c":["회사령을 폐지하고 관세를 철폐하였다","조선 태형령과 헌병 경찰제가 시행되었다","국가 총동원법과 창씨개명, 신사 참배가 강요되었다","산미 증식 계획이 처음 시작되었다"],"a":2,"e":"1930년대 병참 기지화 정책(남면북양), 1938년 국가 총동원법·지원병제, 1939~1940년 창씨개명, 1941년 국민학교령, 1943년 학도 지원병·1944년 징병제 등이 있었습니다.","tip":"말살 = 국가 총동원법·창씨개명·신사 참배.","w":["1920년대입니다.","1910년대입니다.","","1920년입니다."],"p":"34강 일제 강점기(식민 통치) › 민족 말살 통치","h":1},
{"id":"K2-117","t":"34강 일제 강점기(식민 통치)","q":"회사령은 1920년에 폐지되어 일본 자본의 한국 진출이 쉬워졌다.","c":["맞다","틀리다"],"a":0,"e":"회사령(1910, 허가제)이 1920년 신고제로 완화·철폐되어 일본 기업이 진출했습니다.","tip":"회사령 폐지 = 1920.","w":["","이 설명은 옳은 내용입니다. 해설을 확인하세요."],"p":"34강 일제 강점기(식민 통치) › 회사령","h":0},
{"id":"K2-118","t":"34강 일제 강점기(식민 통치)","q":"1930년대에는 북부에는 면화 재배, 남부에는 양 사육을 강요하는 남면북양 정책이 시행되었다.","c":["맞다","틀리다"],"a":1,"e":"남면북양은 남부에서 면화, 북부에서 양을 기르게 한 정책입니다.","tip":"남면북양 = 남쪽 면, 북쪽 양.","w":["이 설명은 틀린 내용입니다. 해설에서 바른 내용을 확인하세요.",""],"p":"34강 일제 강점기(식민 통치) › 남면북양","h":0},
{"id":"K2-119","t":"34강 일제 강점기(식민 통치)","q":"일제는 1938년 지원병제를 실시하고 1944년부터 징병제를 적용하였다.","c":["맞다","틀리다"],"a":0,"e":"국민 징용령(1939), 여자 정신 근로령(1944), 학도 지원병제(1943)도 시행되었습니다.","tip":"지원병(1938) → 징병(1944).","w":["","이 설명은 옳은 내용입니다. 해설을 확인하세요."],"p":"34강 일제 강점기(식민 통치) › 인적 수탈","h":0},
{"id":"K2-120","t":"34강 일제 강점기(식민 통치)","q":"제1차 조선 교육령(1911)은 한국인에게 고등 교육을 확대하는 것이 목적이었다.","c":["맞다","틀리다"],"a":1,"e":"1차 조선 교육령은 보통 학교 4년제, 실업 교육 위주의 우민화 정책이었습니다.","tip":"1차 교육령 = 우민화.","w":["이 설명은 틀린 내용입니다. 해설에서 바른 내용을 확인하세요.",""],"p":"34강 일제 강점기(식민 통치) › 조선 교육령","h":0},
{"id":"K2-121","t":"35강 일제 강점기(1910년대 저항)","q":"다음 단체에 대한 설명으로 옳은 것은?","c":["신민회 간부가 해외에 건설한 독립군 기지이다","풍기 광복단 등을 통합하여 조직되었으며 김좌진이 가담하였다","고종의 밀지를 받아 복벽주의를 내세웠다","평양 숭의 여학교 교사·학생이 조직한 비밀 결사이다"],"a":1,"e":"대한 광복회(1915)는 공화 정체 수립을 목표로 하여, 복벽주의를 추구한 독립 의군부(임병찬)와 구별됩니다.","tip":"광복회 = 박상진·공화정, 의군부 = 임병찬·복벽.","w":["신흥 강습소 등에 대한 설명입니다.","","독립 의군부입니다.","송죽회입니다."],"p":"35강 일제 강점기(1910년대 저항) › 대한 광복회","h":1,"d":"1915년 대구에서 박상진 등이 결성하여 친일파를 처단하고 군자금을 모금하였으며 공화정을 목표로 하였다."},
{"id":"K2-122","t":"35강 일제 강점기(1910년대 저항)","q":"서간도 삼원보에 대한 설명으로 옳은 것은?","c":["대조선 국민군단이 창설되었다","서전서숙과 명동 학교가 설립되었다","권업회와 대한 광복군 정부가 세워졌다","이회영 형제와 이상룡 등이 경학사를 조직하고 신흥 강습소를 세웠다"],"a":3,"e":"서간도에는 경학사(1911) → 부민단(1912) → 한족회(1919)와 신흥 강습소(→ 신흥 무관 학교)가 있었습니다.","tip":"서간도 = 삼원보·신흥 강습소.","w":["하와이 박용만의 군단입니다.","북간도(용정, 명동촌)의 학교입니다.","연해주의 단체입니다.",""],"p":"35강 일제 강점기(1910년대 저항) › 서간도","h":1},
{"id":"K2-123","t":"35강 일제 강점기(1910년대 저항)","q":"북간도의 독립운동 기지에 대한 설명으로 옳은 것은?","c":["이회영 형제가 신흥 무관 학교를 세웠다","안창호가 흥사단을 조직하였다","이동휘가 권업회를 조직하였다","이상설이 용정에 서전서숙을 세웠고 김약연이 명동 학교를 세웠다"],"a":3,"e":"북간도에는 서전서숙(1906), 명동 학교(1908), 간민회(1913), 중광단(1911) 등이 활동했습니다.","tip":"북간도 = 서전서숙·명동 학교.","w":["서간도의 활동입니다.","미주 지역의 활동입니다.","연해주의 활동입니다.",""],"p":"35강 일제 강점기(1910년대 저항) › 북간도","h":0},
{"id":"K2-124","t":"35강 일제 강점기(1910년대 저항)","q":"연해주 지역의 독립운동에 대한 설명으로 옳은 것은?","c":["신한 청년당이 파리 강화 회의에 대표를 파견하였다","흥사단을 조직해 무실역행을 강조하였다","신흥 강습소를 설립하였다","권업회가 조직되어 『권업신문』을 발행하였고 대한 광복군 정부가 수립되었다"],"a":3,"e":"연해주에는 신한촌이 건설되었고 성명회(1910), 권업회(1911), 대한 광복군 정부(1914)가 활동했습니다.","tip":"연해주 = 권업회·대한 광복군 정부.","w":["상하이에서 결성된 단체입니다.","미주 지역(안창호)입니다.","서간도입니다.",""],"p":"35강 일제 강점기(1910년대 저항) › 연해주","h":1},
{"id":"K2-125","t":"35강 일제 강점기(1910년대 저항)","q":"1910년대 미주 지역의 독립운동 단체와 활동을 바르게 연결한 것은?","c":["신한 청년당 - 하와이에서 이승만이 조직","흥사단 - 박용만이 군사 학교를 설립","대조선 국민군단 - 안창호가 흥사단과 함께 조직","대한인 국민회 - 샌프란시스코에서 안창호 등이 결성"],"a":3,"e":"대한인 국민회(1910, 샌프란시스코), 흥사단(1913), 대조선 국민군단(1914, 박용만, 하와이)입니다.","tip":"흥사단 = 안창호, 국민군단 = 박용만.","w":["신한 청년당은 상하이에서 여운형·김규식 등이 조직했습니다.","흥사단(1913)은 안창호가 조직한 인격 수양 단체입니다.","대조선 국민군단은 박용만이 하와이에서 조직했습니다.",""],"p":"35강 일제 강점기(1910년대 저항) › 미주","h":0},
{"id":"K2-126","t":"35강 일제 강점기(1910년대 저항)","q":"105인 사건(1911)은 신민회를 탄압하기 위해 일제가 날조한 사건이다.","c":["맞다","틀리다"],"a":0,"e":"105인 사건으로 신민회 간부들이 체포되어 조직이 해체되었습니다.","tip":"105인 사건 = 신민회 해체.","w":["","이 설명은 옳은 내용입니다. 해설을 확인하세요."],"p":"35강 일제 강점기(1910년대 저항) › 105인 사건","h":0},
{"id":"K2-127","t":"35강 일제 강점기(1910년대 저항)","q":"독립 의군부는 임병찬이 조직한 단체로 고종의 밀지를 받아 복벽주의를 내세웠다.","c":["맞다","틀리다"],"a":0,"e":"독립 의군부(1912)는 의병 전쟁 계열 인물들이 조직했습니다.","tip":"의군부 = 임병찬·복벽.","w":["","이 설명은 옳은 내용입니다. 해설을 확인하세요."],"p":"35강 일제 강점기(1910년대 저항) › 독립 의군부","h":0},
{"id":"K2-128","t":"35강 일제 강점기(1910년대 저항)","q":"2·8 독립 선언(1919)은 도쿄 유학생들이 발표해 3·1 운동에 영향을 주었다.","c":["맞다","틀리다"],"a":0,"e":"2·8 독립 선언은 도쿄 조선 기독교 청년회관에서 발표되었습니다.","tip":"2·8 = 도쿄 유학생.","w":["","이 설명은 옳은 내용입니다. 해설을 확인하세요."],"p":"35강 일제 강점기(1910년대 저항) › 2·8 독립 선언","h":0},
{"id":"K2-129","t":"36강 일제 강점기(1920년대 저항)","q":"3·1 운동에 대한 설명으로 옳은 것은?","c":["6·10 만세 운동에 이어 일어났다","민족 대표 33인이 태화관에서 독립 선언서를 낭독하였고 이후 대한민국 임시 정부 수립으로 이어졌다","무장 봉기 중심으로 전개되었다","신간회의 후원으로 전개되었다"],"a":1,"e":"3·1 운동(1919)은 윌슨의 민족 자결주의, 2·8 독립 선언, 고종의 사망 등이 배경이며 중국의 5·4 운동 등에 영향을 주었고 일제는 문화 통치로 전환했습니다.","tip":"3·1 = 비폭력·임시 정부 수립.","w":["6·10 만세 운동(1926)은 3·1 운동 이후입니다.","","비폭력 시위로 시작되었습니다.","신간회는 1927년에 조직되었습니다."],"p":"36강 일제 강점기(1920년대 저항) › 3·1 운동","h":1},
{"id":"K2-130","t":"36강 일제 강점기(1920년대 저항)","q":"대한민국 임시 정부에 대한 설명으로 옳은 것은?","c":["한국 광복군을 처음 창설한 때가 1920년이다","연통제와 교통국을 운영하고 구미 위원부를 설치하였다","1919년 충칭에서 수립되었다","공화제가 아닌 입헌 군주제를 채택하였다"],"a":1,"e":"임시 정부는 한성 정부·대한 국민 의회·상하이 임정을 통합해 수립되었고 『독립신문』 발행, 사료 편찬소 운영, 파리·구미 위원부 활동을 했습니다.","tip":"임정 = 연통제·교통국·구미 위원부.","w":["한국 광복군은 1940년에 창설되었습니다.","","1919년 상하이에서 수립되었습니다.","민주 공화제를 채택했습니다."],"p":"36강 일제 강점기(1920년대 저항) › 대한민국 임시 정부","h":1},
{"id":"K2-131","t":"36강 일제 강점기(1920년대 저항)","q":"다음 전투에 대한 설명으로 옳은 것은?","c":["양세봉의 영릉가 전투이다","훈춘 사건을 구실로 일본군이 간도에 침입한 것이 배경이다","지청천이 지휘한 대전자령 전투이다","봉오동 전투 직전의 승리이다"],"a":1,"e":"봉오동 전투(1920.6, 홍범도) → 청산리 대첩(1920.10, 김좌진·홍범도) → 간도 참변 → 자유시 참변(1921)입니다.","tip":"봉오동 → 청산리 → 간도 참변 → 자유시.","w":["1932년 조선 혁명군의 전투입니다.","","1933년 한국 독립군의 전투입니다.","청산리 대첩(1920.10)은 봉오동 전투(1920.6) 이후입니다."],"p":"36강 일제 강점기(1920년대 저항) › 청산리 대첩","h":1,"d":"김좌진의 북로 군정서와 홍범도의 대한 독립군 등이 연합하여 일본군을 크게 무찔렀다."},
{"id":"K2-132","t":"36강 일제 강점기(1920년대 저항)","q":"의열단에 대한 설명으로 옳은 것은?","c":["무장 투쟁을 반대하고 외교 활동을 중시하였다","김구가 조직하여 이봉창과 윤봉길을 파견하였다","3·1 운동 직후 서울에서 조직된 비밀 결사이다","김원봉이 조직하였고 신채호가 「조선 혁명 선언」을 작성하였다"],"a":3,"e":"의열단은 김익상(조선 총독부 투탄), 김상옥(종로 경찰서), 나석주(식산 은행·동양 척식 주식회사), 김지섭(도쿄 궁성)이 활동했습니다.","tip":"의열단 = 김원봉·조선 혁명 선언.","w":["직접 행동(암살·파괴)을 중시했습니다.","한인 애국단입니다.","1919년 만주 지린에서 조직되었습니다.",""],"p":"36강 일제 강점기(1920년대 저항) › 의열단","h":1},
{"id":"K2-133","t":"36강 일제 강점기(1920년대 저항)","q":"신간회에 대한 설명으로 옳은 것은?","c":["민족주의 계열과 사회주의 계열이 연합하여 결성하였고 광주 학생 항일 운동 진상 조사단을 파견하였다","일제의 후원을 받아 자치를 주장하였다","3·1 운동 직후 결성되었다","국채 보상 운동을 주도하였다"],"a":0,"e":"신간회(1927)는 이상재가 회장을 맡았고 자매 단체로 근우회가 있었으며 1931년 해소되었습니다.","tip":"신간회 = 좌우 합작·광주 학생 운동.","w":["","비타협적 민족주의가 중심이었습니다.","1927년에 결성되었습니다.","1907년의 운동입니다."],"p":"36강 일제 강점기(1920년대 저항) › 신간회","h":1},
{"id":"K2-134","t":"36강 일제 강점기(1920년대 저항)","q":"다음 사건을 일어난 순서대로 바르게 나열한 것은?","c":["(나) - (가) - (다)","(나) - (다) - (가)","(다) - (가) - (나)","(가) - (나) - (다)"],"a":0,"e":"3·1 운동(1919) → 6·10 만세 운동(1926) → 광주 학생 항일 운동(1929)입니다.","tip":"31 → 610 → 광주(1929).","w":["","6·10 만세 운동(1926)이 광주 학생 항일 운동(1929)보다 먼저입니다.","3·1 → 6·10 → 광주 학생 순입니다.","3·1 운동(1919)이 가장 먼저입니다."],"p":"36강 일제 강점기(1920년대 저항) › 1920년대 저항","h":0,"d":"(가) 6·10 만세 운동 (나) 3·1 운동 (다) 광주 학생 항일 운동"},
{"id":"K2-135","t":"36강 일제 강점기(1920년대 저항)","q":"물산 장려 운동은 조만식 등이 주도하여 토산품 애용을 강조하였다.","c":["맞다","틀리다"],"a":0,"e":"평양에서 시작해 전국으로 확산되었으나 사회주의 계열은 자본가를 위한 운동이라고 비판했습니다.","tip":"물산 장려 = 조만식·평양.","w":["","이 설명은 옳은 내용입니다. 해설을 확인하세요."],"p":"36강 일제 강점기(1920년대 저항) › 물산 장려 운동","h":0},
{"id":"K2-136","t":"36강 일제 강점기(1920년대 저항)","q":"암태도 소작 쟁의와 원산 총파업은 1920년대의 대표적 농민·노동 운동이다.","c":["맞다","틀리다"],"a":0,"e":"암태도 소작 쟁의(1923), 원산 총파업(1929)이 있었고 형평 운동(1923)은 백정 차별 철폐를 목표로 했습니다.","tip":"암태도 = 소작, 원산 = 노동.","w":["","이 설명은 옳은 내용입니다. 해설을 확인하세요."],"p":"36강 일제 강점기(1920년대 저항) › 사회 운동","h":0},
{"id":"K2-137","t":"36강 일제 강점기(1920년대 저항)","q":"형평 운동은 천도교 소년회가 주도하여 어린이날을 제정하였다.","c":["맞다","틀리다"],"a":1,"e":"형평 운동은 진주에서 시작된 백정 차별 철폐 운동이며 어린이날은 방정환의 천도교 소년회가 제정했습니다.","tip":"형평 = 백정, 소년회 = 어린이날.","w":["이 설명은 틀린 내용입니다. 해설에서 바른 내용을 확인하세요.",""],"p":"36강 일제 강점기(1920년대 저항) › 형평 운동","h":0},
{"id":"K2-138","t":"36강 일제 강점기(1920년대 저항)","q":"국민 대표 회의(1923)에서는 창조파와 개조파의 대립으로 임시 정부 개편이 결렬되었다.","c":["맞다","틀리다"],"a":0,"e":"이후 임시 정부는 침체되었고 이승만 탄핵(1925), 국무령제로의 개헌이 이어졌습니다.","tip":"국민 대표 회의 = 창조파 vs 개조파.","w":["","이 설명은 옳은 내용입니다. 해설을 확인하세요."],"p":"36강 일제 강점기(1920년대 저항) › 국민 대표 회의","h":0},
{"id":"K2-139","t":"37강 일제 강점기(1930년대 이후 저항)","q":"한인 애국단에 대한 설명으로 옳은 것은?","c":["이봉창이 일왕 마차에 폭탄을 던졌고 윤봉길이 훙커우 공원에서 의거를 일으켰다","이상설이 조직하였다","김원봉이 조직하였고 신채호의 선언을 이념으로 하였다","만주에서 조직되어 청산리 대첩에 참여하였다"],"a":0,"e":"한인 애국단(1931, 김구)의 활동은 중국 국민당의 지원을 이끌었고 임시 정부는 이후 이동을 거쳐 충칭에 정착(1940)했습니다.","tip":"이봉창·윤봉길 = 한인 애국단.","w":["","한인 애국단은 김구가 조직했습니다.","의열단입니다.","청산리 대첩은 북로 군정서·대한 독립군 등이 참여했습니다."],"p":"37강 일제 강점기(1930년대 이후 저항) › 한인 애국단","h":1},
{"id":"K2-140","t":"37강 일제 강점기(1930년대 이후 저항)","q":"1930년대 만주 지역의 한중 연합 작전으로 옳은 것은?","c":["동북 항일 연군이 국내 진공 작전을 시도한 해가 1919년이다","조선 의용대가 청산리에서 일본군을 격퇴하였다","조선 혁명군은 영릉가·흥경성 전투에서, 한국 독립군은 쌍성보·대전자령 전투에서 중국군과 연합해 승리하였다","한국 광복군이 봉오동에서 일본군을 격퇴하였다"],"a":2,"e":"조선 혁명군(양세봉)과 한국 독립군(지청천)은 중국 의용군과 연합했고, 동북 항일 연군(김일성)은 보천보 전투(1937)를 벌였습니다.","tip":"조선 혁명군 = 양세봉, 한국 독립군 = 지청천.","w":["보천보 전투는 1937년입니다.","청산리 대첩은 1920년의 사건입니다.","","봉오동 전투는 1920년 홍범도의 대한 독립군 연합이었습니다."],"p":"37강 일제 강점기(1930년대 이후 저항) › 만주 무장 투쟁","h":1},
{"id":"K2-141","t":"37강 일제 강점기(1930년대 이후 저항)","q":"한국 광복군에 대한 설명으로 옳은 것은?","c":["1920년 간도에서 창설되었다","충칭에서 창설되었고 영국군과 연합하여 인도·미얀마 전선에 참전하였다","김구가 조직한 한인 애국단의 일부로 창설되었다","화북 조선 독립 동맹 산하의 군대였다"],"a":1,"e":"광복군은 총사령관 지청천이며, 1942년 조선 의용대 일부가 합류했고 1941년 임시 정부는 대일 선전 포고를 했습니다.","tip":"광복군 = 1940·충칭·지청천.","w":["1940년 충칭에서 창설되었습니다.","","임시 정부 직속 군대로 창설되었습니다.","조선 의용군에 대한 설명입니다."],"p":"37강 일제 강점기(1930년대 이후 저항) › 한국 광복군","h":1},
{"id":"K2-142","t":"37강 일제 강점기(1930년대 이후 저항)","q":"조선 의용대에 대한 설명으로 옳은 것은?","c":["김구가 조직한 한인 애국단의 무장 조직이다","1920년 간도에서 일본군과 대규모 전투를 벌였다","1945년 국내 진공 작전을 실행하였다","김원봉이 한커우에서 조직한 중국 관내 최초의 한인 무장 부대이다"],"a":3,"e":"조선 의용대(1938)는 일부가 화북으로 이동해 조선 의용군(1942)이 되고 일부는 한국 광복군에 합류(1942)했습니다.","tip":"조선 의용대 = 김원봉·1938.","w":["한인 애국단과 별개입니다.","조선 의용대는 1938년에 조직되었습니다.","국내 진공 작전은 일제 항복으로 실행되지 못했습니다.",""],"p":"37강 일제 강점기(1930년대 이후 저항) › 조선 의용대","h":0},
{"id":"K2-143","t":"37강 일제 강점기(1930년대 이후 저항)","q":"민족 말살 통치기 국내 문화·학술 활동으로 옳은 것은?","c":["정인보는 유물 사관에 입각해 『조선 사회 경제사』를 저술하였다","조선어 학회가 한글 맞춤법 통일안을 제정하였고 1942년 조선어 학회 사건으로 탄압받았다","박은식은 『조선상고사』에서 낭가 사상을 서술하였다","백남운은 식민 사관을 옹호하며 정체성론을 주장하였다"],"a":1,"e":"조선어 학회(맞춤법 통일안 1933, 『조선말 큰사전』 편찬), 진단 학회(1934, 실증 사학), 정인보(얼 사관), 백남운(사회 경제 사학)입니다.","tip":"조선어 학회 사건 = 1942.","w":["유물 사관의 『조선 사회 경제사』는 백남운의 저술입니다.","","『조선상고사』는 신채호의 저술입니다.","백남운은 사회 경제 사학으로 정체성론을 비판했습니다."],"p":"37강 일제 강점기(1930년대 이후 저항) › 한글·역사","h":1},
{"id":"K2-144","t":"37강 일제 강점기(1930년대 이후 저항)","q":"일제 강점기 역사학 연구와 인물을 바르게 연결한 것은?","c":["신채호 - 『한국 독립운동지혈사』","정인보 - 『조선 사회 경제사』","백남운 - 『오천 년간 조선의 얼』","박은식 - 『한국통사』"],"a":3,"e":"박은식(『한국통사』, 『한국 독립운동지혈사』, 혼 강조), 신채호(『조선상고사』), 정인보(얼 사관), 백남운(사회 경제 사학)입니다.","tip":"혼 = 박은식, 얼 = 정인보.","w":["『한국 독립운동지혈사』는 박은식의 저술입니다.","『조선 사회 경제사』는 백남운의 저술입니다.","『오천 년간 조선의 얼』은 정인보의 저술입니다.",""],"p":"37강 일제 강점기(1930년대 이후 저항) › 역사학","h":0},
{"id":"K2-145","t":"37강 일제 강점기(1930년대 이후 저항)","q":"건국 동맹은 여운형이 국내에서 조직한 비밀 결사로 해방 후 건국 준비 위원회의 기반이 되었다.","c":["맞다","틀리다"],"a":0,"e":"조선 건국 동맹(1944)은 일제 말기 국내에서 조직된 비밀 결사입니다.","tip":"건국 동맹 = 여운형.","w":["","이 설명은 옳은 내용입니다. 해설을 확인하세요."],"p":"37강 일제 강점기(1930년대 이후 저항) › 건국 동맹","h":0},
{"id":"K2-146","t":"37강 일제 강점기(1930년대 이후 저항)","q":"김원봉은 1942년 조선 의용대 일부를 이끌고 한국 광복군에 합류하였다.","c":["맞다","틀리다"],"a":0,"e":"이후 1944년 임시 정부 군무부장이 되었습니다.","tip":"김원봉 = 광복군 합류.","w":["","이 설명은 옳은 내용입니다. 해설을 확인하세요."],"p":"37강 일제 강점기(1930년대 이후 저항) › 광복군","h":0},
{"id":"K2-147","t":"37강 일제 강점기(1930년대 이후 저항)","q":"카이로 선언(1943)에서는 한국의 즉각적인 독립을 약속하였다.","c":["맞다","틀리다"],"a":1,"e":"카이로 선언(1943)은 ‘적절한 절차를 거쳐’ 한국을 독립시킨다고 규정했습니다.","tip":"카이로 = 적절한 절차.","w":["이 설명은 틀린 내용입니다. 해설에서 바른 내용을 확인하세요.",""],"p":"37강 일제 강점기(1930년대 이후 저항) › 카이로 선언","h":0},
{"id":"K2-148","t":"37강 일제 강점기(1930년대 이후 저항)","q":"한국 광복군은 미국 OSS와 협력하여 국내 진공 작전을 준비하였으나 일제의 항복으로 실행되지 못했다.","c":["맞다","틀리다"],"a":0,"e":"광복군은 1945년 국내 정진대를 훈련했지만 광복으로 실행이 무산되었습니다.","tip":"국내 진공 작전 = 일제 항복으로 무산.","w":["","이 설명은 옳은 내용입니다. 해설을 확인하세요."],"p":"37강 일제 강점기(1930년대 이후 저항) › 국내 진공 작전","h":0},
{"id":"K2-149","t":"38강 현대(광복~6.25 전쟁)","q":"다음 회의에서 결정된 사항으로 옳은 것은?","c":["이 회의에서 한국의 즉각 독립이 결정되었다","이 결정으로 남북 총선거가 실시되었다","이 결정을 두고 좌우 대립이 격화되었다","이 회의에서 38도선이 처음 설정되었다"],"a":2,"e":"모스크바 3상 회의(1945.12)의 신탁 통치 결정에 우익(반탁)은 반대하고 좌익(찬탁)은 지지했으며 미소 공동 위원회는 1946·1947년 모두 결렬되었습니다.","tip":"모스크바 3상 = 신탁 통치·미소 공위.","w":["신탁 통치가 포함되었습니다.","이후 미소 공위가 결렬되었습니다.","","38도선은 광복 직후(1945.8)에 설정되었습니다."],"p":"38강 현대(광복~6.25 전쟁) › 모스크바 3국 외상 회의","h":1,"d":"미·영·소 3국 외상은 조선에 임시 민주 정부를 수립하기 위해 미소 공동 위원회를 설치하고, 최고 5년간 신탁 통치를 실시한다."},
{"id":"K2-150","t":"38강 현대(광복~6.25 전쟁)","q":"좌우 합작 운동에 대한 설명으로 옳은 것은?","c":["이승만의 정읍 발언에 동조하여 단독 정부 수립을 추진하였다","미군정과 이승만의 지지를 받아 성공하였다","여운형과 김규식이 중심이 되어 좌우 합작 7원칙을 발표하였다","김구가 남북 협상을 위해 결성하였다"],"a":2,"e":"좌우 합작 위원회(1946.7)는 토지 개혁, 친일파 처리, 입법 기구 구성 등을 담은 7원칙(1946.10)을 발표했습니다.","tip":"좌우 합작 = 여운형·김규식.","w":["이승만은 단독 정부 수립을 주장했습니다.","여운형 암살(1947) 등으로 약화되었습니다.","","남북 협상은 1948년입니다."],"p":"38강 현대(광복~6.25 전쟁) › 좌우 합작 운동","h":0},
{"id":"K2-151","t":"38강 현대(광복~6.25 전쟁)","q":"대한민국 정부 수립 과정에 대한 설명으로 옳은 것은?","c":["이승만 정부는 1947년에 수립되었다","제주 4·3 사건 이후 모든 지역에서 총선거가 정상적으로 실시되었다","남북 협상에서 단독 정부 수립이 결정되었다","5·10 총선거로 구성된 제헌 국회가 헌법을 제정하고 이승만을 초대 대통령으로 선출하였다"],"a":3,"e":"유엔 총회(1947) → 소련·북한의 입북 거부 → 남한 단독 총선거(1948.5.10) → 제헌 헌법(7.17) → 정부 수립(8.15)입니다.","tip":"5·10 선거 → 제헌 국회 → 정부 수립.","w":["1948년 8월 15일 선포되었습니다.","제주 일부 선거구는 무효가 되었습니다.","김구·김규식은 단독 정부 반대를 위해 남북 협상에 참여했습니다.",""],"p":"38강 현대(광복~6.25 전쟁) › 정부 수립","h":1},
{"id":"K2-152","t":"38강 현대(광복~6.25 전쟁)","q":"이승만 정부 초기 정책으로 옳은 것은?","c":["귀속 재산을 모두 국유로 유지하였다","농지 개혁법으로 지주가 모든 토지를 계속 유지하였다","반민족 행위 처벌법을 제정하여 반민 특위를 설치하였으나 활동이 중단되었다","좌우 합작 7원칙을 추진하였다"],"a":2,"e":"농지 개혁법(1949)은 유상 매수·유상 분배를 원칙으로 했고, 반민 특위는 1949년 6월 습격 사건 등으로 활동이 중단되었습니다.","tip":"반민 특위 = 중단, 농지 개혁 = 유상 매수·분배.","w":["귀속 재산은 민간에 불하되었습니다.","3정보 초과분을 유상 매수·유상 분배했습니다.","","좌우 합작 운동의 주장입니다."],"p":"38강 현대(광복~6.25 전쟁) › 이승만 정부","h":1},
{"id":"K2-153","t":"38강 현대(광복~6.25 전쟁)","q":"6·25 전쟁의 전개 과정을 순서대로 바르게 나열한 것은?","c":["(가) - (다) - (나)","(가) - (나) - (다)","(나) - (가) - (다)","(다) - (가) - (나)"],"a":1,"e":"북한 남침(1950.6.25) → 유엔군 파병 → 인천 상륙 작전(9.15) → 압록강 진격 → 중국군 개입(10) → 1·4 후퇴 → 휴전 회담 → 정전 협정(1953.7.27)입니다.","tip":"인천 → 중국군 → 정전.","w":["정전 협정(1953)이 가장 나중입니다.","","인천 상륙 작전(1950.9)이 중국군 개입(1950.10) 전입니다.","정전 협정이 가장 마지막입니다."],"p":"38강 현대(광복~6.25 전쟁) › 6·25 전쟁","h":1,"d":"(가) 인천 상륙 작전 (나) 중국군 개입 (다) 정전 협정 체결"},
{"id":"K2-154","t":"38강 현대(광복~6.25 전쟁)","q":"정전 협정 이후의 상황으로 옳은 것은?","c":["거제도 포로 수용소는 정전 협정 이후에 처음 설치되었다","북진 통일론이 포기되고 평화 통일론이 채택되었다","이승만 정부는 정전 협정에 서명하였다","한·미 상호 방위 조약이 체결되어 한미 동맹의 기반이 마련되었다"],"a":3,"e":"정전 협정(1953.7)에는 유엔군·북한군·중국군이 서명했고, 한·미 상호 방위 조약은 1953년 10월에 체결되었습니다.","tip":"정전 = 군사 분계선, 한미 상호 방위 조약.","w":["전쟁 중에 설치되었습니다.","이승만 정부는 북진 통일론을 유지했습니다.","한국은 정전 협정에 서명하지 않았습니다.",""],"p":"38강 현대(광복~6.25 전쟁) › 전후 상황","h":0},
{"id":"K2-155","t":"38강 현대(광복~6.25 전쟁)","q":"이승만은 1946년 정읍에서 남한 단독 정부 수립을 주장하였다.","c":["맞다","틀리다"],"a":0,"e":"정읍 발언(1946.6)은 미소 공위 결렬 이후 나왔습니다.","tip":"정읍 발언 = 단독 정부 주장.","w":["","이 설명은 옳은 내용입니다. 해설을 확인하세요."],"p":"38강 현대(광복~6.25 전쟁) › 정읍 발언","h":0},
{"id":"K2-156","t":"38강 현대(광복~6.25 전쟁)","q":"김구와 김규식은 1948년 남북 협상에 참석하여 단독 정부 수립에 찬성하였다.","c":["맞다","틀리다"],"a":1,"e":"김구·김규식은 평양의 남북 지도자 협의회에 참석해 단독 정부 수립에 반대했으나 큰 성과를 거두지 못했습니다.","tip":"남북 협상 = 단독 정부 반대.","w":["이 설명은 틀린 내용입니다. 해설에서 바른 내용을 확인하세요.",""],"p":"38강 현대(광복~6.25 전쟁) › 남북 협상","h":0},
{"id":"K2-157","t":"38강 현대(광복~6.25 전쟁)","q":"제주 4·3 사건은 남한 단독 선거에 반대하여 시작된 무장 봉기와 진압 과정에서 많은 민간인이 희생된 사건이다.","c":["맞다","틀리다"],"a":0,"e":"제주 4·3 사건(1948)으로 일부 선거구의 5·10 선거가 무효가 되었습니다.","tip":"4·3 = 제주·단독 선거 반대.","w":["","이 설명은 옳은 내용입니다. 해설을 확인하세요."],"p":"38강 현대(광복~6.25 전쟁) › 제주 4·3","h":0},
{"id":"K2-158","t":"38강 현대(광복~6.25 전쟁)","q":"농지 개혁법에서는 지주의 농지를 무상 몰수하여 농민에게 무상 분배하였다.","c":["맞다","틀리다"],"a":1,"e":"농지 개혁법은 유상 매수·유상 분배 방식이었고 농민은 지가 증권에 따라 상환했습니다.","tip":"농지 개혁 = 유상 매수·유상 분배.","w":["이 설명은 틀린 내용입니다. 해설에서 바른 내용을 확인하세요.",""],"p":"38강 현대(광복~6.25 전쟁) › 농지 개혁","h":0},
{"id":"K2-159","t":"39강 현대(민주주의의 발전)","q":"다음 사건 이후의 상황으로 옳은 것은?","c":["발췌 개헌으로 대통령 직선제가 도입되었다","4·19 혁명 이후 사사오입 개헌이 이루어졌다","10월 유신 직후에 이루어졌다","진보당 사건과 2·4 파동을 거쳐 3·15 부정 선거가 일어났다"],"a":3,"e":"발췌 개헌(1952) → 사사오입 개헌(1954) → 진보당 사건(1958) → 2·4 파동(1958) → 3·15 부정 선거(1960) → 4·19 혁명 순입니다.","tip":"발췌(1952) → 사사오입(1954).","w":["발췌 개헌(1952)은 사사오입 개헌(1954) 이전의 일입니다.","사사오입 개헌(1954)이 먼저입니다.","1954년의 일입니다.",""],"p":"39강 현대(민주주의의 발전) › 사사오입 개헌","h":1,"d":"자유당 정부는 사사오입의 논리를 내세워 초대 대통령의 중임 제한 철폐를 골자로 한 개헌안을 통과시켰다."},
{"id":"K2-160","t":"39강 현대(민주주의의 발전)","q":"4·19 혁명에 대한 설명으로 옳은 것은?","c":["박정희 정부의 3선 개헌에 반대하여 일어났다","신군부의 비상 계엄 확대에 맞서 일어났다","3·15 부정 선거에 반발하여 일어났으며 이승만이 하야하고 내각 책임제 개헌이 이루어졌다","부마 항쟁으로 시작되었다"],"a":2,"e":"4·19 혁명(1960)은 마산 시위(김주열 사건), 대학 교수단 시국 선언을 거쳐 이승만의 하야로 이어졌고 이후 허정 과도 정부를 거쳐 장면 내각이 수립되었습니다.","tip":"4·19 = 3·15 부정 선거 → 하야.","w":["3선 개헌은 1969년입니다.","5·18 광주 민주화 운동입니다.","","부마 항쟁은 1979년입니다."],"p":"39강 현대(민주주의의 발전) › 4·19 혁명","h":1},
{"id":"K2-161","t":"39강 현대(민주주의의 발전)","q":"박정희 정부 때의 일로 옳은 것은?","c":["6·15 남북 공동 선언을 발표하였다","3선 개헌 이후 10월 유신으로 대통령 직선제를 폐지하였다","금융 실명제를 실시하였다","4·13 호헌 조치를 발표하였다"],"a":1,"e":"5·16 군사 정변(1961) → 3선 개헌(1969) → 10월 유신(1972, 통일 주체 국민 회의, 긴급 조치권) → 부마 항쟁(1979) → 10·26 사태입니다.","tip":"박정희 = 유신·긴급 조치.","w":["김대중 정부 때입니다.","","김영삼 정부 때입니다.","전두환 정부 때입니다."],"p":"39강 현대(민주주의의 발전) › 박정희 정부","h":1},
{"id":"K2-162","t":"39강 현대(민주주의의 발전)","q":"5·18 민주화 운동에 대한 설명으로 옳은 것은?","c":["박정희 정부의 유신 체제 종식을 가져왔다","신군부의 비상 계엄 확대에 맞선 시민들이 시민군을 조직하였다","4·13 호헌 조치에 반발하여 시작되었다","대통령 직선제 개헌을 이끌어 냈다"],"a":1,"e":"5·18(1980)은 12·12 사태로 권력을 잡은 신군부의 비상 계엄 확대에 저항해 광주에서 전개되었으며 2011년 유네스코 세계 기록 유산에 등재되었습니다.","tip":"5·18 = 광주·시민군·신군부.","w":["유신 체제는 10·26 사태로 끝났습니다.","","1987년의 사건입니다.","1987년 6월 민주 항쟁의 결과입니다."],"p":"39강 현대(민주주의의 발전) › 5·18 민주화 운동","h":1},
{"id":"K2-163","t":"39강 현대(민주주의의 발전)","q":"다음 자료의 민주화 운동에 대한 설명으로 옳은 것은?","c":["10월 유신 철폐를 요구하였다","6·29 민주화 선언으로 대통령 직선제 개헌이 약속되었다","광주에서 시작되어 신군부의 퇴진을 요구하였다","3·15 부정 선거를 규탄하였다"],"a":1,"e":"6월 민주 항쟁(1987)의 결과 5년 단임 직선제 개헌(9차)이 이루어졌고 노태우가 당선되었습니다.","tip":"6월 항쟁 = 6·29 선언·직선제.","w":["1970년대의 운동입니다.","","5·18입니다.","4·19 혁명입니다."],"p":"39강 현대(민주주의의 발전) › 6월 민주 항쟁","h":1,"d":"박종철 고문 치사 사건과 4·13 호헌 조치에 반발하여 전국에서 시위가 일어났고, 이한열 사망 사건이 겹쳐 국민 대회가 열렸다."},
{"id":"K2-164","t":"39강 현대(민주주의의 발전)","q":"김영삼 정부의 정책으로 옳은 것은?","c":["전두환·노태우를 구속하지 않았다","남북한 유엔 동시 가입을 이루었다","6·15 남북 공동 선언을 발표하였다","금융 실명제를 실시하고 지방 자치제를 전면 실시하였다"],"a":3,"e":"김영삼 정부(1993)는 문민 정부로 금융 실명제(1993), 하나회 해체, 지방 자치제 전면 실시(1995) 등을 추진했으나 외환 위기(1997)로 IMF 구제 금융을 신청했습니다.","tip":"문민 정부 = 금융 실명제·지방 자치제.","w":["5·18 특별법 제정으로 재판받았습니다.","노태우 정부(1991)입니다.","김대중 정부입니다.",""],"p":"39강 현대(민주주의의 발전) › 김영삼 정부","h":0},
{"id":"K2-165","t":"39강 현대(민주주의의 발전)","q":"10월 유신(1972)으로 대통령은 통일 주체 국민 회의에서 간선으로 선출되었다.","c":["맞다","틀리다"],"a":0,"e":"유신 헌법은 대통령에게 긴급 조치권, 국회 해산권 등 막강한 권한을 부여했고 연임 제한을 없앴습니다.","tip":"유신 = 통일 주체 국민 회의.","w":["","이 설명은 옳은 내용입니다. 해설을 확인하세요."],"p":"39강 현대(민주주의의 발전) › 유신 체제","h":0},
{"id":"K2-166","t":"39강 현대(민주주의의 발전)","q":"부마 민주 항쟁(1979) 이후 박정희 대통령이 10·26 사태로 사망하였고 12·12 사태가 이어졌다.","c":["맞다","틀리다"],"a":0,"e":"신군부는 1979년 12·12 사태로 군권을 장악했습니다.","tip":"부마 → 10·26 → 12·12.","w":["","이 설명은 옳은 내용입니다. 해설을 확인하세요."],"p":"39강 현대(민주주의의 발전) › 부마 항쟁","h":0},
{"id":"K2-167","t":"39강 현대(민주주의의 발전)","q":"4·13 호헌 조치는 대통령 직선제 개헌을 약속한 노태우의 선언이다.","c":["맞다","틀리다"],"a":1,"e":"4·13 호헌 조치(1987)는 전두환이 직선제 개헌 논의를 중단하고 현행 헌법으로 선거를 치르겠다는 조치였습니다. 6·29 선언이 직선제 수용입니다.","tip":"4·13 = 호헌, 6·29 = 직선제.","w":["이 설명은 틀린 내용입니다. 해설에서 바른 내용을 확인하세요.",""],"p":"39강 현대(민주주의의 발전) › 4·13 호헌 조치","h":0},
{"id":"K2-168","t":"39강 현대(민주주의의 발전)","q":"김대중 정부는 최초로 여야 간 평화적 정권 교체를 이룬 정부이다.","c":["맞다","틀리다"],"a":0,"e":"1997년 대선에서 김대중이 당선되어 IMF 위기를 극복하고 6·15 남북 공동 선언(2000)을 발표했습니다.","tip":"김대중 = 최초 정권 교체.","w":["","이 설명은 옳은 내용입니다. 해설을 확인하세요."],"p":"39강 현대(민주주의의 발전) › 국민의 정부","h":0},
{"id":"K2-169","t":"40강 현대(경제 발전과 통일 정책)","q":"박정희 정부의 경제 정책으로 옳은 것은?","c":["금융 실명제를 실시하였다","제1차 경제 개발 5개년 계획에서는 경공업 중심 수출 주도 정책을 추진하였다","삼백 산업을 중심으로 미국 원조에 의존하였다","3저 호황으로 무역 흑자를 처음 기록하였다"],"a":1,"e":"제1차(1962~1966, 경공업·사회 간접 자본) → 제2차(1967~71, 석유 화학·철강) → 제3차·제4차(중화학 공업)로 전개되었고 새마을 운동(1970)도 추진되었습니다.","tip":"1차 = 경공업·수출 주도.","w":["김영삼 정부입니다.","","이승만 정부의 경제 구조입니다.","전두환 정부 후반입니다."],"p":"40강 현대(경제 발전과 통일 정책) › 경제 개발","h":1},
{"id":"K2-170","t":"40강 현대(경제 발전과 통일 정책)","q":"다음 사건에 대한 설명으로 옳은 것은?","c":["노동 운동이 확산되는 계기가 되었다","한일 협정 체결 직후에 일어났다","YH 무역 사건이 일어난 이후이다","3저 호황 시기에 일어났다"],"a":0,"e":"전태일 분신(1970)은 열악한 노동 환경을 사회에 알렸고 1979년 YH 무역 사건은 부마 항쟁의 계기가 되었습니다.","tip":"전태일 = 평화 시장·근로 기준법.","w":["","한일 협정(1965)과 별개의 사건입니다.","YH 무역 사건(1979)은 1970년 이후입니다.","1970년의 사건입니다."],"p":"40강 현대(경제 발전과 통일 정책) › 전태일 분신","h":1,"d":"서울 청계천 평화 시장의 재단사 전태일이 근로 기준법을 준수하라며 분신하였다."},
{"id":"K2-171","t":"40강 현대(경제 발전과 통일 정책)","q":"다음 협정에 대한 설명으로 옳은 것은?","c":["전두환 정부 때 체결되었다","독도 문제가 해결되었다","일본의 사과와 배상이 명확히 담겼다","6·3 시위에 이어 체결되었으며 식민 지배의 불법성이 명시되지 않았다"],"a":3,"e":"한일 협정(1965)은 청구권 협정 등으로 국교를 정상화했으나 굴욕 외교라는 비판 속에 6·3 시위(1964)가 일어났습니다.","tip":"한일 협정 = 박정희·1965·6·3 시위.","w":["1965년 박정희 정부 때 체결되었습니다.","독도 영유권 문제는 해결되지 않았습니다.","명확한 사과와 배상이 담기지 않았습니다.",""],"p":"40강 현대(경제 발전과 통일 정책) › 한일 협정","h":1,"d":"일본은 한국에 3억 달러의 무상 자금과 2억 달러의 차관을 제공한다."},
{"id":"K2-172","t":"40강 현대(경제 발전과 통일 정책)","q":"전두환 정부 시기의 경제 상황으로 옳은 것은?","c":["경부 고속 국도가 개통되었다","3저 호황으로 경제 성장과 사상 첫 무역 흑자를 기록하였다","외환 위기로 IMF 구제 금융을 받았다","한국이 OECD에 가입하였다"],"a":1,"e":"1980년대 후반 저유가·저달러·저금리의 3저 호황으로 무역 흑자를 달성했고 1988년 서울 올림픽이 개최되었습니다.","tip":"3저 호황 = 1980s 후반.","w":["박정희 정부 때(1970)입니다.","","김영삼 정부 말기(1997)입니다.","김영삼 정부 때(1996)입니다."],"p":"40강 현대(경제 발전과 통일 정책) › 1980년대 경제","h":0},
{"id":"K2-173","t":"40강 현대(경제 발전과 통일 정책)","q":"다음 합의문을 발표한 정부의 통일 정책으로 옳은 것은?","c":["한반도 비핵화 공동 선언이 발표되었다","6·15 남북 공동 선언이 발표되었다","남북 기본 합의서가 채택되었다","남북 조절 위원회를 설치하기로 합의하였다"],"a":3,"e":"7·4 남북 공동 성명(1972)은 자주·평화·민족 대단결의 3대 통일 원칙을 처음 합의한 문서이며 남북 적십자 회담을 계기로 추진되었습니다.","tip":"7·4 = 자주·평화·민족 대단결.","w":["1991년 노태우 정부 때입니다.","2000년 김대중 정부 때입니다.","1991년 노태우 정부 때입니다.",""],"p":"40강 현대(경제 발전과 통일 정책) › 7·4 남북 공동 성명","h":1,"d":"① 통일은 외세에 의존하거나 외세의 간섭을 받지 않고 자주적으로 해결해야 한다. ② 통일은 평화적 방법으로 실현해야 한다. ③ 사상과 이념, 제도의 차이를 초월하여 민족적 대단결을 도모해야 한다."},
{"id":"K2-174","t":"40강 현대(경제 발전과 통일 정책)","q":"노태우 정부의 통일 정책으로 옳은 것은?","c":["7·4 남북 공동 성명을 발표하였다","10·4 남북 공동 선언을 발표하였다","남북한이 유엔에 동시 가입하고 남북 기본 합의서를 채택하였다","6·15 남북 공동 선언을 발표하였다"],"a":2,"e":"노태우 정부(1988~1993)는 7·7 선언, 북방 외교(소련·중국과 수교), 남북 고위급 회담, 남북 기본 합의서(1991), 비핵화 공동 선언 등을 추진했습니다.","tip":"노태우 = 북방 외교·남북 기본 합의서.","w":["박정희 정부입니다.","노무현 정부입니다.","","김대중 정부입니다."],"p":"40강 현대(경제 발전과 통일 정책) › 노태우 정부","h":1},
{"id":"K2-175","t":"40강 현대(경제 발전과 통일 정책)","q":"다음 합의에 대한 설명으로 옳은 것은?","c":["1972년 박정희 정부 때 발표되었다","김대중 대통령이 평양에서 김정일 국방위원장과 회담한 결과 발표되었다","남북 기본 합의서가 함께 채택되었다","노무현 정부 때 종전 선언 추진을 합의하였다"],"a":1,"e":"6·15 남북 공동 선언(2000)을 계기로 이산가족 상봉, 경의선 복구, 개성 공단 건설 등 교류가 확대되었고 김대중은 노벨 평화상을 받았습니다.","tip":"6·15 = 김대중·평양·연합제 vs 낮은 단계 연방제.","w":["7·4 남북 공동 성명입니다.","","별개의 합의(1991)입니다.","10·4 남북 공동 선언(2007)입니다."],"p":"40강 현대(경제 발전과 통일 정책) › 6·15 남북 공동 선언","h":1,"d":"남과 북은 통일을 위한 남측의 연합제안과 북측의 낮은 단계의 연방제안이 서로 공통성이 있다고 인정하였다."},
{"id":"K2-176","t":"40강 현대(경제 발전과 통일 정책)","q":"제2차 경제 개발 5개년 계획 기간에 경부 고속 국도가 개통되었고, 포항 제철소가 준공되었다.","c":["맞다","틀리다"],"a":0,"e":"경부 고속 국도(1970), 포항 제철소(1973)로 중화학 공업의 기반이 마련되었습니다.","tip":"경부 고속 국도 = 1970.","w":["","이 설명은 옳은 내용입니다. 해설을 확인하세요."],"p":"40강 현대(경제 발전과 통일 정책) › 중화학 공업","h":0},
{"id":"K2-177","t":"40강 현대(경제 발전과 통일 정책)","q":"베트남 파병(1964~1973)은 브라운 각서를 통해 미국의 군사·경제 원조를 증대시키는 계기가 되었다.","c":["맞다","틀리다"],"a":0,"e":"파병은 외화 획득과 경제 성장에 기여했으나 고엽제 피해 등 문제도 남겼습니다.","tip":"브라운 각서 = 파병 대가.","w":["","이 설명은 옳은 내용입니다. 해설을 확인하세요."],"p":"40강 현대(경제 발전과 통일 정책) › 베트남 파병","h":0},
{"id":"K2-178","t":"40강 현대(경제 발전과 통일 정책)","q":"1997년 외환 위기로 IMF 구제 금융을 받았고 국민의 금 모으기 운동이 전개되었다.","c":["맞다","틀리다"],"a":0,"e":"IMF 구제 금융(1997.12) 이후 구조 조정이 진행되었고 2001년 IMF 차입금을 조기 상환했습니다.","tip":"IMF = 1997.","w":["","이 설명은 옳은 내용입니다. 해설을 확인하세요."],"p":"40강 현대(경제 발전과 통일 정책) › 외환 위기","h":0},
{"id":"K2-179","t":"40강 현대(경제 발전과 통일 정책)","q":"10·4 남북 공동 선언(2007)은 박근혜 정부 때 발표되었다.","c":["맞다","틀리다"],"a":1,"e":"10·4 남북 공동 선언은 노무현 정부 때 평양 정상 회담의 결과입니다.","tip":"10·4 = 노무현.","w":["이 설명은 틀린 내용입니다. 해설에서 바른 내용을 확인하세요.",""],"p":"40강 현대(경제 발전과 통일 정책) › 10·4 남북 공동 선언","h":0},
{"id":"K2-180","t":"21강 조선 전기(문화 2)","q":"훈민정음은 세조 때 창제되어 『동국정운』과 함께 반포되었다.","c":["맞다","틀리다"],"a":1,"e":"훈민정음은 세종 때 창제(1443)·반포(1446)되었고 『동국정운』은 세종 때 간행된 한자음 정리서입니다.","tip":"훈민정음 = 세종.","w":["이 설명은 틀린 내용입니다. 해설에서 바른 내용을 확인하세요.",""],"p":"21강 조선 전기(문화 2) › 훈민정음","h":0},
{"id":"K2-181","t":"22강 조선 후기(정치)","q":"경신환국으로 남인이 집권하고 서인이 몰락하였다.","c":["맞다","틀리다"],"a":1,"e":"경신환국(1680)으로 서인이 집권했고 남인이 집권한 환국은 기사환국(1689)입니다.","tip":"경신 = 서인 집권.","w":["이 설명은 틀린 내용입니다. 해설에서 바른 내용을 확인하세요.",""],"p":"22강 조선 후기(정치) › 환국","h":0},
{"id":"K2-182","t":"22강 조선 후기(정치)","q":"정조는 탕평비를 세우고 균역법을 시행하였다.","c":["맞다","틀리다"],"a":1,"e":"탕평비와 균역법은 영조의 정책이며 정조는 규장각, 초계문신제, 장용영, 신해통공을 추진했습니다.","tip":"탕평비·균역법 = 영조.","w":["이 설명은 틀린 내용입니다. 해설에서 바른 내용을 확인하세요.",""],"p":"22강 조선 후기(정치) › 영조와 정조","h":0},
{"id":"K2-183","t":"23강 조선 후기(조직, 외교)","q":"임진왜란 중 설치된 훈련도감은 양반만으로 구성된 지방군이었다.","c":["맞다","틀리다"],"a":1,"e":"훈련도감은 포수·사수·살수의 삼수병으로 구성된 중앙 군영이며 급료를 받는 직업 군인이 중심이었습니다.","tip":"훈련도감 = 중앙·직업 군인.","w":["이 설명은 틀린 내용입니다. 해설에서 바른 내용을 확인하세요.",""],"p":"23강 조선 후기(조직, 외교) › 5군영","h":0},
{"id":"K2-184","t":"24강 조선 후기(경제)","q":"영정법은 영조 때 실시되어 군포를 1필로 줄였다.","c":["맞다","틀리다"],"a":1,"e":"영정법은 인조 때 전세를 4~6두로 고정한 제도이며 군포를 1필로 줄인 것은 영조의 균역법입니다.","tip":"영정법 = 인조, 균역법 = 영조.","w":["이 설명은 틀린 내용입니다. 해설에서 바른 내용을 확인하세요.",""],"p":"24강 조선 후기(경제) › 영정법·균역법","h":0},
{"id":"K2-185","t":"24강 조선 후기(경제)","q":"대동법은 토지 1결당 쌀 12두를 거두는 대신 군포를 면제해 주는 제도이다.","c":["맞다","틀리다"],"a":1,"e":"대동법은 공납을 쌀·베·동전으로 대신 내게 한 제도이며 군포 면제와는 관련이 없습니다.","tip":"대동법 = 공납 개혁.","w":["이 설명은 틀린 내용입니다. 해설에서 바른 내용을 확인하세요.",""],"p":"24강 조선 후기(경제) › 대동법","h":0},

/* ---------- 신중 풀이 엔진 (화면과 무관한 순수 로직) ---------- */
const TARGET = 20;                        // 새 문제 첫 시도 정답 목표 수
const PENALTY_ON_RETRY_WRONG = false;     // true로 바꾸면 재도전 오답 시 추가 규칙을 넣을 수 있는 확장 훅(현재 미사용)

function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function targetFor(s){ return Math.min(TARGET, BANK[s].length); }

/* 새 문제 뽑기: 이번 세션에 나온 문제 제외 → 단원 비율 유지 → 예전에 안 푼 문제 우선 */
function drawNew(s, k, seenSession, hist){
  const bank = BANK[s];
  if(k <= 0) return [];
  const cand = bank.filter(q => !seenSession.has(q.id));
  if(cand.length === 0) return [];
  k = Math.min(k, cand.length);
  const share = {};
  bank.forEach(q => { share[q.t] = (share[q.t] || 0) + 1; });
  const quotas = Object.keys(share).map(t => { const x = k*share[t]/bank.length; return {t, n:Math.floor(x), r:x-Math.floor(x)}; });
  const left = k - quotas.reduce((a,x) => a + x.n, 0);
  quotas.slice().sort((a,b) => b.r - a.r).slice(0, left).forEach(x => x.n++);
  const byT = {};
  cand.forEach(q => (byT[q.t] = byT[q.t] || []).push(q));
  const prefer = arr => { const a = shuffle(arr); return a.filter(q => !hist.has(q.id)).concat(a.filter(q => hist.has(q.id))); };
  const chosen = [];
  quotas.forEach(x => chosen.push(...prefer(byT[x.t] || []).slice(0, x.n)));
  if(chosen.length < k){                       // 단원별 재고가 모자라면 남은 문제로 채움
    const ids = new Set(chosen.map(q => q.id));
    chosen.push(...prefer(cand.filter(q => !ids.has(q.id))).slice(0, k - chosen.length));
  }
  const out = shuffle(chosen).slice(0, k).map(q => q.id);
  out.forEach(id => hist.add(id));
  if(hist.size >= bank.length){ hist.clear(); out.forEach(id => hist.add(id)); }   // 문제은행 소진 → 기록 초기화(예전 문제로 채움)
  return out;
}

function newRun(s, name, date, hist){
  const run = {v:2, subj:s, name, date, target:targetFor(s), phase:'new',
    firstCorrect:0, retryQueue:[], seen:[], batch:[], batchNo:0,
    shown:0, newShown:0, firstWrong:0, retryShown:0, retryWrong:0, correctCount:0,
    retryStart:0, pendingIntro:false, ms:0};
  run.batch = drawNew(s, run.target, new Set(), hist);
  run.seen = run.batch.slice();
  if(run.batch.length === 0) run.phase = 'done';
  return run;
}

function currentId(run){ return run.phase === 'new' ? run.batch[0] : (run.phase === 'retry' ? run.retryQueue[0] : undefined); }

/* 답 제출: run을 직접 갱신하고 결과 정보를 돌려준다. skip=true면 집계 없이 문제만 넘긴다(문제은행 교체 대비). */
function submit(run, right, hist, skip){
  const info = {phase:run.phase, right:!!right, toRetry:false, done:false, exhausted:false};
  if(run.phase === 'new'){
    const id = run.batch.shift();
    if(!skip){
      run.shown++; run.newShown++;
      if(right){ run.firstCorrect++; run.correctCount++; }
      else { run.firstWrong++; run.retryQueue.push(id); }
    }
    if(run.batch.length === 0){
      if(run.firstCorrect < run.target){
        const more = drawNew(run.subj, run.target - run.firstCorrect, new Set(run.seen), hist);
        if(more.length === 0){ run.target = run.firstCorrect; info.exhausted = true; }   // 은행 소진 예외: 목표를 현재 정답 수로 낮춤
        else { run.batch = more; run.seen.push(...more); run.batchNo++; }
      }
      if(run.batch.length === 0){
        if(run.retryQueue.length){ run.phase = 'retry'; run.retryStart = run.retryQueue.length; run.pendingIntro = true; info.toRetry = true; }
        else { run.phase = 'done'; info.done = true; }
      }
    }
  } else if(run.phase === 'retry'){
    const id = run.retryQueue.shift();
    if(!skip){
      run.shown++; run.retryShown++;
      if(right){ run.correctCount++; }
      else {
        run.retryWrong++; run.retryQueue.push(id);      // 오답이면 큐 맨 뒤로, 새 문제는 추가하지 않음
        if(PENALTY_ON_RETRY_WRONG){ /* 확장 훅: 벌칙 규칙을 넣을 자리 */ }
      }
    }
    if(run.retryQueue.length === 0){ run.phase = 'done'; info.done = true; }
  }
  return info;
}
/*ENGINE_END*/

const SUBJ = {
  1: {name:'1~20강', title:'역사의 이해 ~ 조선 전기(문화 1)'},
  2: {name:'21~40강', title:'조선 전기(문화 2) ~ 현대'}
};
const DAYS = ['일','월','화','수','목','금','토'];

/* ---------- 저장소 (막히면 메모리로 대체) ---------- */
const mem = {};
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return (k in mem) ? mem[k] : d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){ mem[k] = v; } },
  del(k){ try{ localStorage.removeItem(k); }catch(e){ delete mem[k]; } }
};

const app = document.getElementById('app');
let name = store.get('kh_name', '');
let cur = null;          // 현재 문제 {id, q, order, answered}
let t0 = 0;
let clockTimer = null;

/* ---------- 유틸 ---------- */
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad = n => String(n).padStart(2,'0');
function todayKey(d = new Date()){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function fmtDate(d){ return d.getFullYear()+'.'+pad(d.getMonth()+1)+'.'+pad(d.getDate())+' ('+DAYS[d.getDay()]+')'; }
function fmtTime(d){ return pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds()); }
function fmtDur(ms){ const s = Math.round(ms/1000); return Math.floor(s/60)+'분 '+pad(s%60)+'초'; }
function hash4(str){ let h = 2166136261; for(let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h,16777619); } return (h>>>0).toString(36).toUpperCase().padStart(4,'0').slice(-4); }
const byId = (s, id) => BANK[s].find(q => q.id === id);

/* ---------- 상태 저장 ---------- */
function getHist(s){ return new Set(store.get('kh_seen_'+s, [])); }
function saveHist(s, h){ store.set('kh_seen_'+s, [...h]); }
function getRun(){ const r = store.get('kh_run', null); return (r && r.v === 2) ? r : null; }
function setRun(r){ r ? store.set('kh_run', r) : store.del('kh_run'); }
function getDone(){
  const all = store.get('kh_done', {});
  const keep = {}; const cutoff = Date.now() - 14*86400000;
  Object.keys(all).forEach(k => { if(new Date(k).getTime() >= cutoff) keep[k] = all[k]; });
  return keep;
}
function doneToday(s){ const d = getDone()[todayKey()]; return d && d[s] && d[s].name === name ? d[s] : null; }

function startRun(s){
  const hist = getHist(s);
  const run = newRun(s, name, todayKey(), hist);
  saveHist(s, hist);
  setRun(run);
  showQuestion();
}
const statusText = run => '새 문제 정답 '+run.firstCorrect+'/'+run.target+' · 재도전 대기 '+run.retryQueue.length;

/* ---------- 효과 ---------- */
const RM = (typeof matchMedia === 'function') && matchMedia('(prefers-reduced-motion: reduce)').matches;
function fxLayer(){
  let l = document.getElementById('fx');
  if(!l){ l = document.createElement('div'); l.id = 'fx'; l.className = 'fx'; document.body.appendChild(l); }
  return l;
}
function burst(x, y, opt){
  if(RM) return;
  try{
    const layer = fxLayer();
    const o = Object.assign({n:12, spread:70, size:8, fall:0, colors:['var(--ok)','var(--acc)'], dur:750}, opt || {});
    for(let i = 0; i < o.n; i++){
      const p = document.createElement('i');
      p.className = 'fp';
      const w = o.size * (0.6 + Math.random()*0.8);
      const h = Math.random() < .5 ? w : w*0.45;
      p.style.cssText = 'left:'+x+'px;top:'+y+'px;width:'+w+'px;height:'+h+'px;background:'+o.colors[i % o.colors.length]+';border-radius:'+(Math.random() < .4 ? '50%' : '2px');
      layer.appendChild(p);
      const a = Math.random()*Math.PI*2, d = o.spread*(0.4 + Math.random()*0.6);
      const dx = Math.cos(a)*d, dy = Math.sin(a)*d - o.spread*0.25;
      const r = (Math.random() - .5)*540;
      const an = p.animate([
        {transform:'translate(0,0) scale(.4) rotate(0deg)', opacity:1},
        {transform:'translate('+dx+'px,'+dy+'px) scale(1) rotate('+(r*0.6)+'deg)', opacity:1, offset:.55},
        {transform:'translate('+(dx*1.1)+'px,'+(dy + o.fall)+'px) scale(.8) rotate('+r+'deg)', opacity:0}
      ], {duration:o.dur*(0.8 + Math.random()*0.5), easing:'cubic-bezier(.16,.7,.3,1)', fill:'forwards'});
      an.onfinish = () => p.remove();
    }
  }catch(e){}
}
function celebrate(){
  if(RM) return;
  try{
    const w = window.innerWidth, h = window.innerHeight;
    const cols = ['var(--acc)','var(--ok)','#F59E0B','#EC4899','#3B82F6'];
    [[.18,.38],[.5,.3],[.82,.38]].forEach((pt, i) => setTimeout(() => burst(w*pt[0], h*pt[1], {n:28, spread:150, size:10, fall:280, colors:cols, dur:1500}), 300 + i*180));
  }catch(e){}
}

/* ---------- 화면: 홈 ---------- */
function stopClock(){ if(clockTimer){ clearInterval(clockTimer); clockTimer = null; } }
function home(){
  stopClock();
  if(!name){
    app.innerHTML = `
      <h1 class="rise" style="--i:0">한국사 심화 복습</h1>
      <p class="sub rise" style="--i:1">이름을 입력하면 바로 시작할 수 있습니다.</p>
      <div class="field rise" style="--i:2"><input id="nm" type="text" maxlength="10" placeholder="이름" autocomplete="off" aria-label="이름"><button class="btn" id="go">시작</button></div>`;
    const go = () => { const v = document.getElementById('nm').value.trim(); if(!v) return; name = v; store.set('kh_name', v); home(); };
    document.getElementById('go').onclick = go;
    document.getElementById('nm').onkeydown = e => { if(e.key === 'Enter') go(); };
    return;
  }
  const run = getRun();
  let cards = '';
  [1,2].forEach(s => {
    const d = doneToday(s);
    const resume = run && run.subj === s && run.name === name && run.date === todayKey();
    let status = `<div class="m">문제은행 ${BANK[s].length}문항 · 새 문제 ${targetFor(s)}개를 첫 시도에 맞히면 통과</div>`;
    if(d){ status = `<div class="m">오늘 학습 완료 · ${fmtDur(d.ms)}</div><span class="badge">✓ 오늘 완료</span>`; }
    else if(resume){ status = `<div class="m">풀던 문제 · ${statusText(run)}${run.phase==='retry'?' · 재도전 중':''}</div>`; }
    cards += `<div class="rise" style="--i:${s+2}"><button class="card s${s} ${d?'done':''}" data-s="${s}" data-act="${d?'cert':(resume?'resume':'new')}">
      <div class="n">${SUBJ[s].name}</div><div class="t">${SUBJ[s].title}</div>${status}</button>
      ${ (resume && !d) ? `<button class="link redo" data-s="${s}" data-act="new">새 문제로 다시 시작</button>` : '' }
      ${ d ? `<button class="link redo" data-s="${s}" data-act="new">한 번 더 풀기</button>` : '' }</div>`;
  });
  app.innerHTML = `
    <div class="who rise" style="--i:0"><span><b>${esc(name)}</b>님, 복습할 범위를 고르세요.</span><button class="link" id="chg">이름 변경</button></div>
    <h1 class="rise" style="--i:1">한국사 심화 복습</h1>
    <p class="sub rise" style="--i:2">매번 문제와 보기 순서가 달라집니다. 새 문제를 첫 시도에 모두 맞히고, 틀린 문제까지 다시 맞히면 학습이 끝납니다.</p>
    <div class="subjects">${cards}</div>`;
  document.getElementById('chg').onclick = () => { name = ''; store.del('kh_name'); home(); };
  app.querySelectorAll('[data-act]').forEach(b => b.onclick = () => {
    const s = +b.dataset.s, act = b.dataset.act;
    if(act === 'cert') return certificate(s, doneToday(s), false);
    if(act === 'resume') return showQuestion();
    startRun(s);
  });
}

/* ---------- 화면: 문제 ---------- */
function goNext(){
  const w = (typeof document.querySelector === 'function') ? document.querySelector('.qwrap') : null;
  if(!w || RM){ showQuestion(); return; }
  w.classList.add('leave');
  setTimeout(showQuestion, 230);
}

function barPct(run){
  if(run.phase === 'retry' && run.retryStart > 0) return Math.round((1 - run.retryQueue.length / Math.max(run.retryStart, run.retryQueue.length)) * 100);
  return run.target ? Math.round(run.firstCorrect / run.target * 100) : 100;
}

function showQuestion(){
  stopClock();
  const run = getRun();
  if(!run) return home();
  if(run.phase === 'done') return finish(run);
  if(run.pendingIntro) return showIntro(run);
  const s = run.subj;
  const id = currentId(run);
  const q = byId(s, id);
  if(!q){                                     // 문제은행이 바뀌어 없는 문제 → 집계 없이 넘김
    const hist = getHist(s); submit(run, false, hist, true); saveHist(s, hist); setRun(run);
    return showQuestion();
  }
  const isOX = q.c.length === 2;
  const order = isOX ? [0,1] : shuffle(q.c.map((_,i)=>i));      // 보기 순서는 매번 다시 섞음(재도전 포함)
  cur = {id, q, order, answered:false};
  t0 = Date.now();
  const retry = run.phase === 'retry';
  const choices = order.map((oi, pos) => isOX
    ? `<button class="choice ox" style="--i:${pos}" data-pos="${pos}">${oi===0?'○ 맞다':'✕ 틀리다'}</button>`
    : `<button class="choice" style="--i:${pos}" data-pos="${pos}"><span class="k">${pos+1}</span><span>${esc(q.c[oi])}</span></button>`).join('');
  app.innerHTML = `
    <div class="s${s} qwrap">
      <div class="top"><button class="link" id="pause">홈으로</button><span class="chip">${SUBJ[s].name}</span></div>
      <div class="stat" aria-live="polite">새 문제 정답 <b id="fc">${run.firstCorrect}</b>/${run.target} <span class="dim2">·</span> 재도전 대기 <b id="rq">${run.retryQueue.length}</b></div>
      <div class="bar"><i style="width:${barPct(run)}%"></i></div>
      <div class="topic"><span>${esc(q.t)}</span>${retry?'<span class="retry">재도전</span>':''}${q.h?'<span class="hot">기출 빈출</span>':''}</div>
      <h2 class="q">${esc(q.q)}</h2>
      ${q.d ? `<div class="passage"><i>자료</i>${esc(q.d)}</div>` : ''}
      <div class="choices">${choices}</div>
      <div id="fb"></div>
    </div>`;
  document.getElementById('pause').onclick = home;
  app.querySelectorAll('.choice').forEach(b => b.onclick = () => answer(+b.dataset.pos));
  if(typeof window !== 'undefined' && window.scrollTo) window.scrollTo(0, 0);
}

function bumpEl(el, v){ if(!el) return; el.textContent = v; el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }

function answer(pos){
  if(!cur || cur.answered) return;
  cur.answered = true;
  const run = getRun();
  const {q, order} = cur;
  const chosenIdx = order[pos];
  const right = chosenIdx === q.a;
  const hist = getHist(run.subj);
  run.ms += Math.min(Date.now() - t0, 120000);
  const info = submit(run, right, hist);
  saveHist(run.subj, hist);
  setRun(run);

  const btns = app.querySelectorAll('.choice');
  btns.forEach((b,i) => {
    b.disabled = true;
    const k = b.querySelector('.k');
    if(i === pos){ b.classList.add('picked', right ? 'ok' : 'bad'); if(k) k.textContent = right ? '✓' : '✕'; }
    else if(order[i] === q.a){ b.classList.add('ok', 'late'); if(k) k.textContent = '✓'; }
    else b.classList.add('dim');
  });
  const bi = app.querySelector('.bar i');
  if(bi) bi.style.width = barPct(run) + '%';
  bumpEl(document.getElementById('rq'), run.retryQueue.length);
  if(right && info.phase === 'new') bumpEl(document.getElementById('fc'), run.firstCorrect);
  if(right){
    const pk = btns[pos];
    if(pk){ const t = pk.querySelector('.k') || pk; const r = t.getBoundingClientRect(); burst(r.left + r.width/2, r.top + r.height/2, {n:14, spread:75, size:8}); }
  }

  const tip = q.tip ? `<div class="tip">💡 ${esc(q.tip)}</div>` : '';
  let html = '';
  if(right){
    html = `<div class="fb ok" role="status"><b>${info.phase==='retry' ? '정답입니다 · 재도전 성공' : '정답입니다'}</b><p>${esc(q.e)}</p>${tip}</div>`;
  } else {
    const need = run.target - run.firstCorrect;
    const banner = info.phase === 'new'
      ? `<div class="notice" role="status"><b>틀린 문제는 나중에 다시 풀어야 합니다.</b> 통과하려면 새 문제 ${run.target}개를 첫 시도에 맞혀야 하니 신중하게 풀어보세요.${need>0?` (필요한 새 문제: 앞으로 ${need}개)`:''}</div>`
      : `<div class="notice" role="status"><b>다시 틀렸습니다.</b> 이 문제는 재도전 대기열 맨 뒤로 갑니다. 재도전을 모두 맞혀야 학습이 끝납니다.</div>`;
    const why = q.w && q.w[chosenIdx] ? q.w[chosenIdx] : '정답이 아닙니다.';
    html = banner + `
      <div class="fb bad" role="status">
        <b>${info.phase==='new' ? '오답입니다 · 재도전 단계에서 다시 나옵니다' : '오답입니다'}</b>
        <div class="part"><i>① 내가 고른 보기가 틀린 이유</i><p>“${esc(q.c[chosenIdx])}”<br>${esc(why)}</p></div>
        <div class="part"><i>② 정답 해설</i><p><b class="ans">정답: ${esc(q.c[q.a])}</b>${esc(q.e)}</p></div>
        <div class="part"><i>③ 풀이 팁</i><p>${esc(q.tip || '')}</p></div>
        <div class="part"><i>④ 관련 단원</i><p>${esc(q.p)}</p></div>
      </div>`;
  }
  const label = info.done ? '결과 보기' : (info.toRetry ? '재도전으로 넘어가기' : '다음 문제');
  document.getElementById('fb').innerHTML = html + `<button class="btn wide nx" id="next">${label}</button>`;
  const nb = document.getElementById('next');
  nb.onclick = goNext;
  nb.focus({preventScroll:true});
  if(nb.scrollIntoView) nb.scrollIntoView({block:'nearest', behavior: RM ? 'auto' : 'smooth'});
}

/* ---------- 화면: 새 문제 통과 → 재도전 전환 안내 ---------- */
function showIntro(run){
  const s = run.subj;
  app.innerHTML = `
    <div class="s${s}">
      <div class="cert intro">
        <svg class="chk" viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="26" r="23"/><path d="M15 27l8 8 15-16"/></svg>

        <div class="stats">
          <div style="--j:0"><span>첫 시도 정답</span><b>${run.firstCorrect}개</b></div>

/* ---------- 완료 ---------- */
function finish(run){
  const s = run.subj;
  const at = Date.now();
  const rec = {name, ms:run.ms, target:run.target, shown:run.shown, firstWrong:run.firstWrong, retries:run.retryShown, at,
    code: hash4(name+'|'+todayKey()+'|'+s+'|'+at)};
  const all = getDone();
  const k = todayKey();
  all[k] = all[k] || {};
  all[k][s] = rec;
  store.set('kh_done', all);
  setRun(null);
  certificate(s, rec, true);
}

function certificate(s, rec, fresh){
  stopClock();
  const at = new Date(rec.at);
  const T = rec.target;
  app.innerHTML = `
    <div class="s${s}">
      <div class="cert">
        <svg class="chk" viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="26" r="23"/><path d="M15 27l8 8 15-16"/></svg>
        <div class="h">오늘 학습 완료</div>
        <div class="name">${esc(rec.name)}</div>
        <div class="subj">${SUBJ[s].name} · ${SUBJ[s].title}</div>
        <div class="score"><span id="sc">${T}</span><small> / ${T} 새 문제 첫 시도 정답</small></div>
        <div class="stats">
          <div style="--j:0"><span>완료 일시</span><b>${fmtDate(at)}<br>${fmtTime(at)}</b></div>
          <div style="--j:1"><span>소요 시간</span><b>${fmtDur(rec.ms)}</b></div>
          <div style="--j:2"><span>총 출제 수</span><b>${rec.shown}문항</b></div>
          <div style="--j:3"><span>첫 시도 오답</span><b>${rec.firstWrong}문항</b></div>
          <div style="--j:4"><span>재도전 횟수(재오답 포함)</span><b>${rec.retries}회</b></div>
          <div style="--j:5"><span>확인 코드</span><b>${esc(rec.code)}</b></div>
        </div>
        <div class="clock"><span><i class="dot"></i>현재 시각</span><b id="clk"></b><div class="d" id="cd"></div></div>
      </div>
      <div class="actions">
        <button class="btn line" id="home">홈으로</button>
      </div>
    </div>`;
  const tick = () => { const n = new Date(); document.getElementById('clk').textContent = fmtTime(n); document.getElementById('cd').textContent = fmtDate(n); };
  tick(); clockTimer = setInterval(tick, 1000);
  document.getElementById('home').onclick = home;
  if(typeof window !== 'undefined' && window.scrollTo) window.scrollTo(0, 0);
  const sc = document.getElementById('sc');
  if(sc && !RM && typeof requestAnimationFrame === 'function' && typeof performance !== 'undefined'){
    sc.textContent = '0';
    const st = performance.now(), dur = 1000;
    (function step(t){
      const p = Math.min(1, (t - st) / dur);
      sc.textContent = Math.round(T * (1 - Math.pow(1 - p, 3)));
      if(p < 1) requestAnimationFrame(step);
    })(st);
  }
  if(fresh) celebrate();
}
